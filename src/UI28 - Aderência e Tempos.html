holder=\"Buscar por nome, email ou fila\" autocomplete=\"off\"><span class=\"picker-count\" id=\"agentPickerCount\" style=\"display:none;\"><\/span><div class=\"agent-dropdown\" id=\"agentDropdown\"><\/div><\/div><div class=\"field\"><label>&nbsp;<\/label><button class=\"btn secondary btn-clear\" id=\"clearFilters\">Limpar filtros<\/button><\/div><div class=\"active-filters\" id=\"agentChips\"><\/div><\/div><div id=\"legendWrap\"><div class=\"legend\"><div class=\"legend-group\"><span class=\"legend-item\"><span class=\"dot\" style=\"background:var(--c-disponivel)\"><\/span>Disponível<\/span><span class=\"legend-item\"><span class=\"dot\" style=\"background:var(--c-assincrono)\"><\/span>Assíncrono<\/span><\/div><div class=\"legend-item\"><span class=\"dot\" style=\"background:var(--c-pos)\"><\/span>Pós<\/div><div class=\"legend-item\"><span class=\"dot\" style=\"background:var(--c-almoco)\"><\/span>Almoço<\/div><div class=\"legend-item\"><span class=\"dot\" style=\"background:var(--c-banheiro)\"><\/span>Banheiro<\/div><div class=\"legend-item\"><span class=\"dot\" style=\"background:var(--c-treinamento)\"><\/span>Treinamento<\/div><div class=\"legend-item\"><span class=\"dot\" style=\"background:var(--c-feedback)\"><\/span>Feedback<\/div><div class=\"legend-item\"><span class=\"dot\" style=\"background:var(--c-lanche)\"><\/span>Lanche<\/div><div class=\"legend-item\"><span class=\"dot\" style=\"background:var(--c-offline);border:1px solid var(--line)\"><\/span>Offline<\/div><\/div><div class=\"legend-note\">Disponível e Assíncrono contam juntos como <b>tempo disponível<\/b>. Pós, Treinamento e Feedback são <b>pausa operacional<\/b> — separadas da <b>pausa pessoal<\/b> (Almoço, Banheiro, Lanche). Indisponibilidade = pausa pessoal + pausa operacional.<\/div><\/div><\/div><div class=\"tabs main-tabs\" id=\"mainTabs\"><div class=\"tab main-tab active\" data-main=\"adherence\"><span class=\"tab-ico\">◎<\/span>Aderência<\/div><div class=\"tab main-tab\" data-main=\"averages\"><span class=\"tab-ico\">⏱<\/span>Tempos médios<\/div><div class=\"tab main-tab\" data-main=\"pauses\"><span class=\"tab-ico\">⏸<\/span>Pausas<\/div><div class=\"tab main-tab tab-data\" data-main=\"data\" title=\"Área administrativa — envio de dados e backups\">⚙ Dados<\/div><\/div><div class=\"sub-tabs\" id=\"subTabs\" style=\"display:none;\"><div class=\"tab sub-tab\" data-tab=\"timeline\">Linha do tempo<\/div><div class=\"tab sub-tab\" data-tab=\"table\">Tabela detalhada<\/div><div class=\"tab sub-tab\" data-tab=\"simultaneity\">Simultaneidade<\/div><div class=\"tab sub-tab\" data-tab=\"managerial\">Visão gerencial<\/div><\/div><div class=\"tab-panel\" id=\"panel-adherence\"><div class=\"adh-mode-bar\"><div class=\"seg\" id=\"adhModeSeg\"><button type=\"button\" data-mode=\"escala\"><span class=\"seg-dot\" style=\"background:var(--pink)\"><\/span>Aderência à escala<\/button><button type=\"button\" data-mode=\"jornada\"><span class=\"seg-dot\" style=\"background:var(--c-disponivel)\"><\/span>Aderência de jornada<\/button><\/div><div class=\"adh-mode-hint\">À escala: horário e almoço contam. De jornada: só o tempo logado sobre a carga horária.<\/div><\/div><div class=\"adh-concept\" id=\"adhConcept\"><\/div><div class=\"adh-hero\"><div class=\"adh-hero-main\"><div class=\"adh-ring\" id=\"adhRing\"><\/div><div class=\"adh-hero-text\"><div class=\"adh-hero-label\" id=\"adhHeroLabel\">Aderência do período<\/div><div class=\"adh-hero-status\" id=\"adhStatus\">—<\/div><div class=\"adh-hero-sub\" id=\"adhHeroSub\"><\/div><div class=\"adh-rule\" id=\"adhRule\"><\/div><div class=\"adh-scale\"><span><i style=\"background:var(--c-disponivel)\"><\/i>≥ 90% ótimo<\/span><span><i style=\"background:var(--gold)\"><\/i>75–89% atenção<\/span><span><i style=\"background:var(--c-late)\"><\/i>&lt; 75% crítico<\/span><\/div><\/div><\/div><div class=\"adh-hero-side\"><div class=\"adh-mini\" id=\"adhMiniA\"><\/div><div class=\"adh-mini\" id=\"adhMiniB\"><\/div><\/div><\/div><div class=\"adh-stat-grid\" id=\"adhStats\"><\/div><div class=\"adh-grid-2\"><div class=\"card\"><div class=\"section-title\">Para onde foi o tempo previsto? <span class=\"st-sub\">— horas da escala que viraram aderência e as que se perderam<\/span><\/div><div class=\"adh-stack\" id=\"adhStack\"><\/div><div class=\"adh-stack-legend\" id=\"adhStackLegend\"><\/div><div class=\"adh-dist-grid\"><div id=\"adhDistA\"><\/div><div id=\"adhDistB\"><\/div><\/div><\/div><div class=\"card\"><div class=\"section-title\">Aderência por dia <span class=\"st-sub\">— tempo aderente sobre o previsto em cada dia · linha = meta de 90%<\/span><\/div><div class=\"trend-chart adh-trend\" id=\"adhTrend\"><\/div><\/div><\/div><div class=\"card\"><div class=\"adh-view-head\"><div class=\"section-title\" style=\"margin:0;\" id=\"adhViewTitle\">Aderência por coordenação<\/div><div class=\"seg\" id=\"adhViewSeg\"><button type=\"button\" data-view=\"coord\">Por coordenação<\/button><button type=\"button\" data-view=\"agent\">Por agente<\/button><\/div><\/div><div id=\"adhCoordChip\" class=\"active-filters\" style=\"padding-top:10px;border-top:none;\"><\/div><div class=\"table-wrap\"><table class=\"adh-table\" id=\"adhTable\"><thead id=\"adhThead\"><\/thead><tbody id=\"adhTbody\"><\/tbody><\/table><\/div><div class=\"dc-hint\" id=\"adhTableHint\" style=\"margin-top:8px;\"><\/div><\/div><div class=\"card\"><div class=\"section-title\">Mapa de aderência <span class=\"st-sub\">— um quadrado por agente e dia; passe o mouse para ver o detalhe<\/span><\/div><div class=\"adh-quad\" id=\"adhQuad\"><\/div><div class=\"adh-map-legend\"><span class=\"lg\"><i class=\"hm a1\"><\/i>≥ 95%<\/span><span class=\"lg\"><i class=\"hm a2\"><\/i>85–94%<\/span><span class=\"lg\"><i class=\"hm a3\"><\/i>70–84%<\/span><span class=\"lg\"><i class=\"hm a4\"><\/i>&lt; 70%<\/span><span class=\"lg\"><i class=\"hm falta\"><\/i>Falta, Atestado ou Day Off<\/span><span class=\"lg\"><i class=\"hm ferias\"><\/i>Férias<\/span><span class=\"lg\"><i class=\"hm atestado\"><\/i>Licença<\/span><span class=\"lg\"><i class=\"hm feriado\"><\/i>Feriado<\/span><span class=\"lg\"><i class=\"hm nosched\"><\/i>Sem escala<\/span><span class=\"lg\"><i class=\"hm none\"><\/i>Folga / não esperado<\/span><\/div><div class=\"adh-map-wrap\" id=\"adhMap\"><\/div><\/div><\/div><div class=\"tab-panel\" id=\"panel-timeline\"><div class=\"card\"><div class=\"month-nav\"><button class=\"day-nav-btn\" id=\"monthPrev\" title=\"Mês anterior\">‹<\/button><div class=\"mn-label\"><div class=\"mn-title\" id=\"monthLabel\">—<\/div><div class=\"mn-sub\" id=\"monthSub\">—<\/div><\/div><button class=\"day-nav-btn\" id=\"monthNext\" title=\"Próximo mês\">›<\/button><\/div><div class=\"day-pills\" id=\"dayPills\"><\/div><div class=\"timeline-header\"><h3>Linha do tempo por agente <span id=\"tlDayLabel\" style=\"font-weight:500;color:var(--ink-dim);font-size:12.5px;\"><\/span><\/h3><span class=\"timeline-count\" id=\"tlCount\"><\/span><\/div><div class=\"sim-hint\" style=\"margin-bottom:10px;\">Pontos ao lado do nome (quando há escala cadastrada) — 1º ponto, <b>entrada<\/b>: <span class=\"tl-att-dot\" style=\"background:var(--c-early)\"><\/span> antecipada · <span class=\"tl-att-dot\" style=\"background:var(--c-disponivel)\"><\/span> no horário · <span class=\"tl-att-dot\" style=\"background:var(--c-late)\"><\/span> atrasada &nbsp;|&nbsp; 2º ponto, <b>jornada<\/b>: <span class=\"tl-att-dot\" style=\"background:var(--c-disponivel)\"><\/span> cumprida · <span class=\"tl-att-dot\" style=\"background:var(--c-late)\"><\/span> incompleta. Passe o mouse sobre o nome para o detalhe.<\/div><div id=\"tlScaleWrap\"><\/div><div class=\"tl-rows\" id=\"tlRows\"><\/div><\/div><\/div><div class=\"tab-panel\" id=\"panel-table\"><div class=\"card\"><div class=\"month-nav\"><button class=\"day-nav-btn\" id=\"tableMonthPrev\" title=\"Mês anterior\">‹<\/button><div class=\"mn-label\"><div class=\"mn-title\" id=\"tableMonthLabel\">—<\/div><div class=\"mn-sub\" id=\"tableMonthSub\">—<\/div><\/div><button class=\"day-nav-btn\" id=\"tableMonthNext\" title=\"Próximo mês\">›<\/button><\/div><div class=\"day-pills\" id=\"tableDayPills\"><\/div><div class=\"sim-hint\" id=\"tableDayFilterHint\" style=\"display:none;\"><\/div><\/div><div class=\"table-card\"><table id=\"detailTable\"><thead><tr><th data-key=\"date\">Data<\/th><th data-key=\"agent\">Agente<\/th><th data-key=\"team\">Fila<\/th><th data-key=\"status\">Status<\/th><th data-key=\"start\">Início<\/th><th data-key=\"end\">Fim<\/th><th data-key=\"durationMin\">Duração<\/th><\/tr><\/thead><tbody id=\"detailTbody\"><\/tbody><\/table><\/div><\/div><div class=\"tab-panel\" id=\"panel-summary\"><div class=\"agent-summary-grid\" id=\"summaryGrid\"><\/div><\/div><div class=\"tab-panel\" id=\"panel-simultaneity\"><div class=\"card\"><div class=\"month-nav\"><button class=\"day-nav-btn\" id=\"simMonthPrev\" title=\"Mês anterior\">‹<\/button><div class=\"mn-label\"><div class=\"mn-title\" id=\"simMonthLabel\">—<\/div><div class=\"mn-sub\" id=\"simMonthSub\">—<\/div><\/div><button class=\"day-nav-btn\" id=\"simMonthNext\" title=\"Próximo mês\">›<\/button><\/div><div class=\"day-pills\" id=\"simDayPills\"><\/div><div class=\"sim-metrics\" id=\"simMetrics\"><\/div><div class=\"section-title\" style=\"margin-top:20px;\">Indisponibilidade ao longo do dia<\/div><div class=\"sim-chart-legend\"><span class=\"legend-item\"><span class=\"dot\" style=\"background:var(--c-almoco)\"><\/span>Pausa pessoal<\/span><span class=\"legend-item\"><span class=\"dot\" style=\"background:var(--c-pos)\"><\/span>Pausa operacional<\/span><span class=\"legend-item\"><span class=\"line-key\" style=\"background:var(--c-disponivel)\"><\/span>Agentes logados<\/span><\/div><div id=\"simChart\" class=\"sim-chart\"><\/div><div class=\"sim-hint\">O gráfico mostra como a indisponibilidade coletiva variou ao longo do dia. Todos os valores são contagens instantâneas — número inteiro de agentes distintos, minuto a minuto.<\/div><\/div><div class=\"card\"><div class=\"section-title\">Leitura por faixa de 30 minutos <span style=\"font-weight:500;color:var(--ink-faint);font-size:11.5px;\">— médias ponderadas no tempo · clique numa faixa para ver quem estava indisponível<\/span><\/div><div class=\"table-card\" style=\"border:none;padding:0;max-height:340px;\"><table><thead><tr><th>Faixa<\/th><th>Indisponíveis (média)<\/th><th>Pessoal<\/th><th>Operacional<\/th><th>Logados (média)<\/th><th>% indisponível<\/th><\/tr><\/thead><tbody id=\"simBandsTbody\"><\/tbody><\/table><\/div><\/div><\/div><div class=\"tab-panel\" id=\"panel-data\"><div class=\"admin-disclaimer\"><span class=\"admin-disclaimer-icon\">⚙️<\/span><div><b>Área administrativa — manutenção do painel<\/b><p>Quem só consulta o painel não precisa mexer aqui. Esta aba serve para quem alimenta os dados: o relatório da Twilio (envio frequente) e quatro cadastros de apoio (envio ocasional). Tudo fica salvo e vale para todo mundo que abrir o painel.<\/p><\/div><\/div><div class=\"data-step\"><div class=\"data-step-head\"><span class=\"step-n\">1<\/span><div><div class=\"step-title\">Tempos da Twilio<\/div><div class=\"step-sub\">Envio frequente — é o que alimenta todas as abas.<\/div><\/div><\/div><div class=\"card data-card data-card-main\"><div class=\"dc-grid\"><div><div class=\"dc-title\">Relatório “Tempos de agente · Aderência” <span class=\"dc-fmt\">.xlsx<\/span><\/div><div class=\"dc-sub\">Cada envio atualiza <b>apenas as datas contidas no arquivo<\/b>; os outros dias continuam guardados. Pode enviar o mesmo dia de novo para corrigir.<\/div><ul class=\"dc-list\"><li>Exporte o relatório na Twilio com o período desejado.<\/li><li>Escolha o arquivo e clique em <b>Confirmar envio<\/b>.<\/li><li>Confira em “Dados da Twilio até” (no topo do painel) se a data avançou.<\/li><\/ul><\/div><div class=\"dc-actions\"><div class=\"upload-row\"><input type=\"file\" id=\"fileInput\" accept=\".xlsx,.xls\"><button class=\"btn btn-sm\" id=\"uploadBtn\">Escolher arquivo<\/button><span class=\"file-name-tag\" id=\"fileNameTag\">nenhum arquivo<\/span><\/div><div class=\"confirm-row\"><button class=\"btn btn-confirm\" id=\"confirmUploadBtn\" disabled>Confirmar envio<\/button><\/div><span class=\"upload-status-text\" id=\"uploadStatusText\"><\/span><\/div><\/div><\/div><\/div><div class=\"data-step\"><div class=\"data-step-head\"><span class=\"step-n\">2<\/span><div><div class=\"step-title\">Cadastros de apoio<\/div><div class=\"step-sub\">Envio ocasional — enviados uma vez, ficam salvos. Reenvie só quando a planilha mudar.<\/div><\/div><\/div><div class=\"data-grid-3\"><div class=\"card data-card\"><div class=\"dc-title\">Headcount Consolidado <span class=\"dc-fmt\">.csv<\/span><span class=\"badge-ok\" id=\"hcBadge\" style=\"display:none;\">salvo<\/span><\/div><div class=\"dc-sub\">Define <b>quem está no time<\/b>, o <b>coordenador atual<\/b> de cada agente e a <b>escala<\/b> (entrada e saída) usada na aderência.<\/div><div class=\"dc-status\" id=\"hcStatus\">Não carregado.<\/div><div class=\"dc-cols\">Colunas usadas: <code>email<\/code>, <code>Coordenação/Gerencia<\/code>, <code>entrada<\/code>, <code>saida<\/code><\/div><div class=\"upload-row\" style=\"justify-content:flex-start;\"><input type=\"file\" id=\"headcountInput\" accept=\".csv\"><button class=\"btn secondary btn-sm\" id=\"headcountBtn\">Enviar Headcount<\/button><span class=\"file-name-tag\" id=\"headcountNameTag\">nenhum arquivo<\/span><\/div><div class=\"dc-hint\" id=\"hcNote\">Processa na hora, ao escolher o arquivo. Substitui o Headcount anterior por completo.<\/div><\/div><div class=\"card data-card\"><div class=\"dc-title\">Férias <span class=\"dc-fmt\">.csv<\/span><span class=\"badge-ok\" id=\"vacBadge\" style=\"display:none;\">salvo<\/span><\/div><div class=\"dc-sub\">Planilha <b>WFM – Férias – Consolidado<\/b>. Os dias em que o agente estava de férias <b>não contam na aderência<\/b>.<\/div><div class=\"dc-status\" id=\"vacStatus\">Não carregado.<\/div><div class=\"dc-cols\">Colunas usadas: <code>Nome Completo<\/code>, <code>Período Início<\/code>, <code>Período Final<\/code>, <code>E-mail<\/code> (quando falta, casa pelo nome)<\/div><div class=\"upload-row\" style=\"justify-content:flex-start;\"><input type=\"file\" id=\"vacationsInput\" accept=\".csv\"><button class=\"btn secondary btn-sm\" id=\"vacationsBtn\">Enviar Férias<\/button><span class=\"file-name-tag\" id=\"vacationsNameTag\">nenhum arquivo<\/span><\/div><div class=\"dc-hint\">Processa na hora, ao escolher o arquivo. Substitui a lista anterior por completo.<\/div><\/div><div class=\"card data-card\"><div class=\"dc-title\">Controle de logados <span class=\"dc-fmt\">.csv<\/span><span class=\"badge-ok\" id=\"logBadge\" style=\"display:none;\">salvo<\/span><\/div><div class=\"dc-sub\">Abas mensais da planilha <b>Controle de logados<\/b>. Dizem, dia a dia, se o agente era esperado, estava de folga, férias ou licença ou foi desligado, e trazem a <b>escala e o horário de almoço<\/b> do mês. Atestado conta como falta.<\/div><div class=\"dc-status\" id=\"logStatus\">Não carregado.<\/div><div class=\"dc-cols\">Colunas usadas: <code>Agentes<\/code>, <code>E-mail<\/code>, <code>Entrada<\/code>, <code>Saída<\/code>, <code>Almoço<\/code> e as colunas de data (<code>dd/mm/aaaa<\/code>)<\/div><div class=\"upload-row\" style=\"justify-content:flex-start;\"><input type=\"file\" id=\"logadosInput\" accept=\".csv\" multiple><button class=\"btn secondary btn-sm\" id=\"logadosBtn\">Enviar meses do Controle<\/button><span class=\"file-name-tag\" id=\"logadosNameTag\">nenhum arquivo<\/span><\/div><div class=\"dc-hint\">Um arquivo por mês (exporte cada aba do mês em CSV). Pode selecionar <b>vários meses de uma vez<\/b> para reprocessar o histórico. Reenviar um mês substitui só aquele mês. Sem o controle, o painel usa o Headcount e 1h de almoço livre.<\/div><\/div><div class=\"card data-card\"><div class=\"dc-title\">Histórico de gestão <span class=\"dc-fmt\">.csv<\/span><span class=\"badge-ok\" id=\"mgmtBadge\" style=\"display:none;\">salvo<\/span><\/div><div class=\"dc-sub\">Base <b>Histórico de Gestão dos Agentes<\/b>. Diz <b>com qual coordenação o agente estava em cada período<\/b>, para a aderência de cada coordenação refletir o time que ela tinha naquela data.<\/div><div class=\"dc-status\" id=\"mgmtStatus\">Não carregado.<\/div><div class=\"dc-cols\">Colunas usadas: <code>Email do Analista<\/code>, <code>Coordenacao<\/code>, <code>Data Inicio<\/code>, <code>Data Fim<\/code> (vazia = ainda vigente)<\/div><div class=\"upload-row\" style=\"justify-content:flex-start;\"><input type=\"file\" id=\"mgmtInput\" accept=\".csv\"><button class=\"btn secondary btn-sm\" id=\"mgmtBtn\">Enviar Histórico<\/button><span class=\"file-name-tag\" id=\"mgmtNameTag\">nenhum arquivo<\/span><\/div><div class=\"dc-hint\">Processa na hora, ao escolher o arquivo. Sem histórico, vale o coordenador do Headcount.<\/div><\/div><\/div><\/div><div class=\"data-step\"><div class=\"data-step-head\"><span class=\"step-n\">3<\/span><div><div class=\"step-title\">Situação e segurança<\/div><div class=\"step-sub\">O que está salvo e como guardar uma cópia.<\/div><\/div><\/div><div class=\"data-grid-2\"><div class=\"card data-card\" id=\"statusCard\"><div class=\"dc-title\">Status dos dados<\/div><div class=\"dc-body\" id=\"statusBox\" style=\"margin-top:10px;\"><\/div><\/div><div class=\"card data-card\"><div class=\"dc-title\">Backup e restauração<\/div><div class=\"dc-sub\">Uma cópia de segurança de tudo: tempos, Headcount, férias, histórico e classificações.<\/div><div class=\"dc-body\" style=\"margin-top:12px;\"><div class=\"upload-row\" style=\"justify-content:flex-start;\"><button class=\"btn btn-sm\" id=\"exportBackupBtn\">Exportar backup (.json)<\/button><input type=\"file\" id=\"restoreInput\" accept=\".json\"><button class=\"btn secondary btn-sm\" id=\"restoreBtn\">Restaurar backup…<\/button><\/div><div class=\"dc-hint\"><b>Exportar<\/b> salva um a s da Twilio que não sejam Offline nem Almoço, no dia inteiro (mesmo fora da\n// escala), com a hora extra contando inteira. Filtros próprios do cartão: atuação principal da pessoa e coordenação.\nconst AP_SHR_META = 70;                     // projeção: 70% trabalhado · 30% shrinkage\nconst AP_SHR_ATENCAO = 35;                  // shrinkage acima de 30% e até 35%: atenção; acima de 35%: crítico\nconst AP_SHR_CARGA = 480;                   // 8h de trabalho por pessoa-dia (a 1h de almoço não entra)\nconst AP_SHR_ATUS = [['', 'Todos'], ['0800 e Chat', '0800 e Chat'], ['Assíncrono', 'Assíncrono']];   // 0800 e Chat são as mesmas pessoas\nlet apShrF = { atu:'', coord:'' };\nfunction apShrAtuacao(e, dias){\n  const t = {};\n  dias.forEach(iso => { const x = (AP.dias[e]||{})[iso]; if(!x || x.s!=='T') return; (x.b||[]).forEach(b => { const d = (timeToMin(b[2])||0) - (timeToMin(b[1])||0); if(d > 0){ const a = (b[0]==='0800' || b[0]==='Chat') ? '0800 e Chat' : b[0]; t[a] = (t[a]||0) + d; } }); });\n  let m = '', v = -1; Object.keys(t).forEach(k => { if(t[k] > v){ v = t[k]; m = k; } }); return m;\n}\nfunction apShrinkCalc(){\n  const r = { pessoas:0, prev:0, trab:0, extra:0, extraFolga:0, dias:[], perda:{ ferias:0, licenca:0, ausencia:0, parcial:0 }, porDia:{},\n              off:{ min:0, diasTrab:0, diasOff:0, porPessoa:{} } };\n  if(!AP || !dateFrom || !dateTo) return r;\n  const fim = AP.ultimo && AP.ultimo < dateTo ? AP.ultimo : dateTo;\n  const min = new Map(), offs = new Map();\n  PERIODS.forEach(p => {\n    const k = p.email+'|'+p.date;\n    if(groupOf(p.status)==='offline'){ if(!offs.has(k)) offs.set(k, []); offs.get(k).push(p); return; }\n    if(p.status==='Almoço') return;\n    min.set(k, (min.get(k)||0) + (p.durationMin||0));\n  });\n  const dias = []; for(let d = new Date(dateFrom+'T12:00:00Z'); ; d.setUTCDate(d.getUTCDate()+1)){ const iso = d.toISOString().slice(0,10); if(iso > fim) break; dias.push(iso); }\n  const trabDias = {};\n  const sobre = (a1, a2, b1, b2) => Math.max(0, Math.min(a2, b2) - Math.max(a1, b1));\n  AP.pessoas.forEach(p => {\n    const e = p.e, coord = p.c || 'Sem coordenação';\n    if(selectedAgents.size && !selectedAgents.has(e)) return;\n    if(!isKnownAgent(e) || !agentMatchesCoordinator(e)) return;\n    if(apShrF.coord && coord !== apShrF.coord) return;\n    if(apShrF.atu && apShrAtuacao(e, dias) !== apShrF.atu) return;\n    dias.forEach(iso => {\n      const x = (AP.dias[e]||{})[iso]; if(!x) return;\n      const st = x.p || '';\n      if(st==='DESLIGADO' || st==='MOVIMENTACAO' || x.s==='SEM') return;\n      const t = min.get(e+'|'+iso) || 0;\n      if(x.s==='F' || st==='FOLGA'){ if(t > 0){ r.trab += t; r.extra += t; r.extraFolga += t; const pf = r.porDia[iso] || (r.porDia[iso] = { prev:0, trab:0, n:0 }); pf.trab += t; } return; }\n      r.pessoas++; r.prev += AP_SHR_CARGA; r.trab += t;\n      const pd = r.porDia[iso] || (r.porDia[iso] = { prev:0, trab:0, n:0 }); pd.prev += AP_SHR_CARGA; pd.trab += t; pd.n++;\n      if(t > 0){\n        if(t >= AP_SHR_CARGA) r.extra += t - AP_SHR_CARGA; else r.perda.parcial += AP_SHR_CARGA - t;\n        // visão complementar: Offline dentro do horário da escala (sem contar a hora de almoço)\n        if(x.s==='T' && x.i && x.f){\n          const ini = timeToMin(x.i), fi = timeToMin(x.f), al = x.a ? timeToMin(x.a) : null;\n          let o = 0; (offs.get(e+'|'+iso)||[]).forEach(q => { o += sobre(q.startMin, q.endMin, ini, fi); if(al != null) o -= sobre(q.startMin, q.endMin, Math.max(ini, al), Math.min(fi, al + 60)); });\n          r.off.diasTrab++; trabDias[e] = (trabDias[e]||0) + 1;\n          if(o > 0){ r.off.min += o; r.off.diasOff++; const pp = r.off.porPessoa[e] || (r.off.porPessoa[e] = { e:e, n:p.n, c:coord, min:0, dias:0, trab:0 }); pp.min += o; pp.dias++; }\n        }\n        return;\n      }\n      if(x.s==='FER' || st==='FERIAS') r.perda.ferias += AP_SHR_CARGA;\n      else if(x.s==='LIC' || st==='LICENCA') r.perda.licenca += AP_SHR_CARGA;\n      else r.perda.ausencia += AP_SHR_CARGA;   // falta, atestado, day off ou escalado sem nenhum minuto trabalhado na Twilio\n    });\n  });\n  Object.keys(r.off.porPessoa).forEach(e => { r.off.porPessoa[e].trab = trabDias[e] || 0; }); r.off.agentesTrab = Object.keys(trabDias).length;   // dias trabalhados de quem teve Offline\n  r.dias = dias.filter(d => r.porDia[d] && r.porDia[d].prev);\n  return r;\n}\nfunction apShrinkMontar(){\n  let card = document.getElementById('apShrink'); if(card) return card;\n  const hero = document.querySelector('#panel-adherence .adh-hero'); if(!hero) return null;\n  const w = document.createElement('div'); w.className = 'ap-topo'; hero.parentNode.insertBefore(w, hero); w.appendChild(hero);\n  card = document.createElement('div'); card.className = 'ap-shr'; card.id = 'apShrink'; w.appendChild(card);\n  const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'ap-info'; bt.innerHTML = AP_ICO_INFO + 'Como é calculada';\n  bt.onclick = () => apModal('Como Funciona a Aderência à Escala', '<div class=\"adh-concept\">' + ((document.getElementById('adhConcept')||{}).innerHTML||'') + '<\\/div>');\n  hero.appendChild(bt);\n  return card;\n}\nconst AP_ICO_INFO = '<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9.5\"/><path d=\"M12 11v6M12 7.5v.01\"/><\\/svg>';\nconst AP_SHR_CONCEITO = `\n  <div><div class=\"ct\">O que mede<\\/div><div class=\"cb\">Quanto da <b>carga horária do time<\\/b> foi de fato <b>trabalhada na Twilio<\\/b>. Olha todas as pessoas do Customer nos dias em que deveriam estar disponíveis — inclusive em <b>férias, licença e ausências<\\/b> — e compara as horas trabalhadas com as horas que o time teria se todos trabalhassem 8h. <b>Shrinkage<\\/b> é a parte da carga que se perdeu. A projeção é <b>70–30<\\/b>: 70% trabalhado e 30% de shrinkage.<\\/div><\\/div>\n  <div><div class=\"ct\">Como é calculada<\\/div><div class=\"cb\"><b>Horas trabalhadas ÷ horas previstas.<\\/b> Cada pessoa-dia vale <b>8h previstas<\\/b> (a 1h de almoço não entra). Trabalhado é qualquer status da Twilio que não seja <b>Offline<\\/b> nem <b>Almoço<\\/b>, no dia inteiro, mesmo fora da escala; a hora extra conta. Shrinkage = 100% − esse percentual.<\\/div>\n    <div class=\"ex\">Um dia com 3 pessoas: Ana trabalhou <code>8h<\\/code>, Bruno <code>6h<\\/code> (chegou 2h atrasado) e Carla estava de férias.<br>Previsto: 3 × 8h = <code>24h<\\/code> · trabalhado: <code>14h<\\/code> → <code>58,3%<\\/code> trabalhado · shrinkage <code>41,7%<\\/code>.<\\/div><\\/div>\n  <div><div class=\"ct\">O que conta como perda<\\/div><div class=\"cb\"><ul>\n    <li><b>Férias e licença<\\/b>: 8h previstas e nada trabalhado.<\\/li>\n    <li><b>Ausência<\\/b>: falta, atestado, day off ou escalado sem nenhum minuto na Twilio = 8h perdidas.<\\/li>\n    <li><b>Horas não trabalhadas<\\/b>: atraso, saída antecipada, Offline no meio do dia ou jornada menor que 8h.<\\/li>\n    <li><b>Hora extra<\\/b> compensa: minutos além das 8h e trabalho em dia de folga.<\\/li>\n    <li class=\"no\">Fica de fora: folga, desligamento, movimentação e quem não tem escala no painel.<\\/li>\n    <li class=\"no\">Filtro de atuação: vale a atuação principal da pessoa no período (a que ocupa mais horas da escala); 0800 e Chat contam juntos.<\\/li>\n  <\\/ul><\\/div><\\/div>`;\nfunction apHoras(m){ const h = Math.floor(Math.round(m)/60), mm = Math.round(m) % 60; return h.toLocaleString('pt-BR') + 'h' + (mm ? String(mm).padStart(2,'0') : ''); }\n// ---------- janela (modal) dentro do quadro, aberta na parte da página que está na tela ----------\nfunction apModalFechar(){\n  document.querySelectorAll('.ap-mdl-fundo').forEach(x => x.remove()); document.removeEventListener('keydown', apModalEsc);\n  try { const d = window.parent.document.getElementById('apMdlFundo'); if(d) d.remove(); const fr = window.fram
