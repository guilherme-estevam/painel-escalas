<style>
/* ===================== editor do colaborador: horário de trabalho ===================== */
.hor-cad{margin-top:18px;padding-top:16px;border-top:1px solid var(--c2)}
.hor-cad h4{margin:0 0 4px;font-size:15px}
.hor-cad .atual{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;margin:6px 0 12px}
.hor-cad .atual span{display:inline-block;height:auto;line-height:1.3;background:var(--c1);border-radius:10px;padding:5px 10px;font-size:12.5px;color:var(--c4)}
.hor-cad .atual span b{color:var(--preto)}
.hor-cad .atual span.hpl{background:var(--roxo-bg);color:var(--roxo)}
.hor-cad .lin{display:grid;grid-template-columns:repeat(3,minmax(0,170px));gap:10px}
.hor-cad .lin .campo{margin:0}
.hor-cad .lin input{font-weight:700}
.hor-cad .opc{display:flex;gap:10px;align-items:flex-start;background:var(--c1);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:13px;cursor:pointer}
.hor-cad .opc input{margin-top:3px;flex:none}
.hor-cad .opc small{display:block;color:var(--c4);margin-top:2px}
.hor-cad .bts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media (max-width:700px){ .hor-cad .lin{grid-template-columns:1fr 1fr} }
</style>
<script>
/* ===================== aba Cadastro: trocar o horário de trabalho da pessoa ===================== */
function montarHorarioCad(btnCoord){
  var c=btnCoord.parentNode, st=c.querySelector('.ficha strong'); if(!st || !estado.plan) return;
  var email=st.textContent.trim(), p=estado.plan.porEmail[email]; if(!p) return;
  var mes=estado.plan.mes, temDia=!!(estado.planInfo && estado.planInfo.comHorario && estado.planInfo.comHorario[email]), nomeMes=rotuloMes(mes).toLowerCase();
  var box=document.createElement('div'); box.className='hor-cad';
  function desenhar(){
    box.innerHTML='<h4>Horário de trabalho</h4><div class="dica">Mude o horário de entrada e saída da pessoa. A mudança vale na hora e fica no histórico.</div>'+
      '<div class="atual"><span>Horário atual: <b>'+esc(p.entrada)+' às '+esc(p.saida)+'</b></span><span>Headcount: <b>'+esc(p.entradaHc||p.entrada)+' às '+esc(p.saidaHc||p.saida)+'</b></span>'+(temDia?'<span class="hpl">Em '+nomeMes+' tem horário por dia (planilha)</span>':'')+'</div>'+
      '<div class="lin"><div class="campo"><label for="hcEnt">Entrada</label><input id="hcEnt" type="time" value="'+esc(p.entrada)+'"></div><div class="campo"><label for="hcSai">Saída</label><input id="hcSai" type="time" value="'+esc(p.saida)+'"></div><div class="campo" id="hcAlmBox" style="display:none"><label for="hcAlm">Almoço (opcional)</label><input id="hcAlm" type="time"></div></div>'+
      (temDia?'<label class="opc"><input type="checkbox" id="hcDias"><span><b>Aplicar também aos dias de '+nomeMes+' que têm horário próprio</b><small>Esses dias vêm da planilha. Se marcar, todos passam a usar o horário acima, as atuações voltam para a divisão padrão e a escala precisa ser publicada de novo.</small></span></label>':'')+
      '<div class="campo" style="margin-top:12px"><label for="hcMot">Motivo (opcional, aparece no histórico)</label><input id="hcMot" type="text" maxlength="200" placeholder="Ex.: mudança de turno a pedido da coordenação"></div>'+
      '<div class="bts"><button class="btn roxo" id="hcOk">Salvar horário</button>'+((p.entradaHc && (p.entradaHc!==p.entrada || p.saidaHc!==p.saida))?'<button class="btn sec" id="hcHc">Voltar ao horário do headcount</button>':'')+'</div>';
    var dias=box.querySelector('#hcDias'); if(dias) dias.onchange=function(){ box.querySelector('#hcAlmBox').style.display=this.checked?'':'none'; };
    box.querySelector('#hcOk').onclick=function(){ salvar('DEFINIR', this); };
    var hc=box.querySelector('#hcHc'); if(hc) hc.onclick=function(){ salvar('HEADCOUNT', this); };
  }
  function salvar(modo, bt){
    var ent=box.querySelector('#hcEnt').value, sai=box.querySelector('#hcSai').value, alm=box.querySelector('#hcAlm').value, mot=box.querySelector('#hcMot').value.trim(), dias=box.querySelector('#hcDias'), tambemDias=modo==='DEFINIR' && dias && dias.checked;
    if(modo==='DEFINIR'){
      if(!ent || !sai){ toast('Informe a entrada e a saída.', true); return; }
      if(aMin(sai)<=aMin(ent)){ toast('A saída precisa ser depois da entrada.', true); return; }
      if(tambemDias && alm && (aMin(alm)<=aMin(ent) || aMin(alm)+60>aMin(sai))){ toast('O almoço precisa caber dentro do horário.', true); return; }
      if(modo==='DEFINIR' && ent===p.entrada && sai===p.saida && !tambemDias){ toast('O horário já é esse.'); return; }
    }
    var rot=bt.textContent; ocupado(bt,true,'Salvando…');
    chamar('apiAlterarHorarios', estado.token, [email], modo, ent, sai, 0, mot).then(function(r){
      if(!r.ok){ ocupado(bt,false,rot); toast(r.msg,true); return null; }
      if(modo==='HEADCOUNT'){ p.entrada=p.entradaHc; p.saida=p.saidaHc; } else { p.entrada=ent; p.saida=sai; }
      estado.pessoas=null;
      if(!tambemDias) return {so:true};
      return chamar('apiAjustarHorarios', estado.token, mes, [email], 'DEFINIR', ent, alm, sai, 0, mot);
    }).then(function(r2){
      if(r2===null) return;
      ocupado(bt,false,rot);
      if(r2 && r2.so){ var fs=c.querySelectorAll('.ficha strong'); if(fs[2]) fs[2].textContent=p.entrada+' às '+p.saida; atualizarLinha(email); desenhar(); toast('Horário de '+primeiro(p.nome)+': '+p.entrada+' às '+p.saida+'.'); return; }
      if(r2 && r2.ok===false){ toast(r2.msg,true); return; }
      toast('Horário de '+primeiro(p.nome)+' mudou para '+ent+' às '+sai+', também nos dias de '+nomeMes+'. Publique a escala para valer.');
      var fundo=c.closest('.modal-fundo'); if(fundo) fundo.remove(); carregarPlanoMantendo();
    }).catch(function(e){ ocupado(bt,false,rot); falhaGeral(e); });
  }
  desenhar();
  btnCoord.parentNode.insertBefore(box, btnCoord.nextSibling);
}
new MutationObserver(function(){ var b=document.getElementById('edCoordOk'); if(b && !b._hor){ b._hor=1; montarHorarioCad(b); } }).observe(document.getElementById('modais'), {childList:true, subtree:true});
</script>
