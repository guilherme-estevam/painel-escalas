@media (max-width:620px){ .numeros.vdn{grid-template-columns:repeat(2,minmax(0,1fr))!important} }

.vdn-l{max-height:min(58vh,560px);overflow:auto;border:1px solid var(--c2,#E6DFEE);border-radius:14px}
html[data-tema="escuro"] .vdn-l{border-color:#2c2636}
.vdn-g{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;padding:8px 14px;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--c4);background:var(--c1,#F7F4FA);border-bottom:1px solid var(--c2,#E6DFEE)}

.vdn-r:focus-visible{outline:2px solid var(--rosa,#D80073);outline-offset:-2px}

.vdn-h{font-size:12.5px;font-weight:800;color:var(--preto);font-variant-numeric:tabular-nums;white-space:nowrap}
.vdn-h small{font-weight:700;color:var(--c4)}
.vdn-vz{padding:28px;text-align:center;color:var(--c4);font-weight:700}
@media (max-width:620px){ .vdn-r{grid-template-columns:auto minmax(0,1fr)} .vdn-r .ex{grid-column:2;justify-content:flex-start} }
