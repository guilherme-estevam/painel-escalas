<style>
/* ===================== Solicitações (16/11/2026) ===================== */
.sol{--s-e:cubic-bezier(.23,1,.32,1);--s-rosa:#D80073;--s-roxo:#4F3F91;--s-tx:var(--preto,#1c1823);--s-tx2:var(--c4,#6d6679);--s-sup:var(--sup,#fff);--s-sup2:var(--sup2,#F6F2FA);--s-ln:var(--c2,#E6DFEE);display:flex;flex-direction:column;gap:18px;padding-bottom:30px}
html[data-tema="escuro"] .sol,html[data-tema="escuro"] .solm{--s-tx:#f1edf7;--s-tx2:#a59fb3;--s-sup:#1f1f26;--s-sup2:#28283a;--s-ln:#35313f}
.solm{--s-e:cubic-bezier(.23,1,.32,1);--s-rosa:#D80073;--s-roxo:#4F3F91;--s-tx:var(--preto,#1c1823);--s-tx2:var(--c4,#6d6679);--s-sup:var(--sup,#fff);--s-sup2:var(--sup2,#F6F2FA);--s-ln:var(--c2,#E6DFEE)}
.sol-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:26px 28px;border-radius:22px;color:#fff;background:linear-gradient(120deg,#2a1f4f 0%,#4F3F91 42%,#B0005E 100%);background-size:160% 160%;animation:solGrad 16s ease-in-out infinite alternate,solSobe .7s var(--s-e) both}
.sol-hero::after{content:"";position:absolute;inset:-40% -10% auto auto;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 62%);pointer-events:none}
.sol-hero small{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.sol-hero h1{margin:4px 0 6px;font-size:28px;line-height:1.1;color:#fff}
.sol-hero p{margin:0;max-width:640px;font-size:13.5px;line-height:1.55;opacity:.92}
.sol-hero .sx-ap{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;opacity:.95}.sol-hero .sx-ap .av{width:26px!important;height:26px!important;margin-left:-8px;box-shadow:0 0 0 2px rgba(255,255,255,.7)}.sol-hero .sx-ap .av:first-of-type{margin-left:0}
.sol-novo{position:relative;z-index:1;display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border:0;border-radius:14px;background:#fff;color:#2a1f4f;font:inherit;font-size:14.5px;font-weight:800;cursor:pointer;box-shadow:0 14px 34px -14px rgba(0,0,0,.55);transition:transform .16s var(--s-e),box-shadow .2s}
.sol-novo svg{width:18px;height:18px;color:var(--s-rosa)}.sol-novo:active{transform:scale(.97)}
.sol-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}@media (max-width:1280px){ .sol-kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
.sol-kpi{position:relative;padding:16px 18px;border-radius:16px;background:var(--s-sup);border:1px solid var(--s-ln);overflow:hidden}
.sol-kpi::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--k)}
.sol-kpi b{display:block;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:28px;line-height:1.05;color:var(--s-tx);font-variant-numeric:tabular-nums}
.sol-kpi span{display:block;margin-top:6px;font-size:12.5px;font-weight:800;color:var(--s-tx)}.sol-kpi small{display:block;margin-top:2px;font-size:11.5px;color:var(--s-tx2)}
.sol-kpi.sx-urg b{color:#C2185B}.sol-kpi.sx-urg.zero b{color:var(--s-tx)}
.sol-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.sol-seg{display:inline-flex;gap:3px;padding:4px;border-radius:14px;background:var(--s-sup2);border:1px solid var(--s-ln)}
.sol-seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.sol-seg::-webkit-scrollbar{display:none}.sol-seg button{flex:none}
.sol-seg button{position:relative;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:0;border-radius:10px;background:transparent;color:var(--s-tx2);font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:color .15s,background-color .2s}
.sol-seg button.on{background:var(--s-sup);color:var(--s-tx);box-shadow:0 2px 8px -3px rgba(40,20,60,.25)}
.sol-seg button i{font-style:normal;min-width:20px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--s-rosa) 12%,transparent);color:var(--s-rosa);font-size:11px;font-weight:800;text-align:center}
.sol-fs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sol-fs select,.sol-fs input{height:38px;padding:0 12px;border-radius:11px;border:1.5px solid var(--s-ln);background:var(--s-sup);color:var(--s-tx);font:inherit;font-size:13px;font-weight:600}
.sol-fs input{min-width:240px}
.sol-fs select,.sol-fs .sb{width:200px!important;min-width:0;margin:0!important;flex:none}
.sol-fs .sb select{width:100%!important}.sol-fs select:focus,.sol-fs input:focus{outline:0;border-color:var(--s-rosa)}
.sol-lista{display:flex;flex-direction:column;gap:10px}
.sol-grupo{margin:6px 0 2px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--s-tx2)}
.sol-card{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:16px 18px 16px 20px;border-radius:16px;border:1px solid var(--s-ln);background:var(--s-sup);color:var(--s-tx);font:inherit;text-align:left;cursor:pointer;overflow:hidden;transition:transform .2s var(--s-e),box-shadow .25s,border-color .2s}
.sol-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pk,#9b93a8)}
.sol-card .sx-ic{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--tk,#4F3F91) 12%,transparent);color:var(--tk,#4F3F91)}.sol-card .sx-ic svg{width:22px;height:22px}
.sol-card .sx-t1{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.sol-card .sx-t1 b{font-size:15px}
.sol-card .sx-rs{margin:4px 0 8px;font-size:13px;line-height:1.45;color:var(--s-tx2)}
.sol-card .sx-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:12px;color:var(--s-tx2)}
.sol-card .sx-avs{display:inline-flex}.sol-card .sx-avs .av{width:26px!important;height:26px!important;margin-left:-7px;box-shadow:0 0 0 2px var(--s-sup)}.sol-card .sx-avs .av:first-child{margin-left:0}
.sol-card .sx-seta{width:18px;height:18px;color:var(--s-tx2);transition:transform .2s var(--s-e),color .2s}
.sol-pri,.sol-st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.sol-pri::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-URGENTE{--pk:#E53958}.p-ALTA{--pk:#F08A24}.p-MEDIA{--pk:#3D7BE0}.p-BAIXA{--pk:#8C8A99}
.sol-pri.p-URGENTE{color:#D3214A;background:color-mix(in srgb,#E53958 12%,transparent)}.sol-pri.p-ALTA{color:#C46A0C;background:color-mix(in srgb,#F08A24 14%,transparent)}.sol-pri.p-MEDIA{color:#2E66C8;background:color-mix(in srgb,#3D7BE0 12%,transparent)}.sol-pri.p-BAIXA{color:#6d6a78;background:color-mix(in srgb,#8C8A99 14%,transparent)}
.sol-pri.p-URGENTE::before{animation:solPulso 1.6s ease-out infinite}
.sol-st.s-PENDENTE{color:#7a5a00;background:#FFF3C9}.sol-st.s-APROVADA{color:#1B7A43;background:#DDF5E6}.sol-st.s-RECUSADA{color:#B3261E;background:#FCE3E1}.sol-st.s-CANCELADA{color:#5d5a68;background:#ECEAF1}
html[data-tema="escuro"] .sol-st.s-PENDENTE{color:#F6D365;background:#3a3216}html[data-tema="escuro"] .sol-st.s-APROVADA{color:#7BE0A4;background:#173826}html[data-tema="escuro"] .sol-st.s-RECUSADA{color:#FF9A92;background:#41201e}html[data-tema="escuro"] .sol-st.s-CANCELADA{color:#bdb8c8;background:#2c2a33}
.sol-vazio{display:flex;flex-direction:column;align-items:center;gap:8px;padding:46px 20px;border-radius:18px;border:1.5px dashed var(--s-ln);color:var(--s-tx2);text-align:center}.sol-vazio svg{width:40px;height:40px;color:var(--s-rosa);opacity:.7}.sol-vazio b{color:var(--s-tx);font-size:15px}
/* entrada em cascata ao rolar */
.sol-rv{opacity:0;transform:translate3d(0,18px,0);transition:opacity .55s var(--s-e),transform .7s var(--s-e)}.sol-rv.sol-in{opacity:1;transform:none}
/* janelas */
.modal-fundo.sol-pf{align-items:center;overflow:hidden;padding:20px 18px}
.modal-fundo.sol-pf>.modal{max-width:min(980px,96vw)!important;width:100%;max-height:calc(100vh - 40px)!important;max-height:calc(100dvh - 40px)!important;overflow:hidden!important;padding:0!important;display:flex;flex-direction:column;border-radius:22px!important;box-shadow:0 30px 70px -20px rgba(20,10,30,.45)}
.modal-fundo.sol-pf>.modal>.solm{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.solm-cab{flex:none;display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--s-ln)}
.solm-cab .sx-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--tk,#4F3F91) 12%,transparent);color:var(--tk,#4F3F91)}.solm-cab .sx-ic svg{width:20px;height:20px}
.solm .solm-cab h2{margin:0!important;padding:0!important;border:0!important;font-size:17px!important;line-height:1.25!important;letter-spacing:0!important;text-transform:none!important;color:var(--s-tx)!important}.solm-cab p{margin:2px 0 0;font-size:12.5px;color:var(--s-tx2)}
.solm-x{margin-left:auto;display:grid;place-items:center;width:36px;height:36px;border-radius:11px;border:1px solid var(--s-ln);background:var(--s-sup2);color:var(--s-tx);cursor:pointer}.solm-x svg{width:16px;height:16px}
.solm-corpo{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:20px 22px 24px}
.solm-pe{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--s-ln);background:var(--s-sup)}
.solm-pe .sx-esq{margin-right:auto;font-size:12px;color:var(--s-tx2)}
.sol-bt{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;border:1.5px solid var(--s-ln);background:var(--s-sup);color:var(--s-tx);font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;transition:transform .14s var(--s-e),background-color .2s,border-color .2s,opacity .2s}
.sol-bt svg{width:16px;height:16px}.sol-bt:active{transform:scale(.97)}.sol-bt:disabled{opacity:.45;cursor:not-allowed;transform:none}
.sol-bt.sx-pri{border-color:transparent;background:linear-gradient(135deg,#D80073,#9B1B8E);color:#fff;box-shadow:0 10px 24px -12px rgba(216,0,115,.7)}
.sol-bt.ok{border-color:transparent;background:#1F9D57;color:#fff;box-shadow:0 10px 24px -12px rgba(31,157,87,.7)}
.sol-bt.no{color:#C0392B;border-color:color-mix(in srgb,#C0392B 35%,transparent)}
/* passo 1: tipos */
.sol-tipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sol-tipo{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:16px;border:1.5px solid var(--s-ln);background:var(--s-sup);color:var(--s-tx);font:inherit;text-align:left;cursor:pointer;transition:transform .2s var(--s-e),border-color .2s,box-shadow .25s;animation:solSobe .5s var(--s-e) both}
.sol-tipo .sx-ic{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--tk) 12%,transparent);color:var(--tk)}.sol-tipo .sx-ic svg{width:21px;height:21px}
.sol-tipo b{font-size:14.5px}.sol-tipo span{font-size:12.5px;line-height:1.45;color:var(--s-tx2)}.sol-tipo em{font-style:normal;font-size:11.5px;color:var(--tk);font-weight:700}
/* passo 2: formulário */
.sol-passo{animation:solEntra .45s var(--s-e) both}
.sol-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.sol-f .sx-lg{grid-column:1 / -1}
.sol-c{display:flex;flex-direction:column;gap:6px;min-width:0}
.sol-c>label{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--s-tx2)}
.sol-c input,.sol-c select,.sol-c textarea{width:100%;box-sizing:border-box;min-height:42px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--s-ln);background:var(--s-sup);color:var(--s-tx);font:inherit;font-size:14px}
.sol-c textarea{min-height:96px;resize:vertical;line-height:1.5}
.sol-c input:focus,.sol-c select:focus,.sol-c textarea:focus{outline:0;border-color:var(--s-rosa);box-shadow:0 0 0 4px color-mix(in srgb,var(--s-rosa) 12%,transparent)}
.sol-c .sx-dica{font-size:12px;line-height:1.4;color:var(--s-tx2);min-height:16px}.sol-c .sx-dica b{color:var(--s-tx)}.sol-c .sx-dica.t{color:#1B7A43}.sol-c .sx-dica.f{color:#9b6a00}
.sol-c .sx-cont{align-self:flex-end;font-size:11px;color:var(--s-tx2)}.sol-c .sx-cont.ok{color:#1B7A43}
.sol-pk{position:relative}
.sol-pk-l{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 6px);max-height:300px;overflow-y:auto;padding:6px;border-radius:14px;border:1px solid var(--s-ln);background:var(--s-sup);box-shadow:0 24px 50px -24px rgba(30,20,50,.45);animation:solSobe .22s var(--s-e) both}
.sol-pk-l button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:8px 10px;border:0;border-radius:10px;background:transparent;color:var(--s-tx);font:inherit;text-align:left;cursor:pointer}
.sol-pk-l button b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sol-pk-l button small{display:block;font-size:11.5px;color:var(--s-tx2)}.sol-pk-l button i{font-style:normal;font-size:11px;color:var(--s-tx2)}
.sol-pk-l .sx-vz{padding:14px;text-align:center;font-size:12.5px;color:var(--s-tx2)}
.sol-pk-esc{display:flex;align-items:center;gap:10px;min-height:42px;padding:6px 10px;border-radius:12px;border:1.5px solid var(--s-rosa);background:color-mix(in srgb,var(--s-rosa) 5%,var(--s-sup))}
.sol-pk-esc .av{width:30px!important;height:30px!important}.sol-pk-esc b{font-size:13.5px}.sol-pk-esc small{display:block;font-size:11.5px;color:var(--s-tx2)}
.sol-pk-esc button{margin-left:auto;border:0;background:transparent;color:var(--s-rosa);font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.sol-ops{display:flex;flex-wrap:wrap;gap:8px}
.sol-op{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--s-ln);background:var(--s-sup);color:var(--s-tx);font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:border-color .2s,background-color .2s}
.sol-op.on{border-color:var(--s-rosa);background:color-mix(in srgb,var(--s-rosa) 8%,var(--s-sup))}
.sol-op .sx-pt{width:9px;height:9px;border-radius:50%;background:var(--pk)}
.sol-chk{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:700;color:var(--s-tx);cursor:pointer}.sol-chk input{width:18px;height:18px;accent-color:#D80073}
.sol-erros{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:#FFF1EF;border:1px solid #F5C6BF;color:#8E2A1F;font-size:13px;line-height:1.45;animation:solSobe .3s var(--s-e) both}
html[data-tema="escuro"] .sol-erros{background:#3a1d1a;border-color:#6b2c26;color:#ffb3aa}
/* prévia antes × depois */
.sol-prev{display:flex;flex-direction:column;gap:12px}
.sol-pv{border-radius:16px;border:1px solid var(--s-ln);overflow:hidden;background:var(--s-sup);animation:solSobe .45s var(--s-e) both}
.sol-pv-cab{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--s-sup2)}.sol-pv-cab .av{width:32px!important;height:32px!important}.sol-pv-cab b{font-size:14px;color:var(--s-tx)}.sol-pv-cab small{display:block;font-size:11.5px;color:var(--s-tx2)}
.sol-pv-l{display:grid;grid-template-columns:132px minmax(0,1fr) 24px minmax(0,1fr);gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--s-ln);font-size:12.5px;animation:solLinha .45s var(--s-e) both;animation-delay:calc(var(--i,0) * 55ms)}
.sol-pv-l .sx-dt{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:700;color:var(--s-tx)}
.sol-pv-l .sx-an{color:var(--s-tx2);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--s-tx2) 50%,transparent)}
.sol-pv-l .sx-de{padding:6px 10px;border-radius:10px;background:color-mix(in srgb,#1F9D57 10%,transparent);color:var(--s-tx);font-weight:700}
.sol-pv-l .sx-de.fol{background:color-mix(in srgb,#8C8A99 14%,transparent)}
.sol-pv-l svg{width:16px;height:16px;color:var(--s-rosa)}
.sol-pv-cab2{display:grid;grid-template-columns:132px minmax(0,1fr) 24px minmax(0,1fr);gap:10px;padding:8px 14px;border-top:1px solid var(--s-ln);font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--s-tx2)}
/* detalhe */
.sol-det-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.sol-res{margin:0 0 16px;font-size:15px;line-height:1.5;color:var(--s-tx);font-weight:700}
.solm .sol-h3,.sol .sol-h3{margin:22px 0 10px!important;padding:0!important;border:0!important;font-size:11px!important;line-height:1.3!important;font-weight:800!important;letter-spacing:.09em!important;text-transform:uppercase;color:var(--s-tx2)!important}
.solm .sol-h3:first-child{margin-top:0!important}
.sol-com{position:relative;padding:14px 16px 14px 20px;border-radius:14px;background:var(--s-sup2);font-size:13.5px;line-height:1.55;color:var(--s-tx)}.sol-com::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--s-roxo)}
.sol-com small{display:block;margin-top:8px;font-size:11.5px;color:var(--s-tx2)}
.sol-tl{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:22px}.sol-tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--s-ln)}
.sol-tl div{position:relative;font-size:13px;color:var(--s-tx)}.sol-tl div::before{content:"";position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--k,#9b93a8);box-shadow:0 0 0 3px var(--s-sup)}
.sol-tl small{display:block;font-size:11.5px;color:var(--s-tx2)}
.sol-dec{display:flex;flex-direction:column;gap:8px;width:100%}
.sol-dec textarea{width:100%;box-sizing:border-box;min-height:64px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--s-ln);background:var(--s-sup);color:var(--s-tx);font:inherit;font-size:13.5px;resize:vertical}
.sol-dec .sx-bts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@keyframes solSobe{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
@keyframes solEntra{from{opacity:0;transform:translate3d(24px,0,0)}to{opacity:1;transform:none}}
@keyframes solLinha{from{opacity:0;transform:translate3d(-10px,0,0)}to{opacity:1;transform:none}}
@keyframes solGrad{from{background-position:0% 40%}to{background-position:100% 60%}}
@keyframes solPulso{0%{box-shadow:0 0 0 0 rgba(229,57,88,.6)}80%,100%{box-shadow:0 0 0 7px rgba(229,57,88,0)}}
@media (hover:hover) and (pointer:fine){
  .sol-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--s-rosa) 45%,var(--s-ln));box-shadow:0 18px 36px -24px rgba(60,20,80,.55)}.sol-card:hover .sx-seta{transform:translateX(3px);color:var(--s-rosa)}
  .sol-tipo:hover{transform:translateY(-3px);border-color:var(--tk);box-shadow:0 18px 34px -24px rgba(60,20,80,.5)}
