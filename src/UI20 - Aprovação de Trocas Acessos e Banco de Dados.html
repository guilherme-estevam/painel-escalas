<style>

.bd-m .bd-num{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0 0 22px;border:1px solid var(--c2);border-radius:14px}

.bd-m.at .bd-st{background:#FFF3D9;color:#8A5A00} .bd-m.cr .bd-st{background:#FDE3E3;color:#B42318}
html[data-tema="escuro"] .bd-m .bd-st{background:#173a26;color:#7fe0a5} html[data-tema="escuro"] .bd-m.at .bd-st{background:#3a2c0d;color:#F2C063} html[data-tema="escuro"] .bd-m.cr .bd-st{background:#3d1717;color:#f19999}

.pr-ic.bd{background:#EEE9FA;color:#4F3F91}

.bd-st{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 10px;background:#DDF4E6;color:#17713D}
.bd-card.at .bd-st{background:#FFF3D9;color:#8A5A00} .bd-card.cr .bd-st{background:#FDE3E3;color:#B42318}
html[data-tema="escuro"] .bd-st{background:#173a26;color:#7fe0a5} html[data-tema="escuro"] .bd-card.at .bd-st{background:#3a2c0d;color:#F2C063} html[data-tema="escuro"] .bd-card.cr .bd-st{background:#3d1717;color:#f19999}
.bd-teste{margin-left:auto;font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;background:#FFF4D6;color:#8A5A00;border:1px solid #F2D27A}

.bd-lin{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.bd-bar{flex:1;min-width:220px;height:12px;border-radius:999px;background:var(--c1,#F1EEF4);overflow:hidden}
html[data-tema="escuro"] .bd-bar{background:#2b2533}
.bd-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#1E9E58,#3CC47A)}
.bd-card.at .bd-bar i{background:linear-gradient(90deg,#C98A00,#E9B53C)} .bd-card.cr .bd-bar i{background:linear-gradient(90deg,#B42318,#E5534B)}
.bd-kpis{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--c4)}
.bd-kpis b{color:var(--preto)}
.bd-aba{display:inline-block;margin:2px 6px 2px 0;padding:2px 9px;border-radius:999px;background:var(--c1,#F4F2F7);color:var(--preto);font-size:11.5px;font-weight:700}
html[data-tema="escuro"] .bd-aba{background:#2b2533}
.pr-card .ver{font-size:13px;font-weight:800;color:var(--rosa)}
.pr-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.pr-ic.on{background:#dff3ea;color:#1e7a4f} .pr-ic.hj{background:var(--roxo-bg);color:var(--roxo)}

.pr-dot{width:10px;height:10px;border-radius:50%;background:#22a06b;display:inline-block;flex:none;box-shadow:0 0 0 0 rgba(34,160,107,.6);animation:prPulso 1.8s infinite}
.pr-dot.off{background:var(--c3);animation:none;box-shadow:none}
@keyframes prPulso{0%{box-shadow:0 0 0 0 rgba(34,160,107,.55)}70%{box-shadow:0 0 0 8px rgba(34,160,107,0)}100%{box-shadow:0 0 0 0 rgba(34,160,107,0)}}
.pr-m .cabm{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pr-m .cabm p{margin:4px 0 0;color:var(--c4);font-size:13.5px;max-width:720px}
.pr-m .atual{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--c4)}
.pr-m .pr-barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 12px;overflow:visible;height:auto}
.pr-m .pr-barra input{flex:1;min-width:220px;border:1.5px solid var(--c3);border-radius:12px;padding:9px 12px;font:inherit;font-size:14px;background:var(--sup,#fff);color:var(--preto)}
.pr-m .tabw{max-height:58vh;overflow:auto;border:1px solid var(--c2);border-radius:14px}
.pr-m table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.pr-m th{position:sticky;top:0;z-index:1;background:var(--c1);text-align:center;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--c4);padding:10px 12px;border-bottom:1px solid var(--c2)}
.pr-m td{padding:10px 12px;border-bottom:1px solid var(--c2);text-align:center;vertical-align:middle}
.pr-m th.esq,.pr-m td.esq{text-align:left}
.pr-m tr:last-child td{border-bottom:0}
.pr-m .pes{display:flex;align-items:center;gap:10px}
.pr-m .pes .av{width:34px;height:34px;font-size:11.5px;flex:none}
.pr-m .pes b{display:block;font-size:13.5px}
.pr-m .pes small{font-size:12px;color:var(--c4)}
.pr-st{display:inline-flex;align-items:center;gap:7px;border-radius:20px;padding:4px 11px;font-size:12.5px;font-weight:800;white-space:nowrap}
.pr-st.on{background:#dff3ea;color:#1e7a4f} .pr-st.saiu{background:var(--c1);color:var(--c4)} .pr-st.fech{background:#FFF4D6;color:#8a5a00}
html[data-tema="escuro"] .pr-st.on{background:#163b2b;color:#6fd3a5} html[data-tema="escuro"] .pr-st.fech{background:#3d3214;color:#ffd77a}
.pr-m .sub2{display:block;font-size:11.5px;color:var(--c4);font-weight:600;margin-top:3px}
.pr-m .vazio{padding:30px;text-align:center;color:var(--c4)}
.pr-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--c4);margin-top:10px}
@media (max-width:760px){ .pr-cards{grid-template-columns:1fr} }

<script>
/* ===================== presença no painel ===================== */
// sinal a cada 2 minutos enquanto o painel está aberto (inclusive em outra aba do navegador)
setInterval(function(){ if(estado.token) chamar('apiPresenca', estado.token, !document.hidden).catch(function(){}); }, 120000);
/* online = painel visível na tela: avisa quando a aba vai para segundo plano ou volta, e uma vez ao abrir */
document.addEventListener('visibilitychange', function(){ if(estado.token) chamar('apiPresenca', estado.token, !document.hidden, true).catch(function(){}); });
var _prIni=setInterval(function(){ if(estado.token && estado.dados){ clearInterval(_prIni); chamar('apiPresenca', estado.token, !document.hidden, true).catch(function(){}); } }, 3000);

var PR_IC={
  on:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/><path d="M2 9a15 15 0 0 1 20 0"/></svg>',
  hj:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>',
  atual:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>'
};
function prDur(ms){ var m=Math.max(0, Math.round(ms/60000)); if(m<1) return 'menos de 1 min'; if(m<60) return m+' min'; var h=Math.floor(m/60), r=m%60; return h+' h'+(r?' '+('0'+r).slice(-2)+' min':''); }
function prHora(ms){ var d=new Date(ms); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function prHoraIso(s){ return s ? String(s).slice(11,16) : ''; }
function prMsIso(s){ return s ? new Date(String(s).replace(' ','T')).getTime() : 0; }
/* situação de cada pessoa, sempre em relação à hora do servidor */
function prSituacao(p, agora){
  if(p.online) return {cls:'on', txt:'Online há '+prDur(agora-p.desde), sub:'No painel desde '+prHora(p.desde)};
  if(p.oculto) return {cls:'fech', txt:'Painel em segundo plano há '+prDur(agora-p.oculto), sub:'Aberto, mas fora da tela desde '+prHora(p.oculto)};
  var saiu = p.saiu || prMsIso(p.saiuLog);
  if(saiu && (!p.ult || saiu>=p.ult-1000)) return {cls:'saiu', txt:'Saiu há '+prDur(agora-saiu), sub:'Clicou em Sair às '+prHora(saiu)};
  if(p.ult) return {cls:'fech', txt:'Painel fechado há '+prDur(agora-p.ult), sub:'Última atividade às '+prHora(p.ult)};
  return {cls:'saiu', txt:'Sem atividade recente', sub:'Entrou às '+prHoraIso(p.ultimoLogin)};
}
function prPilha(lista){ var n=lista.length; return lista.slice(0,9).map(function(p){ return avatarHtml(p.email, p.nome, ''); }).join('')+(n>9?'<span class="mais">+'+(n-9)+'</span>':''); }

/* cartões no topo do Histórico de acessos (no lugar da faixa "Entraram hoje") */
function cartoesPresenca(alvo){
  var box=document.createElement('div'); box.className='pr-cards';
  box.innerHTML='<div class="pr-card"><div class="carregando" style="min-height:80px"><div class="giro"></div> Vendo quem está online…</div></div><div class="pr-card"><div class="carregando" style="min-height:80px"><div class="giro"></div> Vendo quem entrou hoje…</div></div>';
  alvo.parentNode.replaceChild(box, alvo);
  chamar('apiPresencaPainel', estado.token).then(function(r){
    estado.presenca=r;
    var on=r.pessoas.filter(function(p){ return p.online; }).sort(function(a,b){ return a.desde-b.desde; }), hj=r.pessoas.filter(function(p){ return p.entrouHoje || p.logins>0; }), hjOn=hj.filter(function(p){ return p.online; }).length;
    box.innerHTML='<button type="button" class="pr-card" data-pr="online"><div class="pr-tp"><span class="pr-ic on">'+PR_IC.on+'</span><b>Online agora</b><span class="pr-dot'+(on.length?'':' off')+'"></span></div>'+
      '<div class="num">'+on.length+'<small>'+(on.length===1?'pessoa':'pessoas')+'</small></div><div class="exp">Com o painel aberto agora (sinal nos últimos '+r.limiteMin+' minutos).</div><div class="pilha">'+(on.length?prPilha(on):'<span class="exp">Ninguém online neste momento.</span>')+'</div><span class="ver">Ver quem está online →</span></button>'+
      '<button type="button" class="pr-card" data-pr="hoje"><div class="pr-tp"><span class="pr-ic hj">'+PR_IC.hj+'</span><b>Entraram hoje</b></div>'+
      '<div class="num">'+hj.length+'<small>'+(hj.length===1?'pessoa':'pessoas')+'</small></div><div class="exp">Abriram o painel hoje (com login ou já conectadas) · <b>'+hjOn+'</b> ainda online.</div><div class="pilha">'+(hj.length?prPilha(hj):'<span class="exp">Ninguém entrou hoje ainda.</span>')+'</div><span class="ver">Ver horários de entrada e saída →</span></button>';
    atualizarAvatares();
    box.querySelectorAll('[data-pr]').forEach(function(b){ b.onclick=function(){ modalPresenca(b.dataset.pr); }; });
    cartaoBanco(box);
  }).catch(function(){ box.innerHTML='<div class="pr-card"><div class="exp">Não foi possível carregar quem está online agora. Recarregue a página.</div></div>'; });
}

/* limite do banco de dados, para a gestão acompanhar */
var BD_IC='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>';
var BD_ATU='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>';
function bdF(v){ return v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }
function bdN(v){ return Number(v).toLocaleString('pt-BR'); }
function bdStatus(pct){ return pct<50?['ok','Saudável']:pct<80?['at','Atenção']:['cr','Crítico']; }
function bdRel(em){ var t=new Date(String(em)), m=Math.max(0,Math.round((Date.now()-t)/60000)); return isNaN(m)?'':(m<1?'agora mesmo':m===1?'há 1 min':'há '+m+' min'); }
function bdBuscar(forcar){ return chamar('apiCapacidadeBanco', estado.token, !!forcar).then(function(r){ estado.bdCap=r; document.querySelectorAll('.bd-card').forEach(function(c){ bdPintarCartao(c, r); }); var m=document.getElementById('bdM'); if(m) m.outerHTML=bdModalHtml(r), bdLigarModal(); return r; }); }
function bdPintarCartao(c, r){
  var pct=r.celulas/r.limite*100, st=bdStatus(pct);
  c.classList.remove('ok','at','cr'); c.classList.add(st[0]); c.title=bdN(r.celulas)+' de '+bdN(r.limite)+' células';
  c.innerHTML='<div class="pr-tp"><span class="pr-ic bd">'+BD_IC+'</span><b>Banco de Dados</b><span class="bd-st">'+st[1]+'</span></div>'+
    '<div class="num">'+bdF(pct)+'<small>do limite</small></div>'+
    '<div class="exp">'+bdN(r.celulas)+' de '+bdN(r.limite/1e6)+' milhões de células</div>'+
    '<div class="bd-bar"><i style="width:'+Math.max(.6,Math.min(100,pct)).toFixed(2)+'%"></i></div>'+
    '<div class="exp">Atualizado às '+esc(String(r.em).slice(11,16))+' · <span data-bdrel>'+bdRel(r.em)+'</span></div>'+
    '<span class="ver">Ver detalhes →</span>';
}
function cartaoBanco(box){
  box.classList.add('tres');
  var c=document.createElement('button'); c.type='button'; c.className='pr-card bd-card';
  c.innerHTML='<div class="pr-tp"><span class="pr-ic bd">'+BD_IC+'</span><b>Banco de Dados</b></div><div class="num">…</div><div class="exp">Medindo o banco de dados…</div>';
  c.onclick=function(){ if(estado.bdCap) modalBanco(); };
  box.appendChild(c);
  if(estado.bdCap) bdPintarCartao(c, estado.bdCap);
  bdBuscar(false).catch(function(){ if(!estado.bdCap) c.innerHTML='<div class="pr-tp"><span class="pr-ic bd">'+BD_IC+'</span><b>Banco de Dados</b></div><div class="exp">Não foi possível medir o banco de dados agora.</div>'; });
  /* atualiza sozinho: números a cada 5 minutos (com a aba visível) e o "há X min" a cada 30 segundos */
  clearInterval(estado.bdT1); clearInterval(estado.bdT2);
  estado.bdT1=setInterval(function(){ if(!document.querySelector('.bd-card')){ clearInterval(estado.bdT1); return; } if(!document.hidden) bdBuscar(false).catch(function(){}); }, 300000);
  estado.bdT2=setInterval(function(){ if(!document.querySelector('.bd-card') && !document.getElementById('bdM')){ clearInterval(estado.bdT2); return; } if(estado.bdCap) document.querySelectorAll('[data-bdrel]').forEach(function(x){ x.textContent=bdRel(estado.bdCap.em); }); }, 30000);
}
function bdModalHtml(r){
  var pct=r.celulas/r.limite*100, st=bdStatus(pct), pp=r.propsBytes/r.propsLimite*100, w=Math.max(.6,Math.min(100,pct)).toFixed(2);
  return '<div class="bd-m '+st[0]+'" id="bdM">'+
    '<div class="bd-cab"><div><h3>Banco de Dados <span class="bd-st bd-'+st[0]+'">'+st[1]+'</span></h3><p class="sub">Espaço ocupado na planilha do painel, comparado ao limite do Google Sheets.</p></div>'+
      '<div class="bd-at"><span>Atualizado às <b>'+esc(String(r.em).slice(11,16))+'</b> · <span data-bdrel>'+bdRel(r.em)+'</span></span><button type="button" class="btn sec peq bd-atu" id="bdAtu">'+BD_ATU+'Atualizar agora</button></div></div>'+
    '<div class="bd-hero"><div class="bd-pct"><b>'+bdF(pct)+'</b><span>do limite de '+bdN(r.limite/1e6)+' milhões de células</span></div>'+
      '<div><div class="bd-trilho"><i style="width:'+w+'%"></i><s style="left:50%"></s><s style="left:80%"></s></div>'+
      '<div class="bd-marcas"><span style="left:0">0%</span><span style="left:50%">50% · Atenção</span><span style="left:80%">80% · Crítico</span></div></div></div>'+
    '<dl class="bd-num"><div><dt>Células alocadas</dt><dd>'+bdN(r.celulas)+'</dd></div><div><dt>Células com dados</dt><dd>'+bdN(r.comDados)+'</dd></div><div><dt>Espaço interno do painel</dt><dd>'+bdF(pp)+'<small>de 500 KB</small></dd></div></dl>'+
    '<h4>Onde está o espaço</h4>'+
    '<div class="tabw"><table><thead><tr><th>Aba</th><th>Células</th><th>Linhas com dados</th><th>Participação</th></tr></thead><tbody>'+
    r.abas.map(function(a){ var p=a.celulas/r.celulas*100; return '<tr><td>'+esc(a.nome)+'</td><td>'+bdN(a.celulas)+'</td><td>'+bdN(a.linhas)+'</td><td><div class="bd-part"><span><i style="width:'+Math.max(1,p).toFixed(1)+'%"></i></span><b>'+bdF(p)+'</b></div></td></tr>'; }).join('')+'</tbody></table></div>'+
    '<p class="nota">Saudável até 50% · Atenção de 50% a 80% · Crítico acima de 80%. A limpeza mensal arquiva o histórico com mais de 90 dias e enxuga as abas'+(r.limpeza?' (última: '+esc(r.limpeza.slice(5,7)+'/'+r.limpeza.slice(0,4))+')':'')+'. Os números se atualizam sozinhos a cada 5 minutos.</p></div>';
}
function bdLigarModal(){
  var b=document.getElementById('bdAtu'); if(!b) return;
  b.onclick=function(){ if(b.disabled) return; b.disabled=true; b.classList.add('girando');
    bdBuscar(true).catch(function(){ toast('Não foi possível atualizar agora.'); var x=document.getElementById('bdAtu'); if(x){ x.disabled=false; x.classList.remove('girando'); } }); };
}
function modalBanco(){
  if(!estado.bdCap) return;
  var w=abrirModal(bdModalHtml(estado.bdCap), true); var md=w && w.querySelector && w.querySelector('.modal'); if(md) md.classList.add('bd-modal'); bdLigarModal();
}

/* modal com a lista detalhada */
function modalPresenca(tipo){
  var st={tipo:tipo, perfil:'', sit:'', q:''};
  var w=abrirModal('<div class="pr-m" id="prM"></div>', true); w.querySelector('.modal').classList.add('modal-xl');
  function desenhar(){
    var r=estado.presenca, agora=r.agora, todas=r.pessoas.filter(function(p){ return tipo==='online' ? p.online : (p.entrouHoje || p.logins>0); });
    var lista=todas.filter(function(p){
      if(st.perfil && p.perfil!==st.perfil) return false;
      if(st.sit==='on' && !p.online) return false; if(st.sit==='off' && p.online) return false;
      if(st.q && (p.nome+' '+p.coord).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').indexOf(st.q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''))<0) return false; return true; });
    lista.sort(tipo==='online' ? function(a,b){ return a.desde-b.desde; } : function(a,b){ return (b.online-a.online) || (prMsIso(b.ultimoHoje||b.ultimoLogin)-prMsIso(a.ultimoHoje||a.ultimoLogin)); });
    var cont=function(f){ return todas.filter(f).length; };
    var chips=[['','Todos',todas.length],['AGENTE','Agentes',cont(function(p){ return p.perfil==='AGENTE'; })],['GESTAO','Gestão',cont(function(p){ return p.perfil==='GESTAO'; })]];
    var chipsSit = tipo==='hoje' ? [['','Todas as situações',todas.length],['on','Online agora',cont(function(p){ return p.online; })],['off','Já saíram',cont(function(p){ return !p.online; })]] : [];
    var titulo = tipo==='online' ? 'Online agora' : 'Entraram hoje';
    var expl = tipo==='online' ? 'Pessoas com o painel aberto neste momento. Conta como online quem deu sinal nos últimos '+r.limiteMin+' minutos (o painel manda um sinal a cada 2 minutos enquanto está aberto).'
      : 'Todas as pessoas que abriram o painel hoje: quem fez login e quem entrou já conectado (opção manter conectado). Mostra o primeiro acesso do dia, a última atividade e se ainda estão no painel.';
    var cab = tipo==='online' ? '<th class="esq">Pessoa</th><th>Situação</th><th>Entrou no painel às</th><th>Última atividade</th>' : '<th class="esq">Pessoa</th><th>Situação agora</th><th>Entrou hoje às</th><th>Última atividade</th><th>Logins hoje</th>';
    var linhas=lista.map(function(p){ var s=prSituacao(p, agora);
      var pes='<td class="esq"><div class="pes">'+avatarHtml(p.email, p.nome, '')+'<span><b>'+esc(p.nome)+'</b><small>'+papelChip(p.email, p.perfil)+(p.coord&&p.coord!=='Gestao'?' · '+esc(p.coord):'')+'</small></span></div></td>';
      var sit='<td><span class="pr-st '+s.cls+'">'+(s.cls==='on'?'<span class="pr-dot"></span>':'')+esc(s.txt)+'</span><span class="sub2">'+esc(s.sub)+'</span></td>';
      if(tipo==='online') return '<tr>'+pes+sit+'<td><b>'+prHora(p.desde)+'</b></td><td>há '+prDur(agora-p.ult)+'</td></tr>';
      return '<tr>'+pes+sit+'<td><b>'+prHoraIso(p.primeiroHoje||p.primeiroLogin)+'</b></td><td>'+prHoraIso(p.ultimoHoje||p.ultimoLogin)+'</td><td>'+(p.logins? p.logins : '<span title="Entrou já conectado, sem fazer login hoje">—</span>')+'</td></tr>'; }).join('');
    w.querySelector('#prM').innerHTML='<div class="cabm"><div><h3 style="margin:0;display:flex;align-items:center;gap:10px">'+(tipo==='online'?'<span class="pr-dot"></span>':'')+titulo+' <span style="color:var(--c4);font-weight:700">('+todas.length+')</span></h3><p>'+expl+'</p></div>'+
      '<div class="atual">Atualizado às '+prHora(agora)+'<button type="button" class="btn sec peq" id="prAt">'+PR_IC.atual+' Atualizar</button></div></div>'+
      '<div class="pr-barra"><input id="prQ" type="text" placeholder="Buscar pelo nome ou pela coordenação" value="'+esc(st.q)+'"><div class="chips" style="margin:0">'+chips.map(function(c){ return '<button data-pf="'+c[0]+'" class="'+(st.perfil===c[0]?'ativa':'')+'">'+c[1]+' ('+c[2]+')</button>'; }).join('')+'</div>'+
      (chipsSit.length?'<div class="chips" style="margin:0">'+chipsSit.map(function(c){ return '<button data-ps="'+c[0]+'" class="'+(st.sit===c[0]?'ativa':'')+'">'+c[1]+' ('+c[2]+')</button>'; }).join('')+'</div>':'')+'</div>'+
      '<div class="tabw"><table><thead><tr>'+cab+'</tr></thead><tbody>'+(linhas||'<tr><td colspan="5" class="vazio">'+(todas.length?'Ninguém com esse filtro.':(tipo==='online'?'Ninguém online neste momento.':'Ninguém entrou hoje ainda.'))+'</td></tr>')+'</tbody></table></div>'+
      '<div class="pr-leg"><span><span class="pr-st on" style="padding:1px 8px">Online</span> painel aberto agora</span><span><span class="pr-st saiu" style="padding:1px 8px">Saiu</span> clicou em Sair</span><span><span class="pr-st fech" style="padding:1px 8px">Painel fechado</span> fechou a página sem clicar em Sair</span></div>'+
      '<div class="acoes"><button class="btn sec" data-fechar>Fechar</button></div>';
    atualizarAvatares();
    var q=w.querySelector('#prQ'); q.oninput=function(){ st.q=this.value; var pos=this.selectionStart; desenhar(); var n=w.querySelector('#prQ'); n.focus(); n.setSelectionRange(pos,pos); };
    w.querySelectorAll('[data-pf]').forEach(function(b){ b.onclick=function(){ st.perfil=b.dataset.pf; desenhar(); }; });
    w.querySelectorAll('[data-ps]').forEach(function(b){ b.onclick=function(){ st.sit=b.dataset.ps; desenhar(); }; });
    w.querySelector('#prAt').onclick=function(){ var bt=this; ocupado(bt,true,'Atualizando…'); chamar('apiPresencaPainel', estado.token).then(function(r){ estado.presenca=r; desenhar(); }).catch(function(e){ ocupado(bt,false,'Atualizar'); falhaGeral(e); }); };
  }
  desenhar();
}

var _telaAcessos_20 = telaAcessos;
telaAcessos = function(filtro){
  var r=_telaAcessos_20(filtro);
  var tenta=function(){ var alvo=gc() && gc().querySelector('.ac-hoje'); if(!alvo) return false; cartoesPresenca(alvo); return true; };
  if(!tenta()){ var ob=new MutationObserver(function(){ if(tenta()) ob.disconnect(); }); ob.observe(gc(), {childList:true, subtree:true}); }
  return r;
};
