<style>
/* ===================== troca: os horários acompanham ===================== */
.hx{border:1px solid var(--c2);border-radius:16px;padding:14px 16px;margin:12px 0;background:var(--sup,#fff)}
.hx-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.hx-ic{width:40px;height:40px;border-radius:50%;background:#FFF4D6;color:#B7791F;display:flex;align-items:center;justify-content:center;flex:none}
html[data-tema="escuro"] .hx-ic{background:#3d3214;color:#ffd77a}
.hx-top b{display:block;font-size:15px}
.hx-top span{font-size:13px;color:var(--c4)}
.hx-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hx-d{border-radius:14px;padding:12px 14px;background:var(--c1)}
.hx-d.trab{background:var(--roxo-bg);box-shadow:inset 0 0 0 2px var(--roxo)}
.hx-d .rot{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--c4)}
.hx-d.trab .rot{color:var(--roxo)}
.hx-d .dt{font-size:14px;font-weight:800;margin:2px 0 6px}
.hx-d .grande{font-size:22px;font-weight:800;line-height:1.1}
.hx-d .txt{font-size:13px;color:var(--c4);margin-top:6px}
.hx-d .txt b{color:var(--preto)}
.hx-ch{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.hx-ch span{border-radius:9px;padding:3px 8px;font-size:12px;font-weight:800}
.hx-ch .f0800{background:#D80073;color:#fff} .hx-ch .fchat{background:#4F3F91;color:#fff} .hx-ch .fass{background:#A51E5B;color:#fff} .hx-ch .fges{background:#55556a;color:#fff} .hx-ch .alm{background:#FDE3CF;color:#8a4b1f} .hx-ch .def{background:var(--c2);color:var(--c4)}
.hx-pill{display:inline-flex;align-items:center;gap:6px;margin-top:8px;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:800;letter-spacing:normal;text-transform:none;line-height:1.3}
.hx-pill.dif{background:#FFF4D6;color:#8a5a00} .hx-pill.igual{background:#dff3ea;color:#1e7a4f}
html[data-tema="escuro"] .hx-pill.dif{background:#3d3214;color:#ffd77a} html[data-tema="escuro"] .hx-pill.igual{background:#163b2b;color:#6fd3a5}
.hx-lin{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--c2);font-size:13.5px}
.hx-lin:first-of-type{border-top:0}
.hx-lin .dt{font-weight:800}
.tq .regra48{font-size:12px;color:var(--c4);margin-top:6px}
.hx-bloq{display:flex;gap:10px;align-items:flex-start;background:#FDE2E2;color:#9b1c22;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.hx-bloq b{display:block}
html[data-tema="escuro"] .hx-bloq{background:#4a1f22;color:#ffb3b3}
@media (max-width:700px){ .hx-g{grid-template-columns:1fr} .hx-lin{grid-template-columns:1fr} }
</style>
<script>
/* ===================== prazo de 48 horas para pedir troca ===================== */
var PRAZO_TROCA_H = 48;
function inicioTurnoMeu(d, dd){ var x=d.atuacao&&d.atuacao.d?d.atuacao.d[String(dd)]:null; return x ? x[0] : ((d.pessoas[0]&&d.pessoas[0].entrada)||'00:00'); }
function prazoOk(id, hora){ var p=id.split('-'), h=(hora||'00:00').split(':'); return new Date(+p[0], +p[1]-1, +p[2], +h[0], +h[1]).getTime() >= Date.now() + PRAZO_TROCA_H*3600000; }

/* ===================== cartão: os horários acompanham a troca ===================== */
var HX_IC='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
function hxHora(h){ return h ? h.i+' às '+h.f : ''; }
function hxChips(h){
  if(!h) return '';
  var nomes={'0800':['0800','f0800'],chat:['Chat','fchat'],ass:['Assíncrono','fass'],ges:['Trabalho','fges']}, out=[];
  if(h.blocos && h.blocos.length) h.blocos.forEach(function(b){ var n=nomes[b[0]]||['Trabalho','fges']; out.push({ini:aMin(b[1]), html:'<span class="'+n[1]+'">'+n[0]+' '+b[1]+'–'+b[2]+'</span>'}); });
  else out.push({ini:aMin(h.i), html:'<span class="def">Atuação a Definir</span>'});
  if(h.a) out.push({ini:aMin(h.a), html:'<span class="alm">Almoço '+h.a+'–'+hm(aMin(h.a)+60)+'</span>'});
  out.sort(function(a,b){ return a.ini-b.ini; });
  return '<div class="hx-ch">'+out.map(function(o){ return o.html; }).join('')+'</div>';
}
function cardHorarios(r, eu){
  var d0=r.dias[0], d1=r.dias[1];
  var topo='<div class="hx-top"><span class="hx-ic">'+HX_IC+'</span><div><b>Mesmo horário, só muda o dia</b><span>As trocas são só entre pessoas do mesmo horário. No dia em que trabalhar, você cumpre o seu horário de sempre; só as atuações do dia (0800, chat ou assíncrono) podem ser as que estavam planejadas para quem você cobre.</span></div></div>';
  var folga = [d0,d1].filter(function(x){ return x.sai && x.sai.email===eu; })[0], trab=[d0,d1].filter(function(x){ return x.entra && x.entra.email===eu; })[0];
  if(folga && trab){
    var outro = folga.entra || trab.sai;
    var cFolga='<div class="hx-d"><div class="rot">Você folga</div><div class="dt">'+dSem(folga.data)+'</div><div class="grande">Folga</div><div class="txt">'+(folga.entra?'<b>'+esc(primeiro(folga.entra.nome))+'</b> cobre o seu turno: <b>'+hxHora(folga.h)+'</b>':'Quem aceitar cobre o seu turno: <b>'+hxHora(folga.h)+'</b>')+'</div></div>';
    var cTrab;
    if(trab.h){
      var igual = folga.h && trab.h.i===folga.h.i && trab.h.f===folga.h.f;
      cTrab='<div class="hx-d trab"><div class="rot">Você trabalha</div><div class="dt">'+dSem(trab.data)+'</div><div class="grande">'+hxHora(trab.h)+'</div>'+hxChips(trab.h)+'<div class="txt">Atuações que estavam planejadas para <b>'+esc(primeiro(trab.sai.nome))+'</b>.</div>'+
        (folga.h?'<span class="hx-pill '+(igual?'igual':'dif')+'">'+(igual?'Mesmo horário que o seu':'Diferente do seu horário ('+hxHora(folga.h)+')')+'</span>':'')+'</div>';
    } else {
      cTrab='<div class="hx-d trab"><div class="rot">Você trabalha</div><div class="dt">'+dSem(trab.data)+'</div><div class="grande">'+(folga.h?hxHora(folga.h):'O seu horário')+'</div><div class="txt">As atuações do dia serão as que estavam planejadas para quem aceitar. Elas aparecem na sua notificação quando alguém aceitar.</div><span class="hx-pill igual">Mesmo horário que o seu</span></div>';
    }
    return '<div class="hx">'+topo+'<div class="hx-g">'+cFolga+cTrab+'</div></div>';
  }
  // visão da gestão (ou de quem não participa)
  var linha=function(x){ return '<div class="hx-lin"><span class="dt">'+dSem(x.data)+'</span><div>'+(x.entra?'<b>'+esc(x.entra.nome)+'</b>':'Quem aceitar')+' cobre o turno de '+(x.sai?'<b>'+esc(x.sai.nome)+'</b>':'quem aceitar')+(x.h?': <b>'+hxHora(x.h)+'</b>'+hxChips(x.h):'')+'</div></div>'; };
  return '<div class="hx">'+topo+linha(d0)+linha(d1)+'</div>';
}
function hxCarregando(el){ el.innerHTML='<div class="hx"><div class="carregando" style="min-height:50px"><div class="giro"></div> Conferindo os horários…</div></div>'; }
function mostrarHorariosTroca(el, o){ if(!el) return; var sq=el._hxSeq=(el._hxSeq||0)+1; hxCarregando(el); chamar('apiTrocaHorarios', estado.token, o.folga, o.trab, o.colega||'').then(function(r){ if(el._hxSeq!==sq) return; el.innerHTML=cardHorarios(r, estado.dados.eu.email); }).catch(function(){ if(el._hxSeq===sq) el.innerHTML=''; }); } // só a resposta mais recente aparece
function mostrarHorariosPorId(el, id, cb){ if(!el) return; hxCarregando(el); chamar('apiTrocaHorariosPorId', estado.token, id).then(function(r){ el.innerHTML=cardHorarios(r, estado.dados.eu.email); if(cb) cb(r, el); }).catch(function(){ el.innerHTML=''; }); }
/* aceite: se algum turno começa em menos de 48 horas, avisa e desativa o botão (a gestão não tem esse prazo) */
function hxPrazoAceite(r, box, botaoSel){
  var cedo=r.dias.filter(function(x){ return !prazoOk(x.data, x.h ? x.h.i : '00:00'); })[0]; if(!cedo) return;
  var hx=box.querySelector('.hx'); var aviso=document.createElement('div'); aviso.className='hx-bloq';
  aviso.innerHTML=MX_X.replace(/22/g,'20')+'<span><b>Prazo encerrado</b>A troca precisa ser aceita até '+PRAZO_TROCA_H+' horas antes do início do turno. O turno de '+dSem(cedo.data)+(cedo.h?' começa às '+cedo.h.i:'')+'.</span>';
  if(hx) hx.insertBefore(aviso, hx.firstChild);
  var bt=[].slice.call(document.querySelectorAll('#modais '+botaoSel)).pop(); if(!bt) return;
  var trava=function(){ if(!bt.disabled) bt.disabled=true; if(bt.textContent!=='Prazo encerrado') bt.textContent='Prazo encerrado'; };
  trava(); new MutationObserver(trava).observe(bt, {attributes:true, childList:true, characterData:true, subtree:true});
}
function hxAntes(sel, id, botao){ var alvo=[].slice.call(document.querySelectorAll('#modais '+sel)).pop(); if(!alvo) return; var el=document.createElement('div'); alvo.parentNode.insertBefore(el, alvo); mostrarHorariosPorId(el, id, botao ? function(r, box){ hxPrazoAceite(r, box, botao); } : null); }

/* aceitar pedido direto, aceitar pedido em aberto e aprovar (gestão) */
var _acaoTrocaAgenteV2_16 = acaoTrocaAgenteV2;
acaoTrocaAgenteV2 = function(acao, id, lista){ var r=_acaoTrocaAgenteV2_16(acao, id, lista); if(acao==='aceitar') hxAntes('#aPrev', id, '#aOk'); return r; };
var _modalAceitarOferta_16 = modalAceitarOferta;
modalAceitarOferta = function(t){ var r=_modalAceitarOferta_16(t); hxAntes('#oPrev', t.id, '#oOk'); return r; };
var _modalDecidirTroca_16 = modalDecidirTroca;
modalDecidirTroca = function(t){ var r=_modalDecidirTroca_16(t); hxAntes('#dPrev', t.id); return r; };
</script>
