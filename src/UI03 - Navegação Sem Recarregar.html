<style>

.eu>button{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;border-radius:24px}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--rosa),var(--roxo));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex:none;letter-spacing:.02em}

.ola2{display:flex;align-items:center;gap:16px}
/* atuação */
.atu{background:#fff;border:1px solid var(--c2);border-radius:14px;padding:18px 20px;margin-top:18px}
.atu-cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.atu-cab h2{margin:0;font-size:18px}
.atu-cab p{margin:2px 0 0;color:var(--c4);font-size:14px}
.semtabs{display:flex;gap:6px;flex-wrap:wrap}
.semtabs button{border:1.5px solid var(--c3);background:#fff;border-radius:20px;padding:6px 12px;font-weight:700;cursor:pointer;color:var(--c4);font-size:13px}
.semtabs button.ativa{background:var(--preto);border-color:var(--preto);color:#fff}
.atu-tot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}

.t0800{background:var(--rosa-bg);color:var(--vinho)}
.tdig{background:var(--roxo-bg);color:var(--roxo)}
.tass{background:var(--creme);color:var(--vinho)}
.tdias{background:var(--c1);color:var(--preto)}
.eixo{display:grid;grid-template-columns:130px 1fr 250px;gap:14px;font-size:11px;color:var(--c4);font-weight:700}

.atu-dia .qd b{display:block;font-size:14px}
.atu-dia .qd small{color:var(--c4);font-size:12px}
.atu-dia.hojed .qd b{color:var(--rosa)}
.barra{position:relative;height:30px;background:var(--c1);border-radius:8px;overflow:hidden}
.barra .grade{position:absolute;top:0;bottom:0;width:1px;background:#e2e2e2}
.seg{position:absolute;top:3px;bottom:3px;border-radius:6px;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.seg.trab{background:var(--roxo)}
.seg.ass{background:var(--vinho)}
.seg.alm{background:repeating-linear-gradient(45deg,#fbe9d9,#fbe9d9 5px,#f5d7bd 5px,#f5d7bd 10px);color:var(--vinho)}
.barra .rot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--c4)}
.barra.folga{background:var(--creme)} .barra.folga .rot{color:var(--vinho)}
.barra.af{background:var(--rosa-bg)} .barra.af .rot{color:var(--vinho)}
.atu-dia .info{font-size:12.5px;line-height:1.45}
.atu-dia .info b{font-size:13px}
.fr{display:inline-block;border-radius:8px;padding:1px 7px;font-weight:800;font-size:11.5px;margin:2px 4px 0 0}
.fr.f0800{background:var(--rosa-bg);color:var(--vinho)} .fr.fdig{background:var(--roxo-bg);color:var(--roxo)} .fr.fass{background:var(--creme);color:var(--vinho)}
.atu-nota{font-size:12.5px;color:var(--c4);margin-top:12px;background:var(--c1);border-radius:10px;padding:10px 12px}
/* modais */
.mcab{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.mcab .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.mcab .ic.ferias{background:var(--rosa-bg);color:var(--vinho)} .mcab .ic.hora{background:var(--roxo-bg);color:var(--roxo)} .mcab .ic.imp{background:var(--c1);color:var(--preto)}
.mcab h3{margin:0;font-size:20px} .mcab p{margin:2px 0 0;color:var(--c4);font-size:14px}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tipo{border:2px solid var(--c3);border-radius:14px;padding:14px;cursor:pointer;background:#fff;text-align:left}
.tipo b{display:block;font-size:15px} .tipo span{font-size:13px;color:var(--c4)}
.tipo.on.FERIAS{border-color:var(--rosa);background:var(--rosa-bg)} .tipo.on.LICENCA{border-color:var(--vinho);background:var(--salmao)}
.busca-p{position:relative}
.lista-p{max-height:190px;overflow:auto;border:1.5px solid var(--c3);border-radius:10px;margin-top:6px}
.lista-p button{display:flex;justify-content:space-between;width:100%;border:0;background:#fff;padding:9px 12px;cursor:pointer;text-align:left;font-weight:600;border-bottom:1px solid var(--c2)}
.lista-p button small{color:var(--c4);font-weight:600}
.lista-p button:hover{background:var(--c1)} .lista-p button.on{background:var(--rosa-bg);color:var(--vinho)}
.escolhido{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--rosa);background:var(--rosa-bg);border-radius:12px;padding:10px 12px}
.escolhido b{display:block} .escolhido small{color:var(--vinho)}
.periodo{border-radius:14px;padding:14px 16px;margin:4px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.periodo.FERIAS{background:var(--rosa-bg);color:var(--vinho)} .periodo.LICENCA{background:var(--salmao);color:var(--vinho)} .periodo.vazio{background:var(--c1);color:var(--c4)}
.periodo b{font-size:22px;font-weight:800} .periodo span{font-size:14px;font-weight:600}
.antes-depois{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--c1);border-radius:14px;padding:14px;margin:12px 0;flex-wrap:wrap}
.antes-depois .bx{background:#fff;border-radius:10px;padding:8px 14px;text-align:center}
.antes-depois .bx small{display:block;color:var(--c4);font-size:12px;font-weight:700}
.antes-depois .bx b{font-size:18px}
.antes-depois .bx.novo{background:var(--roxo);color:#fff} .antes-depois .bx.novo small{color:#ddd8f2}
.rapidos{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.rapidos button{border:1.5px solid var(--c3);background:#fff;border-radius:20px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:13px}
.rapidos button:hover{border-color:var(--roxo);color:var(--roxo)}
.tab-prev{width:100%;font-size:13px}
.tab-prev td,.tab-prev th{padding:7px 8px;border-bottom:1px solid var(--c2)}
.tab-prev th{position:sticky;top:0;background:var(--c1)}
.tab-prev td.esq,.tab-prev th.esq{text-align:left}
.tab-prev .mud{color:var(--roxo);font-weight:800}
@media (max-width:900px){
  .ph{display:none} .eu .nm{display:none} .eu>button{padding:3px}
  .atu-tot{grid-template-columns:repeat(2,minmax(0,1fr))}
  .eixo{display:none}
  .atu-dia{grid-template-columns:1fr;gap:6px}
  .tipos{grid-template-columns:1fr}
}

<script>
/* ============ navegação sem telas trocadas ============ */
var EPOCA = 0;
var LEITURAS_TELA = {apiMes:1,apiMinhaEscala:1,apiMinhaJornada:1,apiPessoas:1,apiAfastamentos:1,apiFeriados:1,apiLogs:1,apiTrocasV2:1,apiTrocaOfertas:1,apiAcessos:1};
var _chamarBase = chamar;
chamar = function(fn){
  var args = arguments, ep = EPOCA, tela = !!LEITURAS_TELA[fn] && !document.querySelector('#modais .modal-fundo');
  return new Promise(function(ok, falha){
    _chamarBase.apply(null, args).then(function(r){ if(tela && ep !== EPOCA) return; ok(r); }, function(e){ if(tela && ep !== EPOCA) return; falha(e); });
  });
};
var _carregandoBase = carregando; carregando = function(){ EPOCA++; _carregandoBase(); };
var _gCarregandoBase = gCarregando; gCarregando = function(){ EPOCA++; _gCarregandoBase(); };
var _abrirModalBase = abrirModal; abrirModal = function(h, g){ return _abrirModalBase(String(h).replace('>Ver jornada<','>Ver escala<'), g); };

/* ============ identidade: WFM e usuário ============ */
function iniciais(n){ var p=String(n||'').trim().split(/\s+/); return ((p[0]||'').charAt(0)+(p.length>1?p[p.length-1].charAt(0):'')).toUpperCase(); }
function nomeExib(n){ var p=String(n||'').trim().split(/\s+/); return p.length>1 ? p[0]+' '+p[p.length-1] : p[0]||''; }
(function(){
  var mt=document.querySelector('.topo .marca'); if(mt) mt.innerHTML='<span>Painel\1Escalas\3</span><span class="ph">WFM</span>';
  var ml=document.querySelector('.lado .marca'); if(ml) ml.innerHTML='Painel\1Escalas\3 · Atendimento<br><span class="ph-login">WFM</span>';
  var leg=document.querySelector('.legenda-lado'); if(leg) leg.textContent='Semana de domingo a sábado: 5 dias de trabalho e 2 de folga · WFM';
  try{ document.title='Escalas · WFM'; }catch(e){}
})();
var _montarAppUI2 = montarApp;
montarApp = function(){
  _montarAppUI2();
  var eu=estado.dados.eu;
  var b=$('abas').querySelector('[data-aba="jornada"]'); if(b) b.textContent='Minha Escala';
  $('bEu').innerHTML=avatarHtml(eu.email, eu.nome, '')+'<span class="nm">'+esc(nomeDoEmail(eu.email))+'<small>'+(eu.perfil==='GESTAO'?'Gestão':'Agente')+'</small></span>';
  $('bEu').setAttribute('aria-label','Menu de '+eu.nome);
  $('quem').innerHTML=avatarHtml(eu.email, eu.nome, 'm')+'<div><strong>'+esc(nomeDoEmail(eu.email))+'</strong><br><small>'+esc(eu.nome)+'</small><br>'+esc(eu.email)+'<br>'+esc(eu.cargo||'')+(eu.coordenacao?' · '+esc(eu.coordenacao):'')+'</div>';
};

/* ============ Minha escala: dois calendários ============ */
function fichaComAtuacao(p, st, atu){ var h=fichaPessoa(p, st); if(!(atu && atu.d && Object.keys(atu.d).length)) return h;
  var hs={}; Object.keys(atu.d).forEach(function(k){ var x=atu.d[k]; if(x && x[0] && x[2]) hs[x[0]+' às '+x[2]]=1; }); var lst=Object.keys(hs); // só "varia por dia" quando a entrada ou a saída muda entre os dias
  return h.replace('<small>Horário</small><strong>'+esc(p.entrada)+' às '+esc(p.saida)+'</strong>', '<small>Horário</small><strong>'+esc(lst.length===1 ? lst[0] : 'Varia por dia')+'</strong>'); }
function hm(m){ return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2); }
function aMin(h){ var p=String(h||'').split(':'); return (+p[0])*60+(+p[1]||0); }
function dur(m){ var h=Math.floor(m/60), r=m%60; return h+'h'+(r?('0'+r).slice(-2):''); }
function horarioDia(atu, dd, p){ var x=atu && atu.d ? atu.d[String(dd)] : null; return x ? {i:x[0], a:x[1], f:x[2], det:true} : {i:p.entrada, a:'', f:p.saida, det:false}; }
function calendario2(d,p,e,af,o){
  var html=calendario(d,p,e,af,o);
  if(!o.atu) return html;
  // troca o horário padrão pelo horário de cada dia
  var tmp=document.createElement('div'); tmp.innerHTML=html; var dias=tmp.querySelectorAll('.cal-sem .dia:not(.fora)');
  dias.forEach(function(el, i){ var dd=i+1, h=horarioDia(o.atu, dd, p); if(!h.det) return; var l=el.querySelector('.hr.l'), c=el.querySelector('.hr.c'); if(l) l.textContent=h.i+' às '+h.f; if(c) c.textContent=h.i.slice(0,2)+'–'+h.f.slice(0,2); });
  return tmp.innerHTML;
}
telaJornada = function(){ carregando(); chamar('apiMinhaEscala', estado.token, estado.mes).then(desenharMinhaEscala).catch(falhaGeral); };
function desenharMinhaEscala(d){
  estado.jor=d; d.souAgente=true; var main=$('conteudo'); main.className='';
  var eu=estado.dados.eu, sel='<select id="jMes" class="sel-mes" aria-label="Mês">'+opcoesMes(estado.mes)+'</select>';
  var cab='<div class="ola"><div class="ola2">'+avatarHtml(eu.email, eu.nome, 'g')+'<div><h1>Minha Escala</h1><p>Olá, '+esc(primeiro(eu.nome))+'. Esta é a sua escala oficial de '+rotuloMes(d.mes).toLowerCase()+'.</p></div></div>'+sel+'</div>';
  var p=d.pessoas[0];
  if(!p){ main.innerHTML=cab+'<div class="vazio"><strong>Seu acesso ainda não tem escala vinculada.</strong>Fale com a sua coordenação.</div>'; ligarMes(); return; }
  var e=d.escalas[p.email], af=d.afast[p.email]||[];
  var h=cab+fichaComAtuacao(p, e.dias ? STATUS.PUBLICADA : ['Ainda não publicada','sem'], d.atuacao);
  if(!e.dias){ h+='<div class="vazio"><strong>Sua escala de '+rotuloMes(d.mes).toLowerCase()+' ainda não foi publicada.</strong>Quando a gestão publicar, seus dias de trabalho, folgas e horários aparecem aqui.</div>'; }
  else {
    var v=validarEscala_({mes:d.mes,dias:e.dias,ant:e.ant,prox:e.prox,afast:af,segSex:p.segSex});
    h+=cartoesResumo(v)+'<div class="dica-cal">Quer trocar um dia? <b>Clique num dia de trabalho</b> no calendário.</div>';
    h+=calendario2(d,p,e,af,{clicavel:true, hoje:d.hoje, pend:d.trocasPendentes, atu:d.atuacao});
    if(v.avisos.length) h+='<div class="alertas">'+v.avisos.map(function(x){return '<div class="a">'+esc(x.msg)+'</div>';}).join('')+'</div>';
    h+='<div id="secAtuacao"></div>';
  }
  h+='<div id="secTrocas"></div>';
  main.innerHTML=h; ligarMes();
  main.querySelectorAll('[data-dia]').forEach(function(c){ var f=function(){ modalNovaTroca(c.dataset.dia); }; c.onclick=f; c.onkeydown=function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); f(); } }; });
  if(e.dias) desenharAtuacao($('secAtuacao'), d, p, e, af, d.atuacao, d.hoje);
  secaoTrocasAgente(d);
}
function semanasDoMes(mes){ var n=diasMes(mes), ini=wdDe(mes,1), out=[], s=[]; for(var dd=1; dd<=n; dd++){ s.push(dd); if((ini+dd)%7===0||dd===n){ out.push(s); s=[]; } } return out; }
function desenharAtuacao(el, d, p, e, af, atu, hoje){
  if(!el) return;
  var sems=semanasDoMes(d.mes), idxHoje=0;
  sems.forEach(function(s,i){ if(s.some(function(dd){ return dataDe(d.mes,dd)===hoje; })) idxHoje=i; });
  var semAtual = el.dataset.sem!==undefined ? +el.dataset.sem : idxHoje;
  var g = atu ? atu.g : '', m = atu ? atu.m : [0,0,0], diasT=0;
  for(var dd=1; dd<=diasMes(d.mes); dd++) if(e.dias.charAt(dd-1)==='T' && !tipoAfast(af,dataDe(d.mes,dd))) diasT++;
  var tot = atu ? '<div class="atu-tot"><div class="tdias"><b>'+diasT+'</b><span>Dias de trabalho</span></div>'+
     (m[0]?'<div class="t0800"><b>'+dur(m[0]*diasT)+'</b><span>No 0800 no mês</span></div>':'')+
     (m[1]?'<div class="tdig"><b>'+dur(m[1]*diasT)+'</b><span>No digital (chat) no mês</span></div>':'')+
     (m[2]?'<div class="tass"><b>'+dur(m[2]*diasT)+'</b><span>No assíncrono no mês</span></div>':'')+
     '<div class="tdias"><b>1h</b><span>De almoço por dia</span></div></div>' : '';
  var I=7*60, F=21*60, pct=function(x){ return ((x-I)/(F-I)*100).toFixed(2)+'%'; };
  var regua=''; for(var hh=8; hh<=20; hh+=2) regua+='<span style="left:'+pct(hh*60)+'">'+hh+'h</span>';
  var linhas=sems[semAtual].map(function(dd){
    var id=dataDe(d.mes,dd), s=e.dias.charAt(dd-1), a=tipoAfast(af,id), hd=horarioDia(atu, dd, p);
    var q='<div class="qd"><b>'+dSem(id)+'</b><small>'+(a?(a==='FERIAS'?'Férias':'Licença'):s==='T'?'Trabalho':s==='F'?'Folga':'Não definido')+'</small></div>';
    var grade=''; for(var hh=8; hh<=20; hh+=2) grade+='<i class="grade" style="left:'+pct(hh*60)+'"></i>';
    if(a) return '<div class="atu-dia">'+q+'<div class="barra af">'+grade+'<span class="rot">'+(a==='FERIAS'?'Férias':'Licença')+'</span></div><div class="info">Sem atuação neste dia.</div></div>';
    if(s!=='T') return '<div class="atu-dia">'+q+'<div class="barra folga">'+grade+'<span class="rot">'+(s==='F'?'Folga':'Sem definição')+'</span></div><div class="info">'+(s==='F'?'Aproveite o descanso.':'')+'</div></div>';
    var ini=aMin(hd.i), fim=aMin(hd.f), alm=hd.a?aMin(hd.a):0, cls=(m[2]&&!m[0]&&!m[1])?'ass':'trab', rot=cls==='ass'?'Assíncrono':'Atendimento';
    var segs = alm ? '<span class="seg '+cls+'" style="left:'+pct(ini)+';width:calc('+pct(alm)+' - '+pct(ini)+')">'+rot+'</span><span class="seg alm" style="left:'+pct(alm)+';width:calc('+pct(alm+60)+' - '+pct(alm)+')">Almoço</span><span class="seg '+cls+'" style="left:'+pct(alm+60)+';width:calc('+pct(fim)+' - '+pct(alm+60)+')">'+rot+'</span>'
      : '<span class="seg '+cls+'" style="left:'+pct(ini)+';width:calc('+pct(fim)+' - '+pct(ini)+')">'+rot+'</span>';
    var info = '<b>'+hd.i+' às '+hd.f+'</b>'+(hd.a?' · almoço '+hd.a+'–'+hm(alm+60):'')+'<br>'+
      (hd.det ? (m[0]?'<span class="fr f0800">0800 '+dur(m[0])+'</span>':'')+(m[1]?'<span class="fr fdig">Chat '+dur(m[1])+'</span>':'')+(m[2]?'<span class="fr fass">Assíncrono '+dur(m[2])+'</span>':'') : '<span style="color:#6D6D6D">Atuação a definir pela coordenação</span>');
    return '<div class="atu-dia'+(id===hoje?' hojed':'')+'">'+q+'<div class="barra">'+grade+segs+'</div><div class="info">'+info+'</div></div>';
  }).join('');
  el.innerHTML='<div class="atu"><div class="atu-cab"><div><h2>Calendário de Atuação</h2><p>'+(atu?'Seus horários de cada dia, o almoço e o tempo em cada atuação'+(g?' · grupo '+esc(g):'')+'.':'Seus horários de cada dia.')+'</p></div>'+
    '<div class="semtabs">'+sems.map(function(s,i){ return '<button data-s="'+i+'" class="'+(i===semAtual?'ativa':'')+'">'+('0'+s[0]).slice(-2)+'–'+('0'+s[s.length-1]).slice(-2)+'/'+d.mes.slice(5)+'</button>'; }).join('')+'</div></div>'+
    tot+'<div class="eixo"><span></span><div class="regua">'+regua+'</div><span></span></div>'+linhas+
    (atu&&m[0]&&m[1]?'<div class="atu-nota">Nos dias de atendimento, você divide o tempo entre o 0800 ('+dur(m[0])+') e o digital, que é o chat ('+dur(m[1])+'). A ordem das atuações ao longo do dia é combinada com a sua coordenação.</div>':'')+'</div>';
  el.querySelectorAll('[data-s]').forEach(function(b){ b.onclick=function(){ el.dataset.sem=b.dataset.s; desenharAtuacao(el, d, p, e, af, atu, hoje); }; });
}

/* ============ Gestão: escala de alguém (modal) com atuação ============ */
var _modalJornadaDeUI2 = modalJornadaDe;
modalJornadaDe = function(email){
  var w=abrirModal('<div id="mjCorpo"><div class="carregando" style="min-height:120px"><div class="giro"></div> Carregando…</div></div>', true);
  w.querySelector('.modal').classList.add('xl'); var mes=estado.mes;
  function carregar(){
    Promise.all([chamar('apiMes', estado.token, mes, email), chamar('apiAtuacaoDe', estado.token, mes, email)]).then(function(r){
      var d=r[0], atu=r[1].atuacao, p=d.pessoas[0]; if(!p){ w.querySelector('#mjCorpo').innerHTML='<div class="res erro">Pessoa não encontrada.</div>'; return; }
      var e=d.escalas[p.email], af=d.afast[p.email]||[], st=STATUS[e.status]||STATUS.SEM_ESCALA;
      var h='<div class="ola" style="margin-bottom:12px"><div class="ola2">'+avatarHtml(p.email, p.nome, 'g')+'<div><h1 style="font-size:22px">'+esc(p.nome)+'</h1><p>'+esc(p.email)+'</p></div></div><select id="mjMes" class="sel-mes" style="width:auto">'+opcoesMes(mes)+'</select></div>'+fichaComAtuacao(p, st, atu);

modalHorario = function(emails){
  var d=estado.plan, ps=emails.map(function(e){ return d.porEmail[e]; }).filter(Boolean), um=ps.length===1;

      '<label class="opcard" data-m="DEFINIR"><input type="radio" name="hm"><div><b>Colocar todos no mesmo horário</b><span>Todos passam a ter a mesma entrada e saída.</span></div></label>'+
      '<label class="opcard" data-m="HEADCOUNT"><input type="radio" name="hm"><div><b>Voltar ao horário do headcount</b><span>Cada pessoa volta ao horário que está no headcount.</span></div></label></div>'+

  var q=function(s){ return w.querySelector(s); };

      : st.modo==='DEFINIR' ? '<div class="dois"><div class="campo"><label for="hEnt">Entrada (24 h)</label><input id="hEnt" type="text" maxlength="5" placeholder="08:00" value="'+esc(st.ent)+'"></div><div class="campo"><label for="hSai">Saída (24 h)</label><input id="hSai" type="text" maxlength="5" placeholder="17:00" value="'+esc(st.sai)+'"></div></div>' : '';
    if(q('#hHoras')) { q('#hHoras').oninput=function(){ st.horas=+this.value||0; prev(); }; w.querySelectorAll('[data-h]').forEach(function(b){ b.onclick=function(){ st.horas=+b.dataset.h; q('#hHoras').value=st.horas; prev(); }; }); }

    q('#hOk').disabled = invalido || !muda;
  }
  if(um){
    q('#hEnt').oninput=function(){ st.ent=this.value.trim(); prev(); }; q('#hSai').oninput=function(){ st.sai=this.value.trim(); prev(); };
    w.querySelectorAll('[data-r]').forEach(function(b){ b.onclick=function(){ var p=ps[0], r=b.dataset.r; if(r==='hc'){ st.ent=p.entradaHc; st.sai=p.saidaHc; } else { var s=aMin(p.saida)+(+r); if(s>aMin(p.entrada)&&s<1440){ st.ent=p.entrada; st.sai=hm(s); } } q('#hEnt').value=st.ent; q('#hSai').value=st.sai; prev(); }; });

    camposMulti();
  }

  };

        (s.semCadastro.length?'<div class="aviso erro">Não encontrei no painel: '+s.semCadastro.map(esc).join(', ')+'. Essas linhas serão ignoradas.</div>':'')+
        (s.completadas?'<div class="aviso ok">'+s.completadas+' escala(s) tinham dias fora da planilha numa semana. Completei só quando havia uma única forma de fechar a semana em 5x2 (domingo ausente conta como folga). Isso fica anotado no histórico.</div>':'')+
        (s.jaExistem?'<div class="dica">'+s.jaExistem+' pessoa(s) já tinham escala neste mês e serão substituídas.</div>':'')+
        (s.comProblema.length?'<div class="lista-mini">'+s.comProblema.map(function(x){ return '<div><b>'+esc(x.nome)+'</b>'+esc(x.erros[0]||'')+'</div>'; }).join('')+'</div>':'')+
        '<div class="opcoes" style="margin-top:12px"><label class="opcard on" data-pub="1"><input type="radio" name="ip" checked><div><b>Importar e publicar as válidas</b><span>As '+s.validas+' escalas válidas ficam visíveis para as pessoas, que recebem uma notificação com o seu nome.</span></div></label><label class="opcard" data-pub="0"><input type="radio" name="ip"><div><b>Importar como rascunho</b><span>Nada muda para as pessoas até você publicar.</span></div></label></div>'+
        '<div class="acoes"><button class="btn" id="impOk">Importar '+s.encontradas+' escala(s)</button></div>';
      var pub=true; w.querySelectorAll('[data-pub]').forEach(function(l){ l.onclick=function(ev){ ev.preventDefault(); pub=l.dataset.pub==='1'; w.querySelectorAll('[data-pub]').forEach(function(x){ var on=x===l; x.classList.toggle('on',on); x.querySelector('input').checked=on; }); }; });
      w.querySelector('#impOk').onclick=function(){ var bt=this; ocupado(bt,true,'Importando…');
        chamar('apiImportarEscalaAplicar', estado.token, txt, pub).then(function(r2){ if(!r2.ok){ ocupado(bt,false,'Importar'); toast(r2.msg,true); return; } w.remove(); toast(r2.resumo.publicadas+' escala(s) publicada(s) e '+r2.resumo.rascunhos+' em rascunho.'); carregarPlano(); atualizarSino(); }).catch(function(e){ ocupado(bt,false,'Importar'); falhaGeral(e); }); };
    }).catch(falhaGeral);
  }; rd.readAsText(f,'UTF-8'); };
}
