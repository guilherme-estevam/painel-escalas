<style>
/* ===================== v143: Visão do Dia com presença, licença com período, período na situação, Dashboard da Semana ===================== */
.vd-ag-pres{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 10px;background:rgba(30,158,88,.14);color:#17713D;margin-left:auto}
html[data-tema="escuro"] .vd-ag-pres{background:rgba(30,158,88,.22);color:#7fe0a5}
.lg-per{display:block;margin-top:4px;font-size:11.5px;font-weight:700;color:var(--c4);white-space:nowrap}
.lg-per b{color:var(--preto);font-weight:800}
.lg-lic .lg-at-dias span{background:#C98A00}
.lg-lic .acoes .ok{background:#C98A00!important;border-color:#C98A00!important;color:#fff!important}
.lg-lic textarea{width:100%;box-sizing:border-box;min-height:64px;margin-top:6px;border:1.5px solid var(--c2,#E6DFEE);border-radius:12px;padding:10px 12px;font:inherit;font-size:13px;background:var(--sup,#fff);color:var(--preto);resize:vertical}
/* Dashboard da Semana */
.ls-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ls-nav .nav{all:unset;cursor:pointer;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1.5px solid var(--c2,#E6DFEE);background:var(--sup,#fff);font-size:18px;font-weight:800;color:var(--preto)}
.ls-nav .nav[disabled]{opacity:.35;cursor:default}
.ls-nav .per{font-weight:800;font-size:14px;padding:0 6px;font-variant-numeric:tabular-nums}
.ls-nav .esta{all:unset;cursor:pointer;font-size:12.5px;font-weight:800;color:var(--rosa,#D80073);padding:6px 10px;border-radius:9px}
.ls-delta{display:block;margin-top:4px;font-size:11.5px;font-weight:800}
.ls-delta.bom{color:#17713D}.ls-delta.ruim{color:#B42318}.ls-delta.igual{color:var(--c4)}
html[data-tema="escuro"] .ls-delta.bom{color:#7fe0a5} html[data-tema="escuro"] .ls-delta.ruim{color:#f19999}
.ls-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.ls-dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:12px}
.ls-dia{border-radius:16px;border:1.5px solid var(--c2,#E6DFEE);padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--sup,#fff);min-width:0}
.ls-dia.hoje{border-color:var(--rosa,#D80073);box-shadow:0 0 0 3px rgba(216,0,115,.12)}
.ls-dia.fut{border-style:dashed;opacity:.65}
.ls-dia .dn{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--c4)}
.ls-dia .dd{font-size:15px;font-weight:800}
.ls-bar{width:100%;max-width:56px;height:120px;border-radius:12px;background:var(--c1,#F4F1F7);display:flex;flex-direction:column-reverse;overflow:hidden}
.ls-bar i{display:block;width:100%}
.ls-dia .pc{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.ls-dia .pc small{display:block;font-size:11px;font-weight:700;color:var(--c4);margin-top:3px;text-align:center}
.ls-dia .ab{font-size:11.5px;font-weight:800;color:#B42318}
.ls-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--c4);font-weight:700;margin-top:12px}
.ls-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ls-tw{overflow:auto;max-height:440px;border-radius:12px;margin-top:10px}
.ls-t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.ls-t th{position:sticky;top:0;z-index:2;background:var(--sup,#fff);font-size:11.5px;font-weight:800;color:var(--c4);text-align:center;padding:8px 6px;border-bottom:1.5px solid var(--c2,#E6DFEE);white-space:nowrap}
.ls-t td{text-align:center;padding:8px 6px;border-bottom:1px solid var(--c2,#E6DFEE);font-variant-numeric:tabular-nums;white-space:nowrap}
.ls-t td:first-child,.ls-t th:first-child{text-align:left}
html[data-tema="escuro"] .ls-t th{background:#1e1a24}
.ls-pl{display:inline-flex;align-items:center;gap:8px}
.ls-pl .tr{width:70px;height:7px;border-radius:999px;background:var(--c1,#F4F1F7);overflow:hidden}.ls-pl .tr i{display:block;height:100%;border-radius:999px}
.ls-pts{display:inline-flex;gap:4px}
.ls-pts i{width:14px;height:14px;border-radius:4px;display:inline-block;background:var(--c1,#F4F1F7)}
.ls-pts i.v{background:transparent;border:1.5px dashed var(--c2,#D9D2E3);box-sizing:border-box}
.ls-mais{all:unset;cursor:pointer;display:block;margin:10px auto 0;font-size:12.5px;font-weight:800;color:var(--rosa,#D80073)}
.ls-vazio{padding:28px;text-align:center;color:var(--c4)}
@media (max-width:1100px){ .ls-grid{grid-template-columns:1fr} }
@media (max-width:760px){ .ls-dias{grid-template-columns:repeat(4,minmax(0,1fr))} .ls-bar{height:80px} }
</style>
