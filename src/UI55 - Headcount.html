<style>
/* ===================== Headcount · Customer Geral (15/11/2026) ===================== */
.hcx{--hc-e:cubic-bezier(.23,1,.32,1);--hc-rosa:var(--rosa,#D80073);--hc-roxo:#4F3F91;--hc-borda:var(--c2,#E6DFEE);--hc-sup:var(--sup,#fff);--hc-tx:var(--preto,#1c1823);--hc-tx2:var(--c4,#6d6679);display:flex;flex-direction:column;gap:16px}
html[data-tema="escuro"] .hcx{--hc-roxo:#7b68dd;--hc-borda:#33303d;--hc-sup:#1f1f26}
.hcx-topo{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.hcx-topo h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--hc-tx)}
.hcx-topo p{margin:3px 0 0;font-size:13px;color:var(--hc-tx2)}
.hcx-sinc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--hc-tx2)}
.hcx-sinc .pt{width:8px;height:8px;border-radius:50%;background:#1E9E58;box-shadow:0 0 0 4px color-mix(in srgb,#1E9E58 18%,transparent)}
.hcx-sinc .pt.esp{background:#E0A12D;box-shadow:0 0 0 4px color-mix(in srgb,#E0A12D 20%,transparent)}
.hcx-bt{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:10px;border:1.5px solid var(--hc-borda);background:var(--hc-sup);color:var(--hc-tx);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:border-color .15s,transform .12s var(--hc-e)}
.hcx-bt svg{width:15px;height:15px}
.hcx-bt:active{transform:scale(.97)}
.hcx-bt:focus-visible,.hcx-time:focus-visible,.hcx-lin:focus-visible,.hcx-col:focus-visible{outline:2px solid var(--hc-rosa);outline-offset:2px}
/* times */
.hcx-times{display:grid;grid-template-columns:minmax(0,1.25fr) repeat(4,minmax(0,1fr));gap:14px}
.hcx-time{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;padding:18px 18px 16px;border-radius:18px;border:1.5px solid var(--hc-borda);background:var(--hc-sup);color:var(--hc-tx);font:inherit;text-align:left;cursor:pointer;overflow:hidden;transition:border-color .18s,box-shadow .18s,transform .18s var(--hc-e)}
.hcx-time .rot{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--hc-tx2)}
.hcx-time .rot i{width:9px;height:9px;border-radius:3px;background:var(--k,var(--hc-rosa))}
.hcx-time .num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:44px;line-height:1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hcx-time .sub{font-size:12.5px;color:var(--hc-tx2);line-height:1.4}
.hcx-time .sub b{color:var(--hc-tx);font-weight:700}
.hcx-time .mini{display:flex;height:6px;border-radius:999px;overflow:hidden;background:color-mix(in srgb,var(--hc-borda) 70%,transparent);margin-top:auto}
.hcx-time .mini i{display:block;height:100%;background:var(--k,var(--hc-rosa));transform-origin:left;transition:transform .7s var(--hc-e)}
.hcx-time .mini i + i{background:color-mix(in srgb,var(--k,var(--hc-rosa)) 35%,transparent)}
.hcx-time[aria-pressed="true"]{border-color:var(--k,var(--hc-rosa));box-shadow:0 0 0 3px color-mix(in srgb,var(--k,var(--hc-rosa)) 16%,transparent),0 14px 30px -18px color-mix(in srgb,var(--k,var(--hc-rosa)) 60%,transparent)}
.hcx-time.tot{border:0;color:#fff;background:linear-gradient(135deg,#D80073 0%,#A3167F 46%,#4F3F91 100%);background-size:160% 160%;animation:hcxGrad 14s ease-in-out infinite alternate}
.hcx-time.tot .rot,.hcx-time.tot .sub{color:rgba(255,255,255,.82)}
.hcx-time.tot .rot i{background:#fff}
.hcx-time.tot .sub b{color:#fff}
.hcx-time.tot .num{font-size:56px}
.hcx-time.tot .mini{background:rgba(255,255,255,.22)}
.hcx-time.tot .mini i{background:#fff}
.hcx-time.tot .mini i + i{background:rgba(255,255,255,.5)}
.hcx-time.tot[aria-pressed="true"]{box-shadow:0 0 0 3px color-mix(in srgb,#D80073 30%,transparent),0 18px 36px -18px rgba(216,0,115,.7)}
.hcx-time .sel{position:absolute;top:14px;right:14px;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--k,var(--hc-rosa));color:#fff;opacity:0;transform:scale(.6);transition:opacity .18s,transform .22s var(--hc-e)}
.hcx-time.tot .sel{background:#fff;color:#D80073}
.hcx-time[aria-pressed="true"] .sel{opacity:1;transform:none}
.hcx-time .sel svg{width:13px;height:13px}
@keyframes hcxGrad{from{background-position:0% 30%}to{background-position:100% 70%}}
/* resumo (26/11/2026): situação da seleção | atendimento, num bloco só dividido ao meio */
.hcx-res{--hc-at:#0E7C66;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:18px;border:1px solid var(--hc-borda);background:var(--hc-sup);overflow:hidden}
html[data-tema="escuro"] .hcx-res{--hc-at:#3fc2a2}
.hcx-rp{display:flex;flex-direction:column;gap:14px;min-width:0;padding:16px 18px 18px}
.hcx-rp + .hcx-rp{border-left:1px solid var(--hc-borda)}
.hcx-rp.at{background:linear-gradient(160deg,color-mix(in srgb,var(--hc-at) 9%,transparent),color-mix(in srgb,var(--hc-at) 2%,transparent) 70%)}
.hcx-rh{display:flex;align-items:flex-start;justify-content:space-between;gap:6px 14px}
.hcx-rh > div{flex:1;min-width:0}
.hcx-rh h3{display:flex;align-items:center;gap:8px;margin:0;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--hc-tx2)}
.hcx-rh h3 i{width:9px;height:9px;border-radius:3px;background:var(--k,var(--hc-rosa))}
.hcx-rh p{margin:4px 0 0;font-size:12px;line-height:1.4;color:var(--hc-tx2)}
.hcx-rh .eq{font-size:12px;color:var(--hc-tx2);white-space:nowrap;padding-top:1px}
.hcx-rh .eq b{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;color:var(--hc-tx);font-variant-numeric:tabular-nums}
.hcx-rh .ver{display:inline-flex;align-items:center;gap:3px;padding:4px 6px 4px 11px;border-radius:999px;border:1px solid color-mix(in srgb,var(--hc-at) 40%,transparent);background:transparent;color:var(--hc-at);font:inherit;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;transition:background-color .15s}
.hcx-rh .ver svg{width:13px;height:13px}
.hcx-rs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.hcx-st{display:flex;flex-direction:column;gap:3px;min-width:0;margin:0;padding:8px 10px;border:0;border-radius:12px;background:transparent;color:var(--hc-tx);font:inherit;text-align:left;cursor:pointer;transition:background-color .15s}
.hcx-st b{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:30px;line-height:1.05;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hcx-st span{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.hcx-st span i{width:8px;height:8px;flex:none;border-radius:50%;background:var(--k)}
.hcx-st small{font-size:11.5px;line-height:1.35;color:var(--hc-tx2)}
.hcx-rb{display:flex;gap:3px;height:8px;margin-top:auto;transform:scaleX(0);transform-origin:left;transition:transform .9s var(--hc-e)}
.hcx-rb i{display:block;height:100%;min-width:4px;border-radius:999px;background:var(--k)}
.hcx-in .hcx-rb{transform:none}
.hcx-rv0{font-size:12px;color:var(--hc-tx2);margin-top:auto}
.hcx-st:focus-visible,.hcx-rh .ver:focus-visible,.hcx-lk:focus-visible{outline:2px solid var(--hc-rosa);outline-offset:1px}
/* ações no cabeçalho dos cartões */
.hcx-lk{flex:none;display:inline-flex;align-items:center;gap:3px;padding:5px 7px 5px 12px;border-radius:999px;border:1px solid var(--hc-borda);background:transparent;color:var(--hc-rosa);font:inherit;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;transition:border-color .15s,background-color .15s}
.hcx-lk svg{width:13px;height:13px}
.hcx-tm{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding:7px 12px;border-radius:12px;background:color-mix(in srgb,var(--hc-rosa) 7%,transparent);text-align:right}
.hcx-tm span{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--hc-tx2)}
.hcx-tm b{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:17px;line-height:1.15;font-weight:700;color:var(--hc-tx);font-variant-numeric:tabular-nums}
.hcx-tm small{font-size:11px;font-weight:700;color:#0E7C66}
html[data-tema="escuro"] .hcx-tm small{color:#5fd3b5}
/* blocos */
.hcx-g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:stretch}
.hcx-g3{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:stretch}
.hcx-pilha{display:flex;flex-direction:column;gap:14px;min-width:0}
.hcx-pilha > .hcx-card{flex:1}
.hcx-pilha .hcx-lin{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 44px 56px}
.hcx-pilha .hcx-lin.t{grid-template-columns:14px minmax(0,1fr) 44px 56px}
.hcx-card{display:flex;flex-direction:column;min-width:0;border-radius:18px;border:1px solid var(--hc-borda);background:var(--hc-sup);overflow:hidden}
.hcx-card > header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px 12px}
.hcx-card > header h3{margin:0;font-size:15px;font-weight:800;color:var(--hc-tx)}
.hcx-card > header p{margin:2px 0 0;font-size:12px;color:var(--hc-tx2)}
.hcx-card > header .ic{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--hc-rosa) 10%,transparent);color:var(--hc-rosa)}
.hcx-card > header .ic svg{width:17px;height:17px}
.hcx-card > .cp{padding:2px 18px 16px;display:flex;flex-direction:column;gap:2px;flex:1}
.hcx-leg{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 18px 12px;font-size:11.5px;color:var(--hc-tx2)}
.hcx-leg span{display:inline-flex;align-items:center;gap:6px}
.hcx-leg i{width:9px;height:9px;border-radius:3px;background:var(--k)}
.hcx-lin{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) 44px 56px;gap:12px;align-items:center;width:100%;padding:8px 8px;margin:0 -8px;border:0;border-radius:10px;background:transparent;color:var(--hc-tx);font:inherit;text-align:left;cursor:pointer;transition:background-color .15s}
.hcx-lin .nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcx-lin .nm small{display:block;font-size:11px;font-weight:600;color:var(--hc-tx2)}
.hcx-lin .tr{display:flex;height:10px;border-radius:999px;overflow:hidden;background:color-mix(in srgb,var(--hc-borda) 60%,transparent)}
.hcx-lin .tr i{display:block;height:100%;background:var(--k,var(--hc-rosa));transform:scaleX(0);transform-origin:left;transition:transform .75s var(--hc-e)}
.hcx-in .hcx-lin .tr i,.hcx-on .hcx-time .mini i{transform:none}
.hcx-lin .v{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:14px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.hcx-lin .p{font-size:12px;color:var(--hc-tx2);text-align:right;font-variant-numeric:tabular-nums}
.hcx-lin .fora{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;font-size:10.5px;font-weight:800;color:#B25E00;background:#FFF1DC;vertical-align:middle}
html[data-tema="escuro"] .hcx-lin .fora{color:#f2cf8a;background:#3a2c12}
/* histograma */
.hcx-hist{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:end;flex:1;min-height:220px;padding:6px 18px 0}
.hcx-col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;min-width:0;padding:0;border:0;background:transparent;color:var(--hc-tx);font:inherit;cursor:pointer}
.hcx-col b{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.hcx-col .pc{margin-top:-4px;font-size:11px;font-weight:700;color:var(--hc-tx2);font-variant-numeric:tabular-nums}
.hcx-col .br{width:100%;max-width:64px;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,var(--hc-rosa),color-mix(in srgb,var(--hc-rosa) 55%,var(--hc-roxo)));transform:scaleY(0);transform-origin:bottom;transition:transform .8s var(--hc-e),filter .15s}
.hcx-in .hcx-col .br{transform:none}
.hcx-histx{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:8px 18px 16px;border-top:1px solid var(--hc-borda);margin-top:8px}
.hcx-histx span{font-size:10.5px;line-height:1.25;text-align:center;color:var(--hc-tx2)}
/* turnos */
.hcx-turno{display:flex;height:16px;border-radius:999px;overflow:hidden;margin:4px 0 12px;background:color-mix(in srgb,var(--hc-borda) 60%,transparent)}
.hcx-turno i{display:block;height:100%;background:var(--k);transform:scaleX(0);transform-origin:left;transition:transform .8s var(--hc-e)}
.hcx-in .hcx-turno i{transform:none}
.hcx-lin.t{grid-template-columns:14px minmax(0,1fr) 44px 56px}
.hcx-lin.t > i{width:10px;height:10px;border-radius:3px;background:var(--k)}
/* entrada */
@keyframes hcxSobe{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:none}}
.hcx-anim > *{animation:hcxSobe .55s var(--hc-e) both}
.hcx-anim > *:nth-child(2){animation-delay:60ms}.hcx-anim > *:nth-child(3){animation-delay:120ms}.hcx-anim > *:nth-child(4){animation-delay:180ms}.hcx-anim > *:nth-child(5){animation-delay:240ms}
.hcx-vazio{padding:28px 18px;text-align:center;color:var(--hc-tx2);font-size:13px}
@media (hover:hover) and (pointer:fine){
  .hcx-time:hover{transform:translateY(-2px)}
  .hcx-bt:hover{border-color:var(--hc-rosa)}
  .hcx-st:hover{background:color-mix(in srgb,var(--hc-tx) 5%,transparent)}
  .hcx-rp.at .hcx-st:hover{background:color-mix(in srgb,var(--hc-at) 10%,transparent)}
  .hcx-rh .ver:hover{background:color-mix(in srgb,var(--hc-at) 10%,transparent)}
  .hcx-lk:hover{border-color:var(--hc-rosa);background:color-mix(in srgb,var(--hc-rosa) 6%,transparent)}
  .hcx-lin:hover{background:color-mix(in srgb,var(--hc-rosa) 6%,transparent)}
  .hcx-col:hover .br{filter:brightness(1.12)}
}
/* janela de pessoas */
.hcp h2{margin:0;font-size:19px;font-weight:800;color:var(--hc-tx,var(--preto))}
.hcp .sb{margin:4px 0 14px;font-size:13px;color:var(--c4,#6d6679)}
.hcp-busca{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;margin-bottom:12px;border-radius:11px;border:1.5px solid var(--c2,#E6DFEE);background:var(--sup,#fff)}
.hcp-busca svg{width:16px;height:16px;flex:none;color:var(--c4,#6d6679)}
.hcp-busca input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:var(--preto)}
.hcp-busca:focus-within{border-color:var(--rosa,#D80073)}
.hcp-lista{border:1px solid var(--c2,#E6DFEE);border-radius:14px;overflow:clip}
.hcp-cab,.hcp-it{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.3fr) minmax(0,1.1fr) minmax(0,1fr) 84px;gap:12px;align-items:center;padding:9px 14px}
.hcp-cab{position:sticky;top:-22px;z-index:2;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c4,#6d6679);background:var(--sup2,#F6F2FA);border-bottom:1px solid var(--c2,#E6DFEE)}
html[data-tema="escuro"] .hcp-cab{background:#26262f}
.hcp-it{border-bottom:1px solid color-mix(in srgb,var(--c2,#E6DFEE) 70%,transparent);font-size:13px;color:var(--preto)}
.hcp-it:last-child{border-bottom:0}
.hcp-it .q{display:flex;align-items:center;gap:10px;min-width:0}
.hcp-it .q b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcp-it .q small,.hcp-it small{display:block;font-size:11.5px;color:var(--c4,#6d6679);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-st{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:999px;font-size:11px;font-weight:800;color:var(--k);background:color-mix(in srgb,var(--k) 12%,transparent);white-space:nowrap}
.hc-st i{width:7px;height:7px;border-radius:50%;background:var(--k)}
/* uma barra de rolagem só: com uma janela aberta, a página de fundo para de rolar */
html.mdl-aberta,html.mdl-aberta body{overflow:hidden!important}
html.mdl-aberta body{padding-right:var(--mdl-sb,0px)}
/* barra de rolagem das janelas: fina, arredondada e dentro do canto arredondado */
#modais .modal,#modais .hcp,#modais .tmP-corpo{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,#6d6679 45%,transparent) transparent}
#modais .modal::-webkit-scrollbar,#modais .hcp::-webkit-scrollbar,#modais .tmP-corpo::-webkit-scrollbar{width:12px;height:12px}
#modais .modal::-webkit-scrollbar-track,#modais .hcp::-webkit-scrollbar-track,#modais .tmP-corpo::-webkit-scrollbar-track{background:transparent;margin:14px 0}
#modais .modal::-webkit-scrollbar-thumb,#modais .hcp::-webkit-scrollbar-thumb,#modais .tmP-corpo::-webkit-scrollbar-thumb{background:color-mix(in srgb,#6d6679 40%,transparent);border-radius:999px;border:3px solid transparent;background-clip:padding-box}
#modais .modal::-webkit-scrollbar-thumb:hover,#modais .hcp::-webkit-scrollbar-thumb:hover,#modais .tmP-corpo::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,#D80073 60%,transparent)}
#modais .modal::-webkit-scrollbar-corner{background:transparent}
/* entrada ao rolar */
.hcx-rv{opacity:0;transform:translate3d(0,22px,0) scale(.99);transition:opacity .65s var(--hc-e),transform .8s var(--hc-e)}
.hcx-rv.hcx-in{opacity:1;transform:none}
/* janela sem rolagem interna: quem rola é o fundo */
.modal-fundo.hc-pf{align-items:center;overflow:hidden;padding:20px 18px}
.modal-fundo.hc-pf > .modal{max-height:calc(100vh - 40px)!important;max-height:calc(100dvh - 40px)!important;overflow:hidden!important;margin:0;padding:0!important;display:flex;flex-direction:column;border-radius:20px!important;box-shadow:0 30px 70px -20px rgba(20,10,30,.45)}
.modal-fundo.hc-pf > .modal > .hcp{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px 24px;overscroll-behavior:contain}
@media (max-width:640px){ .modal-fundo.hc-pf{padding:10px 8px} .modal-fundo.hc-pf > .modal{max-height:calc(100dvh - 20px)!important;border-radius:16px!important} .modal-fundo.hc-pf > .modal > .hcp{padding:16px 14px} .hcp-cab{top:-16px!important} }
/* nome e foto como botão */
.hcp-pn{display:flex;align-items:center;gap:10px;min-width:0;width:100%;padding:4px 8px 4px 4px;margin:-4px 0 -4px -4px;border:0;border-radius:12px;background:transparent;color:var(--preto);font:inherit;text-align:left;cursor:pointer;transition:background-color .15s}
.hcp-pn .tx{min-width:0;flex:1}.hcp-pn .tx b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s}.hcp-pn .tx small{display:block;font-size:11.5px;color:var(--c4,#6d6679);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcp-pn .ver{flex:none;display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--rosa,#D80073) 10%,transparent);color:var(--rosa,#D80073);font-size:11px;font-weight:800;white-space:nowrap;opacity:0;transform:translateX(-6px);transition:opacity .18s,transform .22s cubic-bezier(.23,1,.32,1)}
.hcp-pn .ver svg{width:12px;height:12px}

    var atual = [].slice.call(el.children).filter(function (c) { return c.matches('[data-sub],.sn-div,.sn-aj'); });
    var igual = atual.length === seq.length && atual.every(function (c, i) { return seq[i] === '|' ? c.classList.contains('sn-div') : c === seq[i]; });
    if (!igual) { el.querySelectorAll('.sn-div').forEach(function (d) { d.remove(); }); seq.forEach(function (n) { if (n === '|') { var d = document.createElement('span'); d.className = 'sn-div'; d.setAttribute('aria-hidden', 'true'); el.appendChild(d); } else el.appendChild(n); }); }

  function ajFechar() { var p = document.querySelector('.sn-ajp'); if (p) p.remove(); var b = document.querySelector('.sn-aj'); if (b) b.setAttribute('aria-expanded', 'false'); document.removeEventListener('click', ajFora, true); document.removeEventListener('keydown', ajEsc, true); }

    p.innerHTML = '<small>Ajustes do WFM</small>' + [['plan', 'Planejamento', 'Montar e publicar as escalas'], ['fer', 'Feriados', 'Cadastro usado nas escalas e na aderência'], ['usr', 'Usuários', 'Cadastrar, atualizar, movimentar ou desligar']].map(function (x) { return '<button type="button" role="menuitem" data-aj="' + x[0] + '" class="' + (estado.sub === x[0] ? 'at' : '') + '">' + hcSvg(x[0]) + '<div>' + x[1] + '<span>' + x[2] + '</span></div></button>'; }).join('');
    document.body.appendChild(p); var r = b.getBoundingClientRect(); p.style.top = (r.bottom + 8) + 'px'; p.style.right = Math.max(8, window.innerWidth - r.right) + 'px'; b.setAttribute('aria-expanded', 'true');
    p.querySelectorAll('[data-aj]').forEach(function (x) { x.onclick = function () { var s = x.getAttribute('data-aj'); ajFechar(); if (s === estado.sub) return; if (estado.sub === 'plan' && temEdicoes() && !confirm('Há alterações não salvas na grade. Sair mesmo assim?')) return; if (estado.sub === 'plan') estado.edits = {}; estado.sub = s; telaGestao(); }; });
    setTimeout(function () { document.addEventListener('click', ajFora, true); document.addEventListener('keydown', ajEsc, true); var f = p.querySelector('button'); if (f) f.focus(); }, 0);
  }

/* ---------- Cartão do Colaborador: ao passar o mouse num agente, em qualquer aba ---------- */
(function () {
  var pop = null, t = 0, alvo = null;
  function fechar() { clearTimeout(t); alvo = null; if (pop) pop.classList.remove('on'); }
  function abrir(el, p) {
    if (!pop) { pop = document.createElement('div'); pop.className = 'hc-pop'; pop.setAttribute('role', 'tooltip'); document.body.appendChild(pop); }
    var l = function (a, b) { return b ? '<dt>' + a + '</dt><dd>' + esc(b) + '</dd>' : ''; };
    pop.innerHTML = '<div class="q">' + avatarHtml(p.email, hcNome(p.nome), '') + '<div style="min-width:0"><b>' + esc(hcNome(p.nome)) + '</b><small>' + esc(p.funcao) + '</small></div></div><dl>' +
      l('Coordenação', p.coord) + l('Squad', p.squad !== p.coord ? p.squad : '') + l('Líder', p.lider && p.lider !== '-' ? p.lider : '') + l('Turno', (p.turno === 'Intermediario' ? 'Intermediário' : p.turno) + ' · ' + p.entrada + ' às ' + p.saida) + l('Convênio', p.convenio) + l('Segmento', p.segmento) + l('Tempo de Casa', p.tempo) + '</dl>' +
      '<div class="rd">' + hcStatus(p.status) + ' &nbsp;Dados do Headcount</div>';
    if (typeof atualizarAvatares === 'function') atualizarAvatares();
    var r = el.getBoundingClientRect(), w = 290, h = pop.offsetHeight || 220, x = Math.min(window.innerWidth - w - 10, Math.max(10, r.left)), y = r.bottom + 8; if (y + h > window.innerHeight - 10) y = Math.max(10, r.top - h - 8);
    pop.style.left = x + 'px'; pop.style.top = y + 'px'; requestAnimationFrame(function () { pop.classList.add('on'); });
  }
  document.addEventListener('mouseover', function (ev) {
    if (!estado.hc || !ehGestao() || estado.aba === 'headcount' || !ev.target.closest) return;
    var el = ev.target.closest('[data-ag],tr[data-em]'); if (!el || el === alvo) return; if (el.closest('.modal-fundo .hcp')) return;
    var em = String(el.getAttribute('data-ag') || el.getAttribute('data-em') || '').toLowerCase(), p = estado.hc.mapa[em]; if (!p) return;
    fechar(); alvo = el; t = setTimeout(function () { if (alvo === el && document.body.contains(el)) abrir(el, p); }, 420);
  });
  document.addEventListener('mouseout', function (ev) { if (!alvo) return; var para = ev.relatedTarget; if (para && alvo.contains(para)) return; fechar(); });
  window.addEventListener('scroll', fechar, true); document.addEventListener('click', fechar, true);
})();
