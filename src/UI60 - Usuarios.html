    '<div class="pl-acoes"><button class="btn" id="usrNovo">' + usrSvg('novo').replace('<svg ', '<svg style="width:16px;height:16px;vertical-align:-3px;margin-right:6px" ') + 'Cadastrar usuário</button></div></div>' +
    '<div class="usr-kpis" role="group" aria-label="Filtrar usuários">' + filtros.map(function (f, i) { return '<button type="button" class="usr-kpi" style="--k:' + f[2] + ';--i:' + i + '" data-f="' + f[0] + '" aria-pressed="' + (F.f === f[0]) + '"><b data-n="' + cont[f[0]] + '">' + cont[f[0]] + '</b><span>' + f[1] + '</span></button>'; }).join('') + '</div>' +
    '<div class="usr-barra"><label class="usr-busca"><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Buscar usuário</span>' + usrSvg('busca') + '<input type="search" id="usrQ" placeholder="Buscar por nome, e-mail, tag ou coordenação" autocomplete="off" value="' + esc(F.q) + '"></label><span class="usr-conta" id="usrConta"></span></div>' +
    '<div class="usr-lista" id="usrLista"></div></div>';

function usrSemAcento(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

  var R = estado.usr, F = estado.usrF, el = $('usrLista'); if (!el) return;
  var f = USR_FILTROS.filter(function (x) { return x[0] === F.f; })[0] || USR_FILTROS[0], q = usrSemAcento(F.q);
  var l = R.usuarios.filter(f[3]).filter(function (u) { return !q || usrSemAcento(u.nome + ' ' + u.email + ' ' + u.tag.rot + ' ' + u.coord + ' ' + u.cargo).indexOf(q) >= 0; });
  $('usrConta').textContent = l.length + (l.length === 1 ? ' pessoa' : ' pessoas');
  if (!l.length) { el.innerHTML = '<div class="usr-vz">' + (q ? 'Ninguém encontrado com essa busca.' : 'Ninguém neste filtro.') + '</div>'; return; }
  var linha = function (u, i) {
    var saiu = u.sit === 'DESLIGADO' || u.sit === 'MOVIMENTADO', podeSair = !saiu && u.sit === 'ATIVO' && !u.desligadoEm && !u.movimentadoEm && !u.eu;
    return '<div class="usr-it' + (saiu || u.sit === 'SEM_ACESSO' ? ' usr-fora' : '') + '" data-em="' + esc(u.email) + '" style="--i:' + Math.min(i, 16) + '">' +
      '<button type="button" class="usr-q" data-ed="' + esc(u.email) + '" title="Editar o cadastro de ' + esc(u.nome) + '">' + avatarHtml(u.email, u.nome, '') + '<span class="tx"><b>' + esc(u.nome) + (u.eu ? ' <small style="display:inline">(você)</small>' : '') + '</b><small>' + esc(u.email) + '</small></span></button>' +
      '<div class="usr-tg"><span class="pp pp-' + esc(u.tag.cls) + '">' + esc(u.tag.rot) + '</span>' + (u.fixo ? '<em>Acesso fixo do WFM</em>' : '') + '</div>' +
      '<div class="usr-co">' + esc(u.coord && u.coord !== '—' ? u.coord : 'Sem coordenação') + '<small>' + esc(u.cargo || (u.perfil === 'GESTAO' ? 'Gestão' : 'Agente')) + '</small></div>' +
      '<div>' + usrStatus(u) + '</div>' +
      '<div class="usr-ac"><button type="button" class="usr-ib ed" data-ed="' + esc(u.email) + '" title="Editar cadastro" aria-label="Editar o cadastro de ' + esc(u.nome) + '">' + usrSvg('ed') + '</button>' +
        (podeSair ? '<button type="button" class="usr-ib mv" data-mv="' + esc(u.email) + '" title="Registrar Movimentação" aria-label="Registrar a movimentação de ' + esc(u.nome) + '">' + usrSvg('mv') + '</button><button type="button" class="usr-ib dl" data-dl="' + esc(u.email) + '" title="Registrar Desligamento" aria-label="Registrar o desligamento de ' + esc(u.nome) + '">' + usrSvg('dl') + '</button>' : '') + '</div></div>';
  };
  el.classList.toggle('usr-an', !!animar && !usrReduz());
  el.innerHTML = '<div class="usr-cabl" aria-hidden="true"><span>Pessoa</span><span>Tag</span><span>Coordenação e cargo</span><span>Situação</span><span></span></div>' + l.map(linha).join('');
  if (animar) setTimeout(function () { el.classList.remove('usr-an'); }, 1200);
  el.querySelectorAll('[data-ed]').forEach(function (b) { b.onclick = function () { usrModal(R.mapa[b.getAttribute('data-ed')]); }; });
  el.querySelectorAll('[data-mv]').forEach(function (b) { b.onclick = function () { if (typeof movModal === 'function') movModal(b.getAttribute('data-mv')); }; });
  el.querySelectorAll('[data-dl]').forEach(function (b) { b.onclick = function () { if (typeof dslModal === 'function') dslModal(b.getAttribute('data-dl')); }; });
  if (typeof atualizarAvatares === 'function') atualizarAvatares();
  if (flash) { var it = el.querySelector('.usr-it[data-em="' + flash.replace(/"/g, '') + '"]'); if (it) { it.classList.add('usr-flash'); try { it.scrollIntoView({ block: 'center', behavior: usrReduz() ? 'auto' : 'smooth' }); } catch (e) { } } }
}

/* ---------- janela: cadastrar ou editar ---------- */
function usrModal(u) {
  var R = estado.usr, novo = !u, travado = !!u && (u.fixo || u.eu);
  var st = { perfil: u ? u.perfil : '', papel: u && u.perfil === 'GESTAO' ? (R.papeis.some(function (p) { return p.id === u.papel; }) ? u.papel : '') : '' };
  if (u && u.perfil === 'GESTAO' && !st.papel) { var ach = R.papeis.filter(function (p) { return u.tag && p.rot === u.tag.rot; })[0] || R.papeis.filter(function (p) { return u.tag && p.cls === u.tag.cls; })[0]; st.papel = ach ? ach.id : 'Gestão'; }
  var ini = { perfil: st.perfil, papel: st.papel };
  var opCoord = '<option value="">' + (u && !u.coordManual && u.coord && u.coord !== '—' ? 'Pela planilha do Headcount (' + esc(u.coord) + ')' : 'Sem coordenação') + '</option>' +
    R.coordenacoes.map(function (c) { return '<option value="' + esc(c.id) + '"' + (u && u.coordManual === c.id ? ' selected' : '') + '>' + esc(c.nome) + '</option>'; }).join('');
  var acesso = travado
    ? '<div class="usr-nota">' + usrSvg('info') + '<span>' + (u.eu ? 'Você não pode mudar o seu próprio acesso.' : 'Esta pessoa está na lista fixa do WFM. O acesso dela só muda pelo código.') + ' O acesso atual é <span class="pp pp-' + esc(u.tag.cls) + '">' + esc(u.tag.rot) + '</span>.</span></div>'
    : '<span class="usr-rot">Acesso</span><div class="tipos usr-tipos"><button type="button" class="tipo" data-p="AGENTE"><b>Agente</b><span>Vê a própria escala e a presença e pede trocas. Fica com a tag de Agente.</span></button><button type="button" class="tipo" data-p="GESTAO"><b>Gestão</b><span>Vê as visões da gestão, com a tag escolhida abaixo.</span></button></div>' +
      '<div class="usr-col" id="uTagsBox"><div><span class="usr-rot">Tag de gestão</span><div class="usr-tags" role="radiogroup" aria-label="Tag de gestão">' + R.papeis.map(function (p) { return '<button type="button" role="radio" class="pp pp-' + p.cls + '" data-tag="' + esc(p.id) + '" aria-checked="false">' + esc(p.rot) + '</button>'; }).join('') + '</div><p class="usr-desc" id="uTagDesc"></p></div></div>';
  var w = abrirModal('<div class="usr-md">' +
    '<div class="mcab"><span class="ic">' + usrSvg(novo ? 'novo' : 'ed') + '</span><div><h3>' + (novo ? 'Cadastrar usuário' : 'Editar cadastro') + '</h3><p>' + (novo ? 'A pessoa passa a entrar no painel com o acesso escolhido.' : esc(u.email)) + '</p></div></div>' +
    '<div class="campo"><label for="uEm">E-mail</label><input id="uEm" type="email" inputmode="email" autocomplete="off" spellcheck="false" maxlength="80" placeholder="nome.sobrenome@exemplo.com" value="' + esc(u ? u.email : '') + '"' + (novo ? '' : ' readonly') + '></div>' +
    '<div class="campo"><label for="uNm">Nome completo</label><input id="uNm" type="text" autocomplete="off" maxlength="120" placeholder="Nome e sobrenome" value="' + esc(u ? usrNomeBonito(u.nomeCompleto || u.nome) : '') + '"></div>' +
    acesso +
    '<div class="campo"><label for="uCo">Coordenação <small>(opcional)</small></label><select id="uCo">' + opCoord + '</select></div>' +
    '<div class="usr-prev" aria-live="polite"><span class="usr-av" id="uAv">?</span><span class="tx"><small>Vai aparecer assim</small><b id="uPvN">Nome da pessoa</b><span id="uPvC"></span></span><span id="uPvT"></span></div>' +
    (novo ? '<label class="opcard on" id="uConv"><input type="checkbox" checked><div><b>Enviar o e-mail para criar a senha</b><span>A pessoa recebe na hora o link para criar a senha. Ela também pode pedir pela tela de entrada.</span></div></label>' : '') +
    '<div id="uMsg"></div>' +
    '<div class="acoes"><button class="btn sec" data-fechar>Cancelar</button><button class="btn" id="uOk">' + (novo ? 'Cadastrar usuário' : 'Salvar') + '</button></div></div>');
  var q = function (s) { return w.querySelector(s); }, $em = q('#uEm'), $nm = q('#uNm'), $co = q('#uCo'), $ok = q('#uOk'), ultTag = '';
  var msg = function (html) { var m = q('#uMsg'); m.innerHTML = html ? '<div class="usr-msg">' + html + '</div>' : ''; var x = m.firstChild; if (x && !usrReduz()) { x.classList.add('usr-treme'); } };
  function papelAtual() { return R.papeis.filter(function (p) { return p.id === st.papel; })[0] || null; }
  function tagDe() { if (travado) return u.tag; if (st.perfil === 'AGENTE') return { rot: 'Agente', cls: 'agente' }; var p = papelAtual(); return st.perfil === 'GESTAO' && p ? { rot: p.rot, cls: p.cls } : null; }
  function prever() {
    var n = usrNomeBonito($nm.value.trim()); q('#uPvN').textContent = n || 'Nome da pessoa'; q('#uAv').textContent = n ? usrIni(n) : '?';
    var co = $co.options[$co.selectedIndex]; q('#uPvC').textContent = ($em.value.trim().toLowerCase() || 'e-mail') + ' · ' + (co ? co.text.replace(/^Pela planilha do Headcount \((.*)\)$/, '$1') : '');
    var t = tagDe(), k = t ? t.cls + '|' + t.rot : '';
    if (k !== ultTag) { ultTag = k; var box = q('#uPvT'); box.innerHTML = t ? '<span class="pp pp-' + esc(t.cls) + (usrReduz() ? '' : ' usr-pop') + '">' + esc(t.rot) + '</span>' : ''; }
  }
  function pintarAcesso() {
    if (travado) return;
    w.querySelectorAll('[data-p]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-p') === st.perfil); b.setAttribute('aria-pressed', String(b.getAttribute('data-p') === st.perfil)); });
    q('#uTagsBox').classList.toggle('on', st.perfil === 'GESTAO');
    w.querySelectorAll('[data-tag]').forEach(function (b) { var on = b.getAttribute('data-tag') === st.papel; b.classList.toggle('on', on); b.setAttribute('aria-checked', String(on)); b.tabIndex = st.perfil === 'GESTAO' ? 0 : -1; });
    var p = papelAtual(); q('#uTagDesc').textContent = p ? p.desc + '.' : 'Escolha a tag que aparece para esta pessoa no painel.';
    prever();
  }
  if (!travado) {
    w.querySelectorAll('[data-p]').forEach(function (b) { b.onclick = function () { st.perfil = b.getAttribute('data-p'); if (st.perfil === 'GESTAO' && !st.papel) st.papel = ''; msg(''); pintarAcesso(); }; });
    w.querySelectorAll('[data-tag]').forEach(function (b) { b.onclick = function () { st.papel = b.getAttribute('data-tag'); msg(''); pintarAcesso(); }; });
  }
  /* e-mail: completa o domínio e avisa na hora se já existe */
  function emailOk() { var v = $em.value.trim().toLowerCase(); return /^[a-z0-9._-]+@exemplo\.com$/.test(v) ? v : ''; }
  function conferirEmail() {
    if (!novo) return true; var v = emailOk(); if (!v) return false;
    var x = R.mapa[v];
    if (x && x.sit === 'ATIVO') { msg('Este e-mail já está cadastrado (' + esc(x.nome) + ').<button type="button" id="uIrEd">Editar o cadastro</button>'); var b = q('#uIrEd'); if (b) b.onclick = function () { w.remove(); usrModal(x); }; return false; }
    if (x && (x.sit === 'DESLIGADO' || x.sit === 'MOVIMENTADO')) { msg('Este e-mail tem ' + (x.sit === 'MOVIMENTADO' ? 'movimentação' : 'desligamento') + ' registrado. O retorno de quem saiu não é feito por esta tela.'); return false; }
    if (x && !$nm.value.trim()) $nm.value = usrNomeBonito(x.nomeCompleto || x.nome);
    msg(''); return true;
  }
  if (novo) {
    $em.addEventListener('blur', function () { var v = $em.value.trim().toLowerCase().replace(/\s+/g, ''); if (v && v.indexOf('@') < 0) v += '@exemplo.com'; $em.value = v; prever(); if (v) { if (!emailOk()) msg('Use um e-mail @exemplo.com válido.'); else conferirEmail(); } });
    $em.addEventListener('input', function () { prever(); });
    var cv = q('#uConv'); cv.onclick = function (ev) { ev.preventDefault(); var i = cv.querySelector('input'); i.checked = !i.checked; cv.classList.toggle('on', i.checked); };
  }
  $nm.addEventListener('input', prever); $co.addEventListener('change', prever);
  pintarAcesso(); prever();
  setTimeout(function () { (novo ? $em : $nm).focus(); }, 60);
  $ok.onclick = function () {
    var email = novo ? emailOk() : u.email, nome = $nm.value.replace(/\s+/g, ' ').trim();
    if (novo && !email) { msg('Use um e-mail @exemplo.com válido.'); $em.focus(); return; }
    if (novo && !conferirEmail()) return;
    if (nome.split(' ').length < 2 || nome.length < 5) { msg('Informe o nome completo (nome e sobrenome).'); $nm.focus(); return; }
    if (!travado && !st.perfil) { msg('Escolha o acesso: Agente ou Gestão.'); return; }
    if (!travado && st.perfil === 'GESTAO' && !st.papel) { msg('Escolha a tag de gestão.'); return; }
    var conv = q('#uConv'), txt = $ok.textContent; ocupado($ok, true, novo ? 'Cadastrando…' : 'Salvando…'); msg('');
    chamar('apiUsuarioSalvar', estado.token, { novo: novo, email: email, nome: nome, perfil: travado ? u.perfil : st.perfil, papel: st.papel, manterAcesso: !novo && st.perfil === ini.perfil && (st.perfil !== 'GESTAO' || st.papel === ini.papel), coordId: $co.value, convite: !!(conv && conv.querySelector('input').checked) }).then(function (r) {
      w.remove();
      toast(r.novo ? 'Usuário cadastrado: ' + r.nome + '.' + (r.convite ? ' O e-mail para criar a senha foi enviado.' : '') : r.nada ? 'Nada mudou no cadastro.' : 'Cadastro de ' + r.nome + ' atualizado.' + (r.sessoesEncerradas ? ' A pessoa vai precisar entrar de novo.' : ''));
      // os selos, os nomes e a lista de pessoas da gestão são lidos de novo
      estado.papeis = null; estado.__papeisP = null; if (typeof carregarPapeis === 'function') carregarPapeis();
      if (estado.nomes) chamar('apiNomes', estado.token).then(function (n) { estado.nomes = n; }).catch(function () { });
      if (r.novo && estado.usrF.f !== 'ativos' && estado.usrF.f !== (r.acesso === 'Agente' ? 'agentes' : 'gestao')) estado.usrF.f = 'ativos';
      telaUsuarios(r.email);
    }).catch(function (e) { ocupado($ok, false, txt); if (/SESSAO_INVALIDA|SEM_PERMISSAO/.test(String(e))) return falhaGeral(e); msg(esc(String((e && e.message) || e).replace(/^Error:\s*/, ''))); });
  };
}
</script>
