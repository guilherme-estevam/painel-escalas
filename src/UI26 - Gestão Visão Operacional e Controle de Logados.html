<style>

<script>
/* ===================== Planejamento: trocar a escala entre 2 agentes ===================== */
var _desenharPlano_26 = desenharPlano;
desenharPlano = function(){
  var r=_desenharPlano_26.apply(this, arguments);
  var pub=document.getElementById('bPublicar');
  if(pub && !document.getElementById('bTrocaAg')){
    var b=document.createElement('button'); b.className='btn sec'; b.id='bTrocaAg'; b.type='button'; b.textContent='⇄ Trocar 2 agentes';
    b.title='Troca a escala inteira do mês entre duas pessoas: dias, horário e atuação';
    b.onclick=modalTrocaAgentes; pub.parentNode.insertBefore(b, pub); b.style.marginRight='8px';
  }
  return r;
};
function faixaMesTA(dias, rot, mes){
  var p=mes.split('-'), n=new Date(+p[0], +p[1], 0).getDate(), h='<i>'+rot+'</i>';
  for(var d=1; d<=30; d++){ if(d>n){ h+='<span style="visibility:hidden"></span>'; continue; } var dom=new Date(+p[0], +p[1]-1, d).getDay()===0;
    h+='<span class="'+(dias.charAt(d-1)==='T'?'t':'')+(dom?' dom':'')+'" title="'+('0'+d).slice(-2)+'/'+p[1]+': '+(dias.charAt(d-1)==='T'?'trabalho':'folga')+(dom?' (domingo)':'')+'"></span>'; }
  return '<div class="ta-mes">'+h+'</div>';
}
function modalTrocaAgentes(){
  var d=estado.plan;
  if(Object.keys(estado.edits||{}).length){ toast('Salve ou descarte as alterações do Planejamento antes de trocar escalas entre agentes.', true); return; }
  var ag=(d.pessoas||[]).filter(function(p){ var e=d.escalas&&d.escalas[p.email]; return p.perfil!=='GESTAO' && e && (e.diasPub||e.dias); }).sort(function(a,b){ return a.nome.localeCompare(b.nome,'pt-BR'); });
  var opts='<option value="">Escolha…</option>'+ag.map(function(p){ return '<option value="'+esc(p.email)+'">'+esc(p.nome)+(p.entrada?' · '+esc(p.entrada)+'–'+esc(p.saida):'')+'</option>'; }).join('');
  var w=abrirModal('<h3>Trocar escala entre 2 agentes</h3><p class="sub">As duas pessoas trocam a escala de <b>'+esc(rotuloMes(d.mes).toLowerCase())+'</b> inteira: dias de trabalho e folga, horário e atuação. Use quando duas pessoas trocam de horário de forma fixa. Os dois recebem aviso no painel e por e-mail.</p>'+
    '<div class="ta-sel"><div><label for="taA">Pessoa 1</label><select id="taA">'+opts+'</select></div><div class="seta" aria-hidden="true">⇄</div><div><label for="taB">Pessoa 2</label><select id="taB">'+opts+'</select></div></div>'+
    '<div id="taPrev"><div class="dica">Escolha as duas pessoas para ver como fica a escala de cada uma.</div></div>'+
    '<label style="display:block;font-size:12px;font-weight:800;color:var(--c4);margin:12px 0 5px" for="taMot">Motivo (opcional)</label><input id="taMot" maxlength="200" placeholder="Ex.: mudança de horário combinada com a coordenação" style="width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--c2,#E6DFEE);font:inherit;background:var(--sup,#fff);color:var(--preto)">'+
    '<div class="acoes"><button class="btn sec" data-fechar>Cancelar</button><button class="btn" id="taOk" disabled>Trocar escalas</button></div>', true);
  var q=function(s){ return w.querySelector(s); }, prev=null;
  var atualizar=function(){
    var a=q('#taA').value, b=q('#taB').value; q('#taOk').disabled=true; prev=null;
    if(!a||!b){ q('#taPrev').innerHTML='<div class="dica">Escolha as duas pessoas para ver como fica a escala de cada uma.</div>'; return; }
    if(a===b){ q('#taPrev').innerHTML='<div class="ta-erro">Escolha duas pessoas diferentes.</div>'; return; }
    q('#taPrev').innerHTML='<div class="carregando" style="min-height:80px"><div class="giro"></div> Conferindo as regras…</div>';
    chamar('apiTrocaAgentesPrevia', estado.token, d.mes, a, b).then(function(r){
      if(q('#taA').value!==a||q('#taB').value!==b) return;
      if(!r.a||!r.b){ q('#taPrev').innerHTML='<div class="ta-erro">'+(r.motivos||[]).map(esc).join('<br>')+'</div>'; return; }
      var card=function(x, y){ return '<div class="ta-card"><h4>'+esc(x.nome)+'</h4>'+
        '<div class="ta-lin"><span class="tag">Hoje</span><b>'+esc(x.horario||'—')+'</b>'+(x.g?' · '+esc(x.g):'')+' · '+x.trab+' dias de trabalho</div>'+
        '<div class="ta-lin"><span class="tag dep">Depois</span><b>'+esc(y.horario||'—')+'</b>'+(y.g?' · '+esc(y.g):'')+' · '+y.trab+' dias de trabalho</div>'+
        faixaMesTA(x.dias,'Hoje',d.mes)+faixaMesTA(y.dias,'Depois',d.mes)+'</div>'; };
      q('#taPrev').innerHTML='<div class="ta-cols">'+card(r.a, r.b)+card(r.b, r.a)+'</div>'+
        '<div class="ta-leg"><span><em style="background:#4F3F91"></em>Trabalho</span><span><em style="background:#F2EEF5;border:1px solid #ddd"></em>Folga</span><span><em style="outline:1.5px solid #E2489A;outline-offset:-1.5px;background:transparent"></em>Domingo</span></div>'+
        (r.ok?'<div class="ta-ok">✓ As duas escalas continuam dentro das regras (5 por 2, domingos, férias e licenças) e não há pedidos de troca pendentes.</div>':'<div class="ta-erro"><b>Não dá para trocar:</b><br>'+r.motivos.map(esc).join('<br>')+'</div>');
      prev=r; q('#taOk').disabled=!r.ok;
    }).catch(function(e){ q('#taPrev').innerHTML=''; falhaGeral(e); });
  };
  q('#taA').onchange=atualizar; q('#taB').onchange=atualizar;
  q('#taOk').onclick=function(){
    if(!prev||!prev.ok) return; var bt=this; ocupado(bt,true,'Trocando…');
    chamar('apiTrocaAgentes', estado.token, d.mes, q('#taA').value, q('#taB').value, q('#taMot').value.trim()).then(function(r){
      if(!r.ok){ ocupado(bt,false,'Trocar escalas'); toast(r.msg, true); return; }
      w.remove(); toast('Escalas trocadas. '+r.a.nome+' agora trabalha das '+r.a.horario+' e '+r.b.nome+' das '+r.b.horario+'.');
      carregarPlano();
    }).catch(function(e){ ocupado(bt,false,'Trocar escalas'); falhaGeral(e); });
  };
}
</script>

<script>
/* ===================== Histórico: detalhe de cada ação ===================== */
var ACAO_FRASE = { TROCA_SOLICITADA:'pediu uma troca de dia', TROCA_ABERTA:'abriu um pedido de troca para qualquer colega apto', TROCA_ACEITA:'aceitou o pedido de troca', TROCA_RECUSADA:'recusou o pedido de troca',
  TROCA_OFERTA_RECUSADA:'recusou o pedido em aberto', TROCA_CANCELADA:'cancelou o pedido', TROCA_APROVADA:'aprovou a troca', TROCA_REJEITADA:'rejeitou a troca', TROCA_APROVACAO_PARCIAL:'aprovou (falta outra aprovação)',
  TROCA_EXPIRADA:'o pedido expirou pelo prazo', TROCA_ENCERRADA_RECUSAS:'o pedido foi encerrado: todos que podiam aceitar recusaram', TROCA_CANCELADA_AUTO:'o pedido foi cancelado porque outra troca dos mesmos dias foi aprovada', TROCA_BLOQUEADA:'tentou uma troca que quebra uma regra', TROCA_INVALIDADA:'a troca ficou inválida' };
function classeStatusTroca(st){ return st==='ABERTA'||st==='AGUARDANDO_COLEGA'?'aberto':st==='AGUARDANDO_GESTAO'?'gestao':/APROVADA|EFETIVADA/.test(st)?'ok':/RECUSADA|REJEITADA|BLOQUEADA|INVALIDADA/.test(st)?'nao':'fim'; }
var ROT_ESTADO = { ACEITOU:'Aceitou', AGUARDANDO:'Aguardando resposta', RECUSOU:'Recusou', SEM_RESPOSTA:'Não respondeu' };
var DET_CACHE_={};
/* busca o detalhe em 3 partes ao mesmo tempo; cada parte fica guardada 25 s no navegador */
function buscarDetalheTroca(id){
  if(!DET_CACHE_[id]){ var p={}; ['base','tl','apr'].forEach(function(k){ p[k]=chamar('apiTrocaDetalhe', estado.token, id, k).catch(function(e){ delete DET_CACHE_[id]; throw e; }); });
    DET_CACHE_[id]=p; setTimeout(function(){ delete DET_CACHE_[id]; }, 25000); }
  return DET_CACHE_[id];
}
document.addEventListener('mouseover', function(e){ var b=e.target&&e.target.closest&&e.target.closest('[data-det-reg]'); if(b&&b.dataset.detReg) buscarDetalheTroca(b.dataset.detReg); }, true);
document.addEventListener('touchstart', function(e){ var b=e.target&&e.target.closest&&e.target.closest('[data-det-reg]'); if(b&&b.dataset.detReg) buscarDetalheTroca(b.dataset.detReg); }, {passive:true, capture:true});
function modalDetalheTroca(id, titulo){
  var w=abrirModal('<h3>'+esc(titulo||'Detalhe da troca')+'</h3><div class="hd-carr"><div class="hd-sk" style="width:60%"></div><div class="hd-sk" style="width:90%;height:60px"></div><div class="hd-sk" style="width:40%"></div><div class="hd-sk" style="width:100%;height:90px"></div></div>', true);
  var p=buscarDetalheTroca(id), q=function(s){ return w.querySelector(s); };
  var esqueleto='<div class="hd-sk" style="width:50%"></div><div class="hd-sk" style="width:100%;height:46px"></div>';
  p.base.then(function(d){
    var alvo=q('.hd-carr'); if(!alvo) return;
    if(!d.ok){ alvo.outerHTML='<div class="dica">'+esc(d.msg||'Não foi possível carregar.')+'</div>'; return; }
    var cont={}; d.pessoas.forEach(function(x){ cont[x.estado]=(cont[x.estado]||0)+1; });
    var cor={ACEITOU:'background:#E3F6EA;color:#1E7A43',AGUARDANDO:'background:#FFF4D6;color:#8A5A00',RECUSOU:'background:#FDE7E9;color:#8a1c22',SEM_RESPOSTA:'background:#F1EEF4;color:#6B6375'};
    var chips=['ACEITOU','AGUARDANDO','RECUSOU','SEM_RESPOSTA'].filter(function(k){ return cont[k]; }).map(function(k){ return '<span style="'+cor[k]+'">'+cont[k]+' '+ROT_ESTADO[k].toLowerCase()+'</span>'; }).join('');
    var curto={ACEITOU:'Aceitou',AGUARDANDO:'Aguardando',RECUSOU:'Recusou',SEM_RESPOSTA:'Sem resposta'};
    var pess=d.pessoas.length? '<div class="hd-sec"><h4>'+(d.tipo==='ABERTA'?'Quem recebeu o pedido ('+d.pessoas.length+')':'Colega escolhido')+'</h4>'+(d.tipo==='ABERTA'?'<div class="hd-chips">'+chips+'</div>':'')+
      '<div class="hd-pess">'+d.pessoas.map(function(x){ return '<div class="hd-p">'+avatarHtml(x.email, x.nome, '')+'<div class="nm"><b>'+esc(x.nome)+'</b><small>'+esc(x.coord)+'</small></div><span class="'+x.estado+'">'+curto[x.estado]+'</span></div>'; }).join('')+'</div></div>' : '';
    var euEm=(estado.dados&&estado.dados.eu&&estado.dados.eu.email)||'', souEu=d.solEmail===euEm, quemPediu=souEu?'Você':primeiro(d.solicitante);
    alvo.outerHTML=
      '<div class="hd-cab"><div class="hd-quem">'+avatarHtml(d.solEmail, d.solicitante, '')+'<div><b>'+esc(souEu?'Você ('+d.solicitante+')':d.solicitante)+'</b><small>'+esc(d.solCoord)+(d.solCargo?' · '+esc(d.solCargo):'')+'<span class="hd-hor"></span></small><small>'+(d.tipo==='ABERTA'?'Pedido para qualquer colega apto':'Pedido para <b style="display:inline;font-size:inherit">'+esc(d.colega)+'</b>')+(d.criadaEm?' · feito em '+dBr(d.criadaEm)+' às '+String(d.criadaEm).slice(11,16):'')+'</small></div></div><span class="hd-st '+classeStatusTroca(d.status)+'">'+esc(d.rotulo)+'</span></div>'+
      '<div class="hd-dias"><div class="hd-dia"><small>'+esc(quemPediu)+' folga</small><b>'+dSem(d.dFolga)+'</b></div><div class="hd-dia trab"><small>'+esc(quemPediu)+' trabalha</small><b>'+dSem(d.dTrab)+'</b></div></div>'+
      (d.motivo?'<div class="dica" style="margin:-4px 0 6px">Motivo: “'+esc(d.motivo)+'”</div>':'')+
      pess+(d.fechado?'':'<div class="hd-sec hd-apr"><h4>Aprovação</h4>'+esqueleto+'</div>')+'<div class="hd-sec hd-tlw"><h4>Linha do tempo</h4>'+esqueleto+'</div><div class="acoes"><button class="btn sec" data-fechar>Fechar</button></div>';
    if(typeof atualizarAvatares==='function') atualizarAvatares();

<script>

    var p=orig.apply(this, arguments); voo[k]=p; var fim=function(){ if(voo[k]===p) delete voo[k]; }; if(p && p.then) p.then(fim, fim); setTimeout(fim, 30000); return p; }; })(chamar);

<script>

/* ===================== Busca com sugestões de nomes ===================== */

  function escolher(i){ var it=itens[i]; if(!it) return; inp.value=it.rot; fechar(); aoEscolher(it); }

  if(m) p.push(m+' troca'+(m>1?'s':'')+' de fila (pausa às '+afMais(h,-10)+')'); if(ma) p.push(ma+' troca'+(ma>1?'s':'')+' de fila no começo do almoço'); if(i) p.push(i+' início'+(i>1?'s':'')+' de turno (já entra'+(i>1?'m':'')+' na fila às '+h+')'); return p.join(' · '); }
/* barra compacta na Visão do dia */
afCardHtml=function(r){ var c=afContar(r), its=r.itens||[], fe=r.feitos||{};
  var prox=its.filter(function(it){ var s=afSituacao(it, r.data); return (s==='agora'||s==='prox') && !fe[it.chave]; });
  var h0=prox.length?prox[0].hora:'', nH=h0?prox.filter(function(it){ return it.hora===h0; }).length:0;
  var txt=!its.length ? 'Nenhuma mudança de fila neste dia.' : c.agoraPend ? c.agoraPend+' ajuste'+(c.agoraPend>1?'s':'')+' para fazer agora · '+h0 : h0 ? 'Próximo às '+h0+' · '+nH+' pessoa'+(nH>1?'s':'') : 'Todos os ajustes do dia já passaram.';
  return '<div class="af-barra'+(c.agoraPend?' urg':'')+'" id="afCard"><span class="ic">'+AF_IC+'</span><div class="tx"><b>Ajustes de fila na Twilio</b><small>'+esc(txt)+'</small></div>'+
    (its.length?'<div class="af-cont">'+(c.agoraPend?'<span class="agora">'+c.agoraPend+' agora</span>':'')+'<span>'+c.total+' no dia</span><span>'+c.feitos+' feito'+(c.feitos===1?'':'s')+'</span></div><button class="btn'+(c.agoraPend?'':' sec')+' peq" type="button" data-afabrir>Abrir ajustes</button>':'')+'</div>'; };
afLigar=function(){ var b=document.querySelector('#afCard [data-afabrir]'); if(b) b.onclick=function(){ afAbrirModal(estado.afDia); }; };
afDesenhar=function(){ var c=$('afCard'), r=estado.afDia; if(c && r){ c.outerHTML=afCardHtml(r); afLigar(); } if($('afModal') && estado.afModalR) afModalCorpo(); };
/* modal com a lista: abas, busca, grupos por horário, fotos e "marcar todos" */
function afAbrirModal(r){ if(!r) return; estado.afModalR=r; estado.afSit='todos'; if(!estado.afAba){ var c=afContar(r); estado.afAba=c.agora?'agora':c.prox?'prox':'todos'; } estado.afBusca='';
  abrirModal('<div class="af-mi" id="afModal"><div class="af-mcab"><span class="ic">'+AF_IC+'</span><div><h3>Ajustes de fila na Twilio</h3><small>'+dataLonga(r.data)+' · a pessoa entra em pausa 10 minutos antes e a fila é trocada no horário</small></div></div>'+
    '<div class="af-ctrl af-ctrl1"><div class="tr-seg" role="tablist" id="afAbas" aria-label="Quando"></div><div class="tr-seg af-st" role="tablist" id="afSit" aria-label="Situação dos ajustes"></div></div><div class="af-ctrl"><input id="afQ" type="text" placeholder="Buscar pessoa, coordenação ou e-mail" autocomplete="off"></div>'+
    '<div class="af-corpo" id="afCorpo"></div><div class="af-rod"><span id="afAtu">Atualiza sozinho a cada 15 segundos.</span><button class="btn sec" data-fechar>Fechar</button></div></div>', true);
  var m=$('afModal'); if(m && m.closest('.modal')) m.closest('.modal').classList.add('af-m');
  $('afQ').oninput=function(){ estado.afBusca=this.value; afModalCorpo(); }; afModalCorpo(); }
function afModalCorpo(){ var r=estado.afModalR, corpo=$('afCorpo'); if(!r || !corpo) return; var fe=r.feitos||{}, c=afContar(r), aba=estado.afAba||'todos', q=semAcentoMin(estado.afBusca||'');
  var abas=[['agora','Agora',c.agora],['prox','Próximos',c.prox],['foi','Já passaram',c.foi],['todos','Todos',c.total]];
  $('afAbas').innerHTML=abas.map(function(a){ return '<button type="button" data-afa="'+a[0]+'" class="'+(aba===a[0]?'ativa ':'')+(a[0]==='agora'&&c.agoraPend?'urg':'')+'">'+a[1]+'<span class="n">'+a[2]+'</span></button>'; }).join('');
  $('afAbas').querySelectorAll('[data-afa]').forEach(function(b){ b.onclick=function(){ estado.afAba=b.dataset.afa; afModalCorpo(); }; });
  var base=(r.itens||[]).filter(function(it){ var s=afSituacao(it, r.data); if(aba!=='todos' && s!==aba) return false; if(q && semAcentoMin(it.nome+' '+it.coord+' '+it.email).indexOf(q)<0) return false; return true; });
  var sit=estado.afSit||'todos', nF=base.filter(function(it){ return fe[it.chave]; }).length, nP=base.length-nF, stEl=$('afSit');
  if(stEl){ stEl.innerHTML=[['todos','Ambos',base.length,''],['pend','Pendentes',nP,'p'],['feito','Feitos',nF,'f']].map(function(o){ return '<button type="button" role="tab" aria-selected="'+(sit===o[0])+'" data-afsit="'+o[0]+'" class="'+(sit===o[0]?'ativa':'')+'">'+(o[3]?'<i class="pt '+o[3]+'" aria-hidden="true"></i>':'')+o[1]+'<span class="n">'+o[2]+'</span></button>'; }).join('');
    stEl.querySelectorAll('[data-afsit]').forEach(function(b){ b.onclick=function(){ estado.afSit=b.dataset.afsit; afModalCorpo(); }; }); }
  var lista=base.filter(function(it){ return sit==='todos' || (sit==='feito' ? !!fe[it.chave] : !fe[it.chave]); });
  if(!lista.length){ corpo.innerHTML='<div class="af-vz">'+(sit==='pend'&&base.length?'Tudo feito '+(q?'com essa busca':'nesta aba')+' ✓':sit==='feito'&&base.length?'Nenhum ajuste feito '+(q?'com essa busca':'nesta aba')+' ainda.':q?'Ninguém com essa busca.':aba==='agora'?'Nenhum ajuste para fazer agora.':'Nenhum ajuste nesta aba.')+'</div>'; return; }
  var por={}, ord=[]; lista.forEach(function(it){ if(!por[it.hora]){ por[it.hora]=[]; ord.push(it.hora); } por[it.hora].push(it); });
  var topo=corpo.scrollTop; estado.afRenderN=(estado.afRenderN||0)+1;
  corpo.innerHTML=ord.map(function(h){ var g=por[h], s=afSituacao(g[0], r.data), muda=g.some(function(it){ return it.tipo==='muda'; }), so=g.every(function(it){ return it.tipo!=='muda'; }), pend=g.filter(function(it){ return !fe[it.chave]; });
    var sub=afResumoGrupo(g, h);
    return '<div class="af-gh'+(s==='agora'?' agora':'')+'"><div class="hh"><b>'+h+'</b><span>'+esc(sub)+'</span>'+(s==='agora'?'<span class="ag">agora</span>':'')+'</div>'+
      (pend.length>1?'<button class="btn sec peq" type="button" data-aftodos="'+h+'">Marcar todos como feito</button>':'')+'</div>'+
      afDirsHtml(g, h, fe)+
      g.map(function(it){ var f=fe[it.chave], sa=afSituacao(it, r.data);
        var mud=it.tipo==='confere' ? '<span class="t">Primeiro login · sem fila definida</span><span class="c">'+afChip('')+' → '+afChip(it.para)+'</span>' :
          it.tipo==='entrada' ? '<span class="t">Início do turno · já entra na fila</span><span class="c">'+afChip(it.de)+' → '+afChip(it.para)+'</span>' :
          '<span class="t">'+(it.almoco? 'Troca no almoço · volta às '+esc(it.volta||'') : 'Troca de fila · pausa às '+it.pausa)+'</span><span class="c">'+afChip(it.de)+' → '+afChip(it.para)+'</span>';
        var ac=f ? '<span class="fe" title="Feito por '+esc(f.nome||'')+(f.quando?' em '+esc(dBr(f.quando.slice(0,10)))+' às '+esc(f.quando.slice(11,16)):' às '+esc(f.em||''))+'">✓ '+esc(nomeCurto2(f.nome||''))+' · '+(f.quando && f.quando.slice(0,10)!==hojeLocal() ? esc(dBr(f.quando.slice(0,10)).slice(0,5))+' ' : '')+esc(f.quando?f.quando.slice(11,16):(f.em||''))+'</span><button class="lk" type="button" data-afdes="'+esc(it.chave)+'">desfazer</button>' : '<button class="btn '+(sa==='agora'?'':'sec ')+'peq" type="button" data-afok="'+esc(it.chave)+'">Feito</button>';
        return '<div class="af-row'+(sa==='agora'&&!f?' agora':'')+(f?' feito':'')+'"><div class="af-pes2" title="'+esc(it.nome)+'">'+avatarHtml(it.email, it.nome, '')+'<div class="af-id"><b>'+esc(nomeCurto2(it.nome))+(it.coord?'<span class="co"> · '+esc(it.coord)+'</span>':'')+'</b><span class="af-em"><span class="tx" title="'+esc(it.email)+'">'+AF_MAIL+esc(it.email)+'</span><button type="button" class="af-cp" data-afcopiar="'+esc(it.email)+'" title="Copiar e-mail" aria-label="Copiar e-mail de '+esc(it.nome)+'">'+AF_COPIA+'</button></span></div></div><div class="af-mud2">'+mud+'</div><div class="af-ok2">'+ac+'</div></div>'; }).join(''); }).join('');
  corpo.scrollTop=topo; if(typeof atualizarAvatares==='function') atualizarAvatares();

  corpo.querySelectorAll('[data-aftodos]').forEach(function(b){ b.onclick=function(){ marcar(por[b.dataset.aftodos].filter(function(it){ return !fe[it.chave]; }).map(function(it){ return it.chave; }), true, b); }; });

  corpo.querySelectorAll('[data-afdok]').forEach(function(b){ b.onclick=function(){ var d=(estado.afDirs||[])[+b.dataset.afdok]; if(!d || !d.pend.length) return; marcar(d.pend.map(function(it){ return it.chave; }), true, b); }; });
}
/* cartões de direção de um horário (Chat → 0800, 0800 → Chat e outras), só quando o horário tem mais de uma pessoa */
function afDirsHtml(g, h, fe){ if(!estado.afDirs || estado.afDirsH!==estado.afRenderN){ estado.afDirs=[]; estado.afDirsH=estado.afRenderN; }
  if(g.length<2) return '';
  var por={}, ord=[]; g.forEach(function(it){ var k=(it.de||'')+'>'+(it.para||''); if(!por[k]){ por[k]=[]; ord.push(k); } por[k].push(it); });
  var peso=function(k){ return k==='chat>0800'?0 : k==='0800>chat'?1 : 2; }; ord.sort(function(a,b){ return peso(a)-peso(b) || por[b].length-por[a].length; });
  return '<div class="af-dirs">'+ord.map(function(k){ var its=por[k], pend=its.filter(function(it){ return !fe[it.chave]; }), i=estado.afDirs.length, n=its.length, np=pend.length;
    estado.afDirs.push({ pend:pend });
    return '<div class="af-dir'+(np?'':' ok')+'"><div class="tt"><span class="c">'+afChip(its[0].de||'')+'<span class="seta">→</span>'+afChip(its[0].para||'')+'</span><small><b>'+n+' pessoa'+(n>1?'s':'')+'</b>'+(np===n?' · todas pendentes':np?' · '+np+' pendente'+(np>1?'s':''):' · tudo feito ✓')+'</small></div>'+
      (np?'<div class="bt"><button class="btn sec peq" type="button" data-afdcp="'+i+'" title="Copia os e-mails de quem ainda está pendente, separados por vírgula e espaço">'+AF_COPIA+' Copiar '+np+' e-mail'+(np>1?'s':'')+'</button><button class="btn peq" type="button" data-afdok="'+i+'">Marcar '+(np>1?np+' como feitos':'como feito')+'</button></div>':'')+'</div>'; }).join('')+'</div>'; }
/* mantém barra, modal e faixa com os mesmos dados */
function afSincronizar(r){ if(estado.afDia && estado.afDia.data===r.data) estado.afDia=r; if(r.data===hojeLocal()){ estado.afHoje=r; estado.afHojeEm=Date.now(); } if(estado.afModalR && estado.afModalR.data===r.data) estado.afModalR=r; afDesenhar(); afVigiar(true); }
/* faixa de aviso: toda a gestão; "Ver ajustes" abre o modal ali mesmo */

/* atualização: modal aberto a cada 15 s; barra e faixa a cada 1 min */

<script>
/* contadores: agora (rosa), pendentes (âmbar), feitos (verde), total (roxo) + barra "X de Y feitos" */
function afProgHtml(c){ if(!c.total) return ''; var p=Math.round(c.feitos*100/c.total); return '<div class="af-prog'+(c.feitos===c.total?' cheio':'')+'"><span class="tr"><i style="width:'+p+'%"></i></span><span>'+(c.feitos===c.total?'Todos os '+c.total+' ajustes feitos':c.feitos+' de '+c.total+' feitos')+'</span></div>'; }
function afContHtml(c){ var pend=c.total-c.feitos; return '<div class="af-cont">'+(c.agoraPend?'<span class="agora">'+c.agoraPend+' agora</span>':'')+(pend?'<span class="pend">'+pend+' pendente'+(pend>1?'s':'')+'</span>':'')+'<span class="'+(c.feitos?'ok':'')+'">'+c.feitos+' feito'+(c.feitos===1?'':'s')+'</span><span class="tot">'+c.total+' no dia</span></div>'; }
afCardHtml=(function(orig){ return function(r){ var h=orig(r), c=afContar(r); if(!c.total) return h;
  return h.replace(/<div class="af-cont">[\s\S]*?<\/div>(?=<button)/, afContHtml(c)).replace(/<\/div>$/, afProgHtml(c)+'</div>'); }; })(afCardHtml);
afModalCorpo=(function(orig){ return function(){ orig(); var r=estado.afModalR, cab=document.querySelector('#afModal .af-mcab'); if(!r || !cab) return; var c=afContar(r), el=cab.querySelector('.af-prog');
  var html=afProgHtml(c); if(el) el.outerHTML=html; else cab.insertAdjacentHTML('beforeend', html); }; })(afModalCorpo);
</script>

<script>
/* cartão "Agentes escalados por atuação": Chat e 0800 x Assíncrono, logo abaixo dos números do dia */
var VDAT_HIB='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>';
var VDAT_ASS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H5.17L4 17.17V4z"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="13" y2="12"/></svg>';
function vdatHtml(r){
  var hib=0, ass=0, pad=0;
  (r.itens||[]).forEach(function(x){ if(x.perfil!=='AGENTE' || x.sit!=='T') return; var bl=x.blocos||[];
    if(bl.some(function(b){ return b[0]==='0800'||b[0]==='chat'; })) hib++; else if(bl.some(function(b){ return b[0]==='ass'; })) ass++; else pad++; });
  var tot=hib+ass+pad; if(!tot) return '';
  var pc=function(n){ return Math.round(n*100/tot)+'%'; }, pes=function(n){ return n===1?'pessoa':'pessoas'; };
  var bloco=function(cls, ic, tit, sub, n){ return '<div class="vdat-b '+cls+'"><span class="ic">'+ic+'</span><span class="tx"><b>'+tit+'</b><small>'+sub+'</small></span><span class="num"><strong>'+n+'</strong><span>'+pes(n)+' · '+pc(n)+'</span></span></div>'; };
  return '<div class="vdat" id="vdAtuacao"><div class="vdat-cab"><h2>Agentes Escalados por Atuação</h2><p>'+tot+' agentes trabalham neste dia</p></div>'+
    '<div class="vdat-g">'+bloco('hib', VDAT_HIB, 'Chat e 0800', 'Atendimento na Twilio', hib)+bloco('ass', VDAT_ASS, 'Assíncrono', 'Atendimento por tickets', ass)+'</div>'+
    '<div class="vdat-bar" aria-hidden="true">'+(hib?'<i class="hib" style="width:'+(hib*100/tot)+'%"></i>':'')+(ass?'<i class="ass" style="width:'+(ass*100/tot)+'%"></i>':'')+(pad?'<i class="pad" style="width:'+(pad*100/tot)+'%"></i>':'')+'</div>'+
    (pad?'<p class="vdat-nota">'+pad+' '+pes(pad)+' ainda sem atuação definida na escala deste dia.</p>':'')+'</div>';
}
(function(){ var _dvd=desenharVisaoDia; desenharVisaoDia=function(r){ var x=_dvd.apply(this, arguments);
  try{ var dados=r||estado.vdUlt, n=gc().querySelector(':scope > .numeros'), velho=$('vdAtuacao'); if(velho) velho.remove();
    if(dados && n){ var h=vdatHtml(dados); if(h) n.insertAdjacentHTML('afterend', h); } }catch(e){ if(window.console) console.warn('atuação do dia', e); }
  return x; }; })();
</script>

<script>
var VDF_IC={
  fol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>',
  fer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>',
  sem:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  ges:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
  fora:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" y1="11" x2="23" y2="11"/></svg>'
};
/* afastamentos do mês (para a data de volta), buscados uma vez por mês */
function vdfAfast(mes){ estado.vdfAf=estado.vdfAf||{}; if(estado.vdfAf[mes]) return Promise.resolve(estado.vdfAf[mes]);
  return chamar('apiAfastamentos', estado.token, mes).then(function(r){ estado.vdfAf[mes]=(r&&r.itens)||[]; return estado.vdfAf[mes]; }).catch(function(){ return []; }); }
function vdfMontar(sec, r, afs){
  var por={}; (r.itens||[]).forEach(function(x){ por[x.email]=x; });
  if(!sec.__vdfEmails){ var ds=sec.querySelectorAll('.vd-fora > div'); if(ds.length!==3) return false;
    sec.__vdfEmails=[].map.call(ds, function(div){ return [].map.call(div.querySelectorAll('[data-ag]'), function(b){ return b.dataset.ag; }); }); }
  var grupos=sec.__vdfEmails.map(function(l){ return l.map(function(e){ return por[e]; }).filter(Boolean); });
  var data=r.data, af={}; (afs||[]).forEach(function(a){ if(a.inicio<=data && a.fim>=data) af[a.email]=a; });
  var dias=function(a,b){ return Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/864e5); };
  var nome2=function(n){ var p=String(n||'').split(' '); return p[0]+(p.length>1?' '+p[p.length-1]:''); };
  var sub=function(x){ return esc([x.coord, x.cargo].filter(Boolean).join(' · ')); };
  var linha=function(x, extra){ return '<button type="button" class="vdf-r" data-ag="'+esc(x.email)+'" title="'+esc(x.nome)+'">'+avatarHtml(x.email, x.nome, '')+'<span class="nm"><b>'+esc(nome2(x.nome))+'</b><small>'+sub(x)+'</small></span><span class="ex">'+(extra||'')+'</span></button>'; };
  var porNome=function(a,b){ return a.nome.localeCompare(b.nome,'pt-BR'); };
  var fer=grupos[1].map(function(x){ return {x:x, a:af[x.email]}; }).sort(function(p,q){ var fp=p.a?p.a.fim:'9999', fq=q.a?q.a.fim:'9999'; return fp<fq?-1:fp>fq?1:porNome(p.x,q.x); });
  var lFer=fer.map(function(o){ var a=o.a, extra='';
    if(a){ var volta=somaDia(a.fim,1), f=dias(data, volta); extra='<span class="vdf-tp '+(a.tipo==='FERIAS'?'f':'l')+'">'+(a.tipo==='FERIAS'?'Férias':'Licença')+'</span><span class="vdf-volta">volta '+dBr(volta).slice(0,5)+'<small>'+(f<=1?'amanhã':'em '+f+' dias')+'</small></span>'; }
    return linha(o.x, extra); });
  var cartao=function(cls, ic, tit, subt, linhas, vazio){ return '<div class="vdf-c '+cls+'"><div class="vdf-hd"><span class="ic">'+ic+'</span><span class="tx"><b>'+tit+'</b><small>'+subt+'</small></span><span class="n">'+linhas.length+'</span></div><div class="vdf-l">'+(linhas.length?linhas.join(''):'<div class="vdf-vz">'+vazio+'</div>')+'</div></div>'; };
  var tot=grupos[0].length+grupos[1].length+grupos[2].length;
  sec.innerHTML='<div class="vdf-cab"><div><h2 class="vdg-h"><span class="ic">'+VDF_IC.fora+'</span>Fora neste dia</h2><p>Quem não trabalha nesta data</p></div><span class="tot">'+tot+(tot===1?' pessoa':' pessoas')+'</span></div><div class="vdf-g">'+
    cartao('fol', VDF_IC.fol, 'De folga', 'Dia de descanso na escala', grupos[0].slice().sort(porNome).map(function(x){ return linha(x); }), 'Ninguém de folga.')+
    cartao('fer', VDF_IC.fer, 'Férias ou licença', 'Ordem: quem volta primeiro', lFer, 'Ninguém de férias ou licença.')+
    cartao('sem', VDF_IC.sem, 'Sem escala publicada', 'Ainda sem escala neste mês', grupos[2].slice().sort(porNome).map(function(x){ return linha(x, '<span class="vdf-sem">sem escala</span>'); }), 'Todos têm escala publicada.')+'</div>';
  sec.setAttribute('data-vdf','1');
  sec.querySelectorAll('[data-ag]').forEach(function(b){ b.onclick=function(){ modalAgente(b.dataset.ag); }; });
  if(typeof atualizarAvatares==='function') atualizarAvatares();
  return true;
}
(function(){ var _dvd=desenharVisaoDia; desenharVisaoDia=function(r){ var x=_dvd.apply(this, arguments);
  try{ var dados=r||estado.vdUlt; if(!dados) return x;
    var secs=[].slice.call(gc().querySelectorAll(':scope > .vd-sec'));
    var ges=secs.filter(function(s){ var h=s.querySelector('h2'); return h && /^Gestão trabalhando/.test(h.textContent); })[0];
    if(ges){ var h=ges.querySelector('h2'); if(h && !h.classList.contains('vdg-h')){ h.classList.add('vdg-h'); h.insertAdjacentHTML('afterbegin','<span class="ic">'+VDF_IC.ges+'</span>'); } }
    var fora=secs.filter(function(s){ var h=s.querySelector('h2'); return h && /^Fora neste dia/.test(h.textContent) && s.querySelector('.vd-fora'); })[0];
    if(fora){ var mes=String(dados.data||'').slice(0,7), cache=(estado.vdfAf||{})[mes];
      vdfMontar(fora, dados, cache||[]);
      if(!cache) vdfAfast(mes).then(function(afs){ if(document.body.contains(fora) && fora.__vdfEmails) vdfMontar(fora, dados, afs); });
    }
  }catch(e){ if(window.console) console.warn('fora neste dia', e); }
  return x; }; })();
</script>

<script>
/* ===================== Assíncrono por área resolvedora ===================== */
var AA_COR={'N1':'#3D7BE0','N2':'#4F3F91','N3':'#A51E5B','Customer Atendimento':'#1E9E58','Reclame Aqui':'#E07A2D','Port_out':'#0E8A8A'};
var AA_EXTRA=['#C2185B','#00838F','#6D4C41','#5E35B1'];
function aaCor(a, lista){ if(!a) return '#C98A00'; if(AA_COR[a]) return AA_COR[a]; var i=(lista||[]).indexOf(a); return AA_EXTRA[(i<0?0:i)%AA_EXTRA.length]; }
var AA_IC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H5.17L4 17.17V4z"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="13" y2="12"/></svg>';
/* agentes do assíncrono no dia (mesma regra do cartão: só blocos de assíncrono) */
function aaPessoas(r){ return (r&&r.itens||[]).filter(function(x){ if(x.perfil!=='AGENTE'||x.sit!=='T') return false; var bl=x.blocos||[]; return !bl.some(function(b){ return b[0]==='0800'||b[0]==='chat'; }) && bl.some(function(b){ return b[0]==='ass'; }); }); }
function aaCarregar(data){ estado.aaCache=estado.aaCache||{}; if(estado.aaCache[data]) return Promise.resolve(estado.aaCache[data]);
  return chamar('apiAreasAssinc', estado.token, data).then(function(x){ estado.aaCache[data]=x; return x; }); }
function aaContar(pessoas, info){ var c={}, sem=0; (info.areas||[]).forEach(function(a){ c[a]=0; }); pessoas.forEach(function(p){ var a=(info.atual||{})[p.email]||''; if(a && c[a]!==undefined) c[a]++; else if(a){ c[a]=(c[a]||0)+1; } else sem++; }); return {c:c, sem:sem}; }
function aaChipsHtml(pessoas, info, mostrarZeros){ var k=aaContar(pessoas, info), lista=info.areas||[];
  var h=lista.filter(function(a){ return mostrarZeros || k.c[a]; }).map(function(a){ return '<span class="aa-chip"><i style="background:'+aaCor(a,lista)+'"></i>'+esc(a)+' <b>'+k.c[a]+'</b></span>'; }).join('');
  if(k.sem) h+='<span class="aa-chip sem"><i style="background:#C98A00"></i>Sem área <b>'+k.sem+'</b></span>';
  return h||'<span class="aa-vz">Ninguém no assíncrono neste dia.</span>'; }
/* faixa "Assíncrono por área" no cartão da Visão do dia */
function aaFaixa(r){ var card=$('vdAtuacao'); if(!card||!r) return; var pessoas=aaPessoas(r); var velho=$('vdatAreas'); if(velho) velho.remove(); if(!pessoas.length) return;
  card.insertAdjacentHTML('beforeend','<div class="vdat-ar" id="vdatAreas"><div class="rot"><span>Assíncrono por área resolvedora</span><button type="button" data-aa-abrir>Ver e definir ›</button></div><div class="aa-chips"><span class="aa-vz">Carregando as áreas…</span></div></div>');
  $('vdatAreas').querySelector('[data-aa-abrir]').onclick=function(){ aaModal(r); };
  aaCarregar(r.data).then(function(info){ var f=$('vdatAreas'); if(!f||estado.vdUlt!==r) return; var k=aaContar(pessoas, info);
    f.querySelector('.aa-chips').innerHTML = (k.sem===pessoas.length) ? '<span class="aa-chip sem"><i style="background:#C98A00"></i>Nenhuma área definida ainda <b>'+pessoas.length+'</b></span>' : aaChipsHtml(pessoas, info, false); })
  .catch(function(){ var f=$('vdatAreas'); if(f) f.querySelector('.aa-chips').innerHTML='<span class="aa-vz">Não foi possível carregar as áreas agora.</span>'; }); }
/* modal: pessoas do assíncrono por coordenação, com a área de cada uma */
function aaModal(r){ var pessoas=aaPessoas(r); if(!pessoas.length) return;
  var w=abrirModal('<div id="aaModal"><div class="aa-vz2">Carregando…</div></div>', true); w.querySelector('.modal').classList.add('aa-m');
  var nome2=function(n){ var p=String(n||'').split(' '); return p[0]+(p.length>1?' '+p[p.length-1]:''); }, q='';
  aaCarregar(r.data).then(function(info){
    var lista=info.areas||[], pode=!!info.podeEditar;
    var opts=function(sel, rotVazio){ return '<option value=""'+(sel?'':' selected')+'>'+rotVazio+'</option>'+lista.map(function(a){ return '<option value="'+esc(a)+'"'+(a===sel?' selected':'')+'>'+esc(a)+'</option>'; }).join(''); };
    var coords={}; pessoas.forEach(function(p){ var c=p.coord||'Sem coordenação'; (coords[c]=coords[c]||[]).push(p); });
    var ordem=Object.keys(coords).sort(function(a,b){ return a.localeCompare(b,'pt-BR'); });
    $('aaModal').innerHTML='<div class="aa-top"><span class="ic">'+AA_IC+'</span><div><h3>Assíncrono · '+esc(dataLonga(r.data))+'</h3><small>'+pessoas.length+' pessoas escaladas no assíncrono neste dia · área resolvedora dos tickets</small></div></div>'+
      (pode?'<div class="aa-aviso ok">✓ As áreas definidas aqui valem deste dia em diante, até alguém mudar. Os dias anteriores não mudam.</div>':'<div class="aa-aviso ro">Este dia já passou: as áreas ficam só para consulta.</div>')+
      '<div class="aa-res aa-chips" id="aaRes"></div>'+
      '<div class="aa-ctrl"><input id="aaQ" type="text" placeholder="Buscar pessoa" autocomplete="off"></div>'+
      '<div class="aa-corpo" id="aaCorpo">'+ordem.map(function(c){ var g=coords[c].slice().sort(function(a,b){ return a.nome.localeCompare(b.nome,'pt-BR'); });
        return '<div class="aa-g" data-coord="'+esc(c)+'"><div class="aa-gh"><div class="t"><b>'+esc(c)+'</b><span>'+g.length+(g.length===1?' pessoa':' pessoas')+'</span></div>'+
          (pode?'<div class="todos">Definir todos como <select data-aa-todos="'+esc(c)+'" aria-label="Definir todos de '+esc(c)+' como">'+'<option value="__">Escolher…</option><option value="">Sem área</option>'+lista.map(function(a){ return '<option value="'+esc(a)+'">'+esc(a)+'</option>'; }).join('')+'</select></div>':'')+'</div>'+
          g.map(function(p){ var a=(info.atual||{})[p.email]||'';
            return '<div class="aa-row'+(a?'':' sem-area')+'" data-email="'+esc(p.email)+'" data-nome="'+esc(semAcentoMin(p.nome+' '+p.email))+'">'+avatarHtml(p.email, p.nome, '')+'<div class="nm"><b title="'+esc(p.nome)+'">'+esc(nomeCurto2(p.nome))+'</b>'+'<span class="em"><span class="tx" title="'+esc(p.email)+'">'+AF_MAIL+esc(p.email)+'</span><button type="button" class="af-cp" data-afcopiar="'+esc(p.email)+'" title="Copiar e-mail" aria-label="Copiar e-mail de '+esc(p.nome)+'">'+AF_COPIA+'</button></span>'+'<small>'+esc(p.i)+' às '+esc(p.f)+'</small></div>'+
              '<div class="sel" style="--c:'+aaCor(a,lista)+'"><i style="background:'+aaCor(a,lista)+'"></i><select data-aa="'+esc(p.email)+'" aria-label="Área de '+esc(p.nome)+'"'+(pode?'':' disabled')+'>'+opts(a,'Sem área')+'</select></div><span class="aa-ok" aria-hidden="true">✓</span></div>'; }).join('')+'</div>'; }).join('')+'</div>'+
      '<div class="aa-rod"><span>'+(pode?'Cada escolha é salva automaticamente para toda a gestão.':'Somente consulta.')+'</span><button class="btn sec" data-fechar>Fechar</button></div>';
    var res=function(){ $('aaRes').innerHTML=aaChipsHtml(pessoas, info, true); };
    res(); if(typeof atualizarAvatares==='function') atualizarAvatares();
    var M=$('aaModal');
    M.querySelectorAll('.aa-row .av, .aa-row .nm b').forEach(function(el){ el.onclick=function(){ modalAgente(el.closest('.aa-row').dataset.email); }; });
    $('aaQ').oninput=function(){ q=semAcentoMin(this.value); M.querySelectorAll('.aa-g').forEach(function(g){ var vis=0; g.querySelectorAll('.aa-row').forEach(function(rw){ var ok=!q||rw.dataset.nome.indexOf(q)>=0; rw.style.display=ok?'':'none'; if(ok) vis++; }); g.style.display=vis?'':'none'; }); };
    var pintar=function(email){ var rw=M.querySelector('.aa-row[data-email="'+email+'"]'); if(!rw) return; var a=(info.atual||{})[email]||''; rw.classList.toggle('sem-area', !a); rw.querySelector('.sel i').style.background=aaCor(a,lista); rw.querySelector('.sel').style.setProperty('--c', aaCor(a,lista)); var s=rw.querySelector('select[data-aa]'); if(s.value!==a){ s.value=a; if(window.listaSuspensaAtualizar) listaSuspensaAtualizar(s); } };
    var salvar=function(emails, area, sels){ info.atual=info.atual||{}; var ant={}; emails.forEach(function(e){ ant[e]=info.atual[e]||''; info.atual[e]=area; pintar(e); }); estado.aaCache[r.data]=info; res(); aaFaixa(estado.vdUlt);
      return chamar('apiAreaAssincDefinir', estado.token, r.data, emails, area).then(function(x){ info.atual=x.atual||info.atual; estado.aaCache[r.data]=info; Object.keys(estado.aaCache).forEach(function(d){ if(d>r.data) delete estado.aaCache[d]; });
        emails.forEach(function(e){ pintar(e); var ok=M.querySelector('.aa-row[data-email="'+e+'"] .aa-ok'); if(ok){ ok.classList.add('on'); setTimeout(function(){ ok.classList.remove('on'); }, 1600); } });
        res(); aaFaixa(estado.vdUlt); })
      .catch(function(e){ emails.forEach(function(em){ info.atual[em]=ant[em]; pintar(em); }); res(); aaFaixa(estado.vdUlt); falhaGeral(e); })
      .then(function(){ sels.forEach(function(s){ if(window.listaSuspensaAtualizar) listaSuspensaAtualizar(s); }); }); };
    if(pode){
      M.querySelectorAll('select[data-aa]').forEach(function(s){ s.addEventListener('change', function(){ salvar([s.dataset.aa], s.value, [s]); }); });
      M.querySelectorAll('select[data-aa-todos]').forEach(function(s){ s.addEventListener('change', function(){ if(s.value==='__') return; var area=s.value, g=s.closest('.aa-g');
        var emails=[].map.call(g.querySelectorAll('.aa-row'), function(rw){ return rw.dataset.email; }).filter(function(e){ return ((info.atual||{})[e]||'')!==area; });
        var volta=function(){ s.value='__'; if(window.listaSuspensaAtualizar) listaSuspensaAtualizar(s); };
        if(!emails.length){ volta(); return; }
        salvar(emails, area, [s].concat([].slice.call(g.querySelectorAll('select[data-aa]')))).then(volta); }); });
    }
  }).catch(function(e){ var m=$('aaModal'); if(m) m.innerHTML='<div class="aa-vz2">Não foi possível carregar as áreas agora.</div><div class="aa-rod"><span></span><button class="btn sec" data-fechar>Fechar</button></div>'; });
}
/* liga o bloco "Assíncrono" do cartão ao modal e mostra a faixa por área */
(function(){ var _dvd=desenharVisaoDia; desenharVisaoDia=function(r){ var x=_dvd.apply(this, arguments);
  try{ var dados=r||estado.vdUlt, b=document.querySelector('#vdAtuacao .vdat-b.ass');
    if(b && dados && aaPessoas(dados).length){ b.classList.add('vdat-btn'); b.setAttribute('role','button'); b.setAttribute('tabindex','0'); b.setAttribute('title','Ver e definir as áreas resolvedoras');
      var tx=b.querySelector('.tx'); if(tx && !tx.querySelector('.vdat-cta')) tx.insertAdjacentHTML('beforeend','<span class="vdat-cta">Ver e definir áreas ›</span>');
      b.onclick=function(){ aaModal(dados); }; b.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); aaModal(dados); } };
      aaFaixa(dados); }
  }catch(e){ if(window.console) console.warn('áreas do assíncrono', e); }
  return x; }; })();
</script>

<style>

<script>
/* ===================== Twilio por canal: filas do chat por pessoa (vale deste dia em diante) ===================== */
var FC_COR={'Pós-pagamento':'#3D7BE0','Reclame Aqui':'#E07A2D','Retenção':'#1E9E58'};
function fcCor(v, lista){ if(!v) return '#C98A00'; if(FC_COR[v]) return FC_COR[v]; var i=(lista||[]).indexOf(v); return AA_EXTRA[(i<0?0:i)%AA_EXTRA.length]; }
var FC_IC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>';
function fcPessoas(r){ return (r&&r.itens||[]).filter(function(x){ return x.perfil==='AGENTE' && x.sit==='T' && (x.blocos||[]).some(function(b){ return b[0]==='0800'||b[0]==='chat'; }); }); }
function fcCarregar(data){ estado.fcCache=estado.fcCache||{}; if(estado.fcCache[data]) return Promise.resolve(estado.fcCache[data]);
  return chamar('apiFilasChat', estado.token, data).then(function(x){ estado.fcCache[data]=x; return x; }); }
function fcSlotPadrao(r){ if(r.data===hojeLocal()){ var d=new Date(), m=Math.floor((d.getHours()*60+d.getMinutes())/30)*30; return Math.max(VD_I, Math.min(VD_F-30, m)); } return 10*60; }
/* quem está em cada canal num minuto do dia */
function fcMomento(r, info, t){ var o={o800:0, chat:0, filas:{}, sem:0, alm:0}; (info.areas||[]).forEach(function(f){ o.filas[f]=0; });
  fcPessoas(r).forEach(function(x){ var bl=(x.blocos||[]).slice().sort(function(a,b){ return aMin(a[1])-aMin(b[1]); }); if(!bl.length) return;
    var b=bl.filter(function(k){ return aMin(k[1])<=t && t<aMin(k[2]); })[0];
    if(b){ if(b[0]==='0800') o.o800++; else if(b[0]==='chat'){ o.chat++; var f=(info.atual||{})[x.email]||''; if(f && o.filas[f]!==undefined) o.filas[f]++; else if(f) o.filas[f]=(o.filas[f]||0)+1; else o.sem++; } }
    else if(t>=aMin(bl[0][1]) && t<Math.max.apply(null, bl.map(function(k){ return aMin(k[2]); }))) o.alm++; });
  return o; }
function fcChips(o, lista){ var h=lista.map(function(f){ return '<span class="aa-chip"><i style="background:'+fcCor(f,lista)+'"></i>'+esc(f)+' <b>'+(o.filas[f]||0)+'</b></span>'; }).join('');
  if(o.sem) h+='<span class="aa-chip sem"><i style="background:#C98A00"></i>Sem fila <b>'+o.sem+'</b></span>'; return h; }
/* contêiner com as duas faixas lado a lado: Twilio (esquerda) e Assíncrono (direita) */
function fcContainer(){ var card=$('vdAtuacao'); if(!card) return null; var c=$('vdatFaixas');
  if(!c){ card.insertAdjacentHTML('beforeend','<div class="vdat-fx" id="vdatFaixas"><div class="fx-esq"></div><div class="fx-dir"></div></div>'); c=$('vdatFaixas'); }
  var a=$('vdatAreas'); if(a && a.parentNode!==c.querySelector('.fx-dir')) c.querySelector('.fx-dir').appendChild(a);
  return c; }
function fcFaixa(r){ if(!r || !fcPessoas(r).length) return; var c=fcContainer(); if(!c) return; var esq=c.querySelector('.fx-esq');
  if(estado.fcSlotData!==r.data){ estado.fcSlotData=r.data; estado.fcSlotManual=false; estado.fcSlot=fcSlotPadrao(r); }
  var opts=''; for(var m=VD_I; m<VD_F; m+=30) opts+='<option value="'+m+'"'+(m===estado.fcSlot?' selected':'')+'>'+hm(m)+'</option>';
  esq.innerHTML='<div class="vdat-tw" id="vdatTw"><div class="rot"><span>Twilio por canal</span><span class="dir"><select id="fcHora" aria-label="Horário">'+opts+'</select><button type="button" class="lk" data-fc-abrir>Ver e definir ›</button></span></div><div id="fcCorpo"><span class="aa-vz">Carregando as filas…</span></div></div>';
  $('fcHora').onchange=function(){ estado.fcSlot=+this.value; estado.fcSlotManual=true; fcPintar(r); };
  esq.querySelector('[data-fc-abrir]').onclick=function(){ fcModal(r); };
  fcPintar(r); }
function fcPintar(r){ var corpo=$('fcCorpo'); if(!corpo) return;
  fcCarregar(r.data).then(function(info){ var cc=$('fcCorpo'); if(!cc || estado.vdUlt!==r) return; var t=estado.fcSlot, o=fcMomento(r, info, t), lista=info.areas||[];
    var hoje=r.data===hojeLocal() && !estado.fcSlotManual;
    cc.innerHTML='<div class="fc-g"><div class="fc-o800"><b>'+o.o800+'</b><span>no 0800</span></div><div class="fc-chat"><div class="t"><b>'+o.chat+'</b> no chat · por fila</div><div class="aa-chips">'+fcChips(o, lista)+'</div></div></div>'+
      '<div class="fc-rod">'+(hoje?'Agora, '+hm(t)+' às '+hm(t+30):'Das '+hm(t)+' às '+hm(t+30))+' · '+(o.o800+o.chat)+' atendendo na Twilio'+(o.alm?' · '+o.alm+' no almoço':'')+'</div>'; })
  .catch(function(){ var cc=$('fcCorpo'); if(cc) cc.innerHTML='<span class="aa-vz">Não foi possível carregar as filas agora.</span>'; }); }
/* modal: pessoas de Chat e 0800 por coordenação, com a fila do chat de cada uma */
function fcResumoDia(x){ var bl=(x.blocos||[]).filter(function(b){ return b[0]==='0800'||b[0]==='chat'; }).slice().sort(function(a,b){ return aMin(a[1])-aMin(b[1]); }), m=[];
  bl.forEach(function(b){ var u=m[m.length-1]; if(u && u[0]===b[0] && aMin(b[1])-aMin(u[2])<=60) u[2]=b[2]; else m.push(b.slice()); });
  return m.map(function(b){ return (b[0]==='0800'?'0800':'Chat')+' '+b[1]+'–'+b[2]; }).join(' · '); }
function fcModal(r){ var pessoas=fcPessoas(r); if(!pessoas.length) return;
  var w=abrirModal('<div id="fcModal"><div class="aa-vz2">Carregando…</div></div>', true); w.querySelector('.modal').classList.add('aa-m');
  var nome2=function(n){ var p=String(n||'').split(' '); return p[0]+(p.length>1?' '+p[p.length-1]:''); }, q='';
  fcCarregar(r.data).then(function(info){

function vdAgoraSlot(){ var dn=new Date(), m=dn.getHours()*60+dn.getMinutes(); return (m>=VD_I && m<VD_F) ? Math.floor((m-VD_I)/VD_SLOT) : -1; }

</style>
<script>
/* ===================== Controle de Logados · v105 ===================== */
var LG_MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function lgMesRot(m){ return LG_MESES[+m.slice(5,7)-1]+' de '+m.slice(0,4); }
function lgSeg(n){ var f=estado.lg, b=function(v, rot, extra){ return '<button type="button" role="tab" data-lgv="'+v+'" class="'+(f.vista===v?'ativa':'')+'" aria-selected="'+(f.vista===v)+'">'+rot+(extra||'')+'</button>'; };
  return '<div class="tr-seg" role="tablist">'+b('lista','Lista', n!=null?'<span class="n">'+n+'</span>':'')+b('painel','Dashboard do Dia')+b('mes','Dashboard do Mês')+'</div>'; }
function lgBindSeg(c){ c.querySelectorAll('[data-lgv]').forEach(function(b){ b.onclick=function(){ var v=b.dataset.lgv; if(v===estado.lg.vista) return; var era=estado.lg.vista; estado.lg.vista=v; if(v==='mes'){ lgMesTela(); } else if(era==='mes'){ if(estado.lgR && estado.lgR.data===estado.lg.data) lgDesenhar(); else telaLogados(); } else lgDesenhar(); }; }); }
/* registro: quem e quando, sempre em duas linhas */
function lgRegistro(x){ var r=estado.lgR, L=function(cls,a,b){ return '<span class="lg-reg '+cls+'"><b>'+a+'</b><small>'+b+'</small></span>'; };
  var quando=function(){ return (x.emData && x.emData!==r.data? 'em '+esc(dBr(x.emData).slice(0,5))+' às ' : 'às ')+esc(x.em||'—'); };
  if(!x.auto){ if(x.origem==='PLANILHA') return L('','Importado','da planilha de controle');
    if(x.origem==='AGENTE') return L('ok','✓ Pelo agente', quando());
    return L('', esc(lgNomeReg(x.por)||'Gestão'), quando()); }
  if(x.st==='FALTA') return L('mal','Falta automática','não registrou até '+esc(x.prazo||'o prazo'));
  if(x.st==='AGUARDANDO') return L('ag','Aguardando registro','prazo até '+esc(x.prazo||'—'));
  if(x.st==='FOLGA') return L('','Pela escala','folga do dia');
  if(x.st==='FERIAS'||x.st==='LICENCA') return L('','Pela aba','Férias e Licenças');
  if(x.st==='SEM_REGISTRO') return L('','Sem registro','preencher aqui');
  return L('','Sem escala','neste dia'); }
/* linha da lista: nome, e-mail com copiar, colunas centralizadas */
function lgLinha(x){ var r=estado.lgR, auto=lgAuto(x, r), trab=lgEscalado(x), lista=r.manuais.slice();
  if(!x.auto && lista.indexOf(x.st)<0) lista.unshift(x.st);
  var opts='<option value=""'+(x.auto?' selected':'')+'>'+esc(lgRot(auto.st))+'</option>'+lista.filter(function(s){ return s!==auto.st || (!x.auto && x.st===s); }).map(function(s){ return '<option value="'+s+'"'+(!x.auto&&x.st===s?' selected':'')+'>'+esc(lgRot(s))+'</option>'; }).join('');
  var em='<span class="lg-em"><span class="tx" title="'+esc(x.email)+'">'+AF_MAIL+esc(x.email)+'</span><span class="af-cp" role="button" tabindex="0" data-afcopiar="'+esc(x.email)+'" title="Copiar e-mail" aria-label="Copiar e-mail de '+esc(x.nome)+'">'+AF_COPIA+'</span></span>';
  return '<tr class="'+(trab?'':'fora')+(lgEhPend(x)?' pend':'')+'" data-em="'+esc(x.email)+'"><td><div class="lg-ag" data-ag="'+esc(x.email)+'" title="'+esc(x.nome)+'">'+avatarHtml(x.email, x.nome, '')+'<span class="t"><b>'+esc(nomeCurto2(x.nome))+'</b>'+em+'</span></div></td>'+
    '<td class="cg">'+esc(x.cargo||'—')+'</td><td class="cg">'+esc(x.squad||'—')+'</td><td class="lg-hr cg">'+(trab&&x.i?esc(x.i)+' – '+esc(x.f):'—')+'</td><td class="lg-hr cg">'+(trab&&x.a?esc(x.a)+' – '+esc(hm(aMin(x.a)+60)):'—')+'</td>'+
    '<td class="lg-st lgs" data-st="'+x.st+'"><select data-lgst="'+esc(x.email)+'" aria-label="Situação de '+esc(x.nome)+'">'+opts+'</select></td><td class="cg">'+lgRegistro(x)+'</td></tr>'; }
/* tabela por coordenação, ordenável (abre pelo maior absenteísmo) */
function lgTabCoord(linhas, tot, comAguardando){ var o=estado.lg.ord||(estado.lg.ord={k:'abs',d:-1});
  var cols=[['g','Coordenação'],['n','Escalados'],['PRESENTE','Presentes']].concat(comAguardando?[['AGUARDANDO','Aguardando']]:[]).concat([['FALTA','Faltas'],['ATESTADO','Atestados'],['COMPENSA','Compensa / Day Off'],['pres','% Presença'],['abs','Absenteísmo']]);
  var val=function(l,k){ return k==='g'?l.g : k==='n'?l.n : k==='pres'?l.pres : k==='abs'?l.abs : (l.c[k]||0); };
  var ord=linhas.slice().sort(function(a,b){ var va=val(a,o.k), vb=val(b,o.k); var r=(typeof va==='string')? va.localeCompare(vb,'pt-BR') : va-vb; return r*o.d || a.g.localeCompare(b.g,'pt-BR'); });
  var cel=function(n, s){ return n? '<span class="lg-chip lgs" data-st="'+s+'" style="padding:2px 9px">'+n+'</span>' : '<span style="color:var(--c4)">—</span>'; };
  var th=cols.map(function(c){ var at=o.k===c[0]; return '<th class="'+(at?'ord':'')+'" aria-sort="'+(at?(o.d>0?'ascending':'descending'):'none')+'"><button type="button" data-ord="'+c[0]+'">'+c[1]+'<span class="ar">'+(at?(o.d>0?'▲':'▼'):'▼')+'</span></button></th>'; }).join('');
  var tr=ord.map(function(l){ return '<tr><td>'+lgCoordCel(l.g, true)+'</td><td>'+l.n+'</td><td>'+cel(l.c.PRESENTE,'PRESENTE')+'</td>'+(comAguardando?'<td>'+cel(l.c.AGUARDANDO,'AGUARDANDO')+'</td>':'')+'<td>'+cel(l.c.FALTA,'FALTA')+'</td><td>'+cel(l.c.ATESTADO,'ATESTADO')+'</td><td>'+cel(l.c.COMPENSA,'COMPENSA')+'</td><td><div class="lg-pct"><span class="tr"><i style="width:'+l.pres+'%;background:'+LG_COR.PRESENTE+'"></i></span><b>'+lgFmt(l.pres)+'</b></div></td><td class="'+(l.abs>=10?'abs-alto':'')+'"><b>'+lgFmt(l.abs)+'</b></td></tr>'; }).join('');
  var c=tot.c, pt=lgPct(c.PRESENTE||0,tot.n), at=lgPct(lgAbsN(c),tot.n);
  return '<table class="lg-tc"><thead><tr>'+th+'</tr></thead><tbody>'+tr+'<tr class="tot"><td>Total</td><td>'+tot.n+'</td><td>'+(c.PRESENTE||0)+'</td>'+(comAguardando?'<td>'+(c.AGUARDANDO||0)+'</td>':'')+'<td>'+(c.FALTA||0)+'</td><td>'+(c.ATESTADO||0)+'</td><td>'+(c.COMPENSA||0)+'</td><td>'+lgFmt(pt)+'</td><td>'+lgFmt(at)+'</td></tr></tbody></table>'; }
function lgBindOrd(el, redesenhar){ el.querySelectorAll('[data-ord]').forEach(function(b){ b.onclick=function(){ var k=b.dataset.ord, o=estado.lg.ord||{k:'abs',d:-1}; if(o.k===k) o.d=-o.d; else { o.k=k; o.d=(k==='g')?1:-1; } estado.lg.ord=o; redesenhar(); }; }); }
function lgBarras(linhas){ return linhas.slice().sort(function(a,b){ return b.abs-a.abs || lgAbsN(b.c)-lgAbsN(a.c) || a.g.localeCompare(b.g,'pt-BR'); }).map(function(l){ var pf=lgPct(l.c.FALTA||0,l.n), pa=lgPct(l.c.ATESTADO||0,l.n), pc=lgPct(l.c.COMPENSA||0,l.n); return '<div class="lg-bar"><span class="nm">'+lgCoordCel(l.g, false)+'</span><span class="tr"><i style="width:'+pf+'%;background:'+LG_COR.FALTA+'" title="Faltas Injustificadas: '+(l.c.FALTA||0)+'"></i><i style="width:'+pa+'%;background:'+LG_COR.ATESTADO+'" title="Atestados: '+(l.c.ATESTADO||0)+'"></i><i style="width:'+pc+'%;background:'+LG_COR.COMPENSA+'" title="Compensa / Day Off: '+(l.c.COMPENSA||0)+'"></i></span><span class="vl"><b>'+lgFmt(l.abs)+'</b>'+lgAbsN(l.c)+' de '+l.n+'</span></div>'; }).join('') || '<div class="lg-vz">Sem escalados.</div>'; }
var LG_LEG2='<div class="lgd-leg2"><span><i style="background:'+LG_COR.FALTA+'"></i>Falta Injustificada</span><span><i style="background:'+LG_COR.ATESTADO+'"></i>Atestado</span><span><i style="background:'+LG_COR.COMPENSA+'"></i>Compensa / Day Off</span></div>';
/* Dashboard do Dia */
function lgPainel(){
  var r=estado.lgR, el=$('lgCorpo'), esc_=r.itens.filter(lgEscalado), cnt=lgContar(esc_), tot=esc_.length;
  var leg=['PRESENTE','AGUARDANDO','FALTA','ATESTADO','COMPENSA','MEDIDA','DESLIGADO','MOVIMENTACAO','SEM_REGISTRO'].filter(function(s){ return cnt[s]; }).map(function(s){ return '<div class="l lgs" data-st="'+s+'"><i></i><em>'+esc(lgRot(s))+'</em><b>'+cnt[s]+'</b><span>'+lgFmt(lgPct(cnt[s],tot))+'</span></div>'; }).join('') || '<div class="lg-vz" style="padding:10px">Ninguém escalado neste dia.</div>';
  var gs={}; esc_.forEach(function(x){ (gs[x.coord]=gs[x.coord]||[]).push(x); });
  var linhas=Object.keys(gs).map(function(g){ var c=lgContar(gs[g]), n=gs[g].length; return {g:g, n:n, c:c, abs:lgPct(lgAbsN(c), n), pres:lgPct(c.PRESENTE, n)}; });
  var col=function(s, tit){ var l=esc_.filter(function(x){ return x.st===s; }).sort(function(a,b){ return a.coord.localeCompare(b.coord,'pt-BR') || a.nome.localeCompare(b.nome,'pt-BR'); });
    return '<div class="col lgs" data-st="'+s+'"><div class="hd"><span>'+tit+'</span><span class="n">'+l.length+'</span></div><div class="ls">'+(l.length? l.map(function(x){ return '<div class="it" data-ag="'+esc(x.email)+'" title="'+esc(x.nome)+'">'+avatarHtml(x.email, x.nome, '')+'<span><b>'+esc(nomeCurto2(x.nome))+'</b><small>'+esc(x.coord)+(x.i?' · '+esc(x.i)+' – '+esc(x.f):'')+'</small></span></div>'; }).join('') : '<div class="vz">Ninguém.</div>')+'</div></div>'; };
  var desenhaTab=function(){ $('lgTabCoord').innerHTML=lgTabCoord(linhas, {n:tot, c:cnt}, true); lgBindOrd($('lgTabCoord'), desenhaTab); };
  el.innerHTML='<div class="lg-dash">'+
    '<div class="lg-card"><h3>Distribuição do Dia</h3><p class="sub">Situação dos '+tot+' agentes escalados</p><div class="lg-donut">'+lgDonut(cnt, tot)+'<div class="lgd-leg">'+leg+'</div></div></div>'+
    '<div class="lg-card"><h3>Absenteísmo por Coordenação</h3><p class="sub">Faltas Injustificadas, Atestados e Compensa / Day Off sobre os escalados de cada coordenação, do maior para o menor</p><div class="lg-bars">'+lgBarras(linhas)+'</div>'+LG_LEG2+'</div>'+
    '<div class="lg-card lg-full"><h3>Presença por Coordenação</h3><p class="sub">Clique no nome de uma coluna para ordenar; clique de novo para inverter a ordem</p><div style="overflow:auto" id="lgTabCoord"></div></div>'+
    '<div class="lg-card lg-full"><h3>Ausências do Dia</h3><p class="sub">Quem não está trabalhando hoje, por motivo. Clique no nome para ver os detalhes.</p><div class="lg-aus">'+col('FALTA','Faltas Injustificadas')+col('ATESTADO','Atestados')+col('COMPENSA','Compensa / Day Off')+'</div></div></div>';
  desenhaTab();
  el.querySelectorAll('.lg-aus .it').forEach(function(a){ a.onclick=function(){ modalAgente(a.dataset.ag); }; });
}
/* ligar o seletor de visões depois de desenhar o dia */
(function(){ var _d=lgDesenhar; lgDesenhar=function(){ var x=_d.apply(this, arguments); var c=gc(); if(c && estado.lg && estado.lg.vista!=='mes') lgBindSeg(c); return x; }; })();
/* ---------- Dashboard do Mês ---------- */
function lgMesTela(){ var f=estado.lg, c=gc(); if(!c) return; f.mes=f.mes||(f.data||hojeLocal()).slice(0,7);
  var y=window.scrollY;
  c.innerHTML='<div class="cab"><div><h1>Controle de Logados</h1><p>Visão do mês inteiro, até hoje: presença, faltas e atestados por dia, por coordenação e por pessoa.</p></div></div>'+
    '<div class="lg-top"><div class="lg-mnav" id="lgMnav"></div>'+lgSeg(null)+'</div><div id="lgMesCorpo"><div class="carregando"><div class="giro"></div> Carregando '+esc(lgMesRot(f.mes))+'…</div></div>';
  lgBindSeg(c); lgMesNav(null);
  var m=f.mes, cache=(estado.lgMes||{})[m];
  if(cache && (m!==hojeLocal().slice(0,7) || Date.now()-cache.t<60000)){ lgMesDesenhar(cache.r); window.scrollTo(0,y); return; }
  chamar('apiControleLogadosMes', estado.token, m).then(function(r){ estado.lgMes=estado.lgMes||{}; estado.lgMes[m]={r:r, t:Date.now()}; if(estado.sub!=='logados' || estado.lg.vista!=='mes' || estado.lg.mes!==m) return; lgMesNav(r.meses); lgMesDesenhar(r); })
  .catch(function(e){ var b=$('lgMesCorpo'); if(b) b.innerHTML='<div class="lg-vazio-mes">Não foi possível carregar o mês.</div>'; falhaGeral(e); }); }
function lgMesNav(meses){ var f=estado.lg, el=$('lgMnav'); if(!el) return; meses=meses||((estado.lgMes||{})[f.mes]||{r:{}}).r.meses||[f.mes];
  if(meses.indexOf(f.mes)<0) meses=meses.concat([f.mes]); var i=meses.indexOf(f.mes);
  el.innerHTML='<button type="button" class="nav" id="lgMAnt" aria-label="Mês anterior"'+(i<=0?' disabled':'')+'>‹</button><select id="lgMSel" aria-label="Mês">'+meses.slice().reverse().map(function(m){ return '<option value="'+m+'"'+(m===f.mes?' selected':'')+'>'+esc(lgMesRot(m))+'</option>'; }).join('')+'</select><button type="button" class="nav" id="lgMProx" aria-label="Próximo mês"'+(i>=meses.length-1?' disabled':'')+'>›</button>';
  $('lgMAnt').onclick=function(){ if(i>0){ f.mes=meses[i-1]; lgMesTela(); } };
  $('lgMProx').onclick=function(){ if(i<meses.length-1){ f.mes=meses[i+1]; lgMesTela(); } };
  $('lgMSel').onchange=function(){ f.mes=this.value; lgMesTela(); }; }
function lgMesDesenhar(r){ var el=$('lgMesCorpo'); if(!el) return; estado.lgMesR=r;
  var tot={n:0,c:{}}; r.pessoas.forEach(function(p){ tot.n+=p.esc; Object.keys(p.c).forEach(function(k){ tot.c[k]=(tot.c[k]||0)+p.c[k]; }); });
  if(!tot.n){ el.innerHTML='<div class="lg-vazio-mes">Sem dados de presença em '+esc(lgMesRot(r.mes))+'.</div>'; return; }
  var c=tot.c, abs=lgAbsN(c), ag=r.pessoas.filter(function(p){ return p.esc>0; }).length, ndias=r.dias.filter(function(d){ return !d.futuro && d.esc>0; }).length;
  var k=function(rot, val, sub, cor, cls){ return '<div class="lg-k '+(cls||'')+'" style="--k:'+cor+'"><small>'+rot+'</small><b>'+val+'</b><span>'+sub+'</span></div>'; };
  var kp='<div class="lg-kpis">'+k('Escalas no Mês', tot.n, ag+' agentes · '+ndias+' dias com escala', '#4F3F91','destaque')+k('Presenças', c.PRESENTE||0, lgFmt(lgPct(c.PRESENTE||0,tot.n))+' das escalas', LG_COR.PRESENTE)+
    k('Faltas Injustificadas', c.FALTA||0, lgFmt(lgPct(c.FALTA||0,tot.n))+' das escalas', LG_COR.FALTA)+k('Atestados', c.ATESTADO||0, lgFmt(lgPct(c.ATESTADO||0,tot.n))+' das escalas', LG_COR.ATESTADO)+
    k('Compensa / Day Off', c.COMPENSA||0, lgFmt(lgPct(c.COMPENSA||0,tot.n))+' das escalas', LG_COR.COMPENSA)+k('Absenteísmo', lgFmt(lgPct(abs,tot.n)), abs+' de '+tot.n+' escalas', '#A61B1B')+'</div>';
  var gs={}; r.pessoas.forEach(function(p){ if(!p.esc) return; var g=gs[p.coord]||(gs[p.coord]={g:p.coord,n:0,c:{}}); g.n+=p.esc; Object.keys(p.c).forEach(function(k2){ g.c[k2]=(g.c[k2]||0)+p.c[k2]; }); });
  var linhas=Object.keys(gs).map(function(k2){ var l=gs[k2]; l.abs=lgPct(lgAbsN(l.c), l.n); l.pres=lgPct(l.c.PRESENTE||0, l.n); return l; });
  var rank=r.pessoas.filter(function(p){ return lgAbsN(p.c)>0; }).map(function(p){ var a=lgAbsN(p.c); return {p:p, a:a, pct:lgPct(a,p.esc)}; });
  el.innerHTML=kp+'<div class="lg-dash">'+
    '<div class="lg-card lg-full"><h3>Absenteísmo por Dia</h3><p class="sub">Faltas Injustificadas, Atestados e Compensa / Day Off sobre os escalados de cada dia de '+esc(lgMesRot(r.mes))+'. Passe o mouse (ou toque) em um dia para ver o detalhe.</p><div class="lg-dias">'+lgGrafDias(r)+'</div>'+LG_LEG2+'</div>'+
    '<div class="lg-card lg-full"><h3>Absenteísmo por Coordenação</h3><p class="sub">No mês, considerando todas as escalas de cada coordenação, do maior para o menor</p><div class="lg-bars">'+lgBarras(linhas)+'</div>'+LG_LEG2+'</div>'+
    '<div class="lg-card lg-full"><h3>Presença por Coordenação</h3><p class="sub">Totais do mês; clique no nome de uma coluna para ordenar e clique de novo para inverter</p><div style="overflow:auto" id="lgTabCoordM"></div></div>'+
    '<div class="lg-card lg-full"><h3>Quem Mais Faltou no Mês</h3><p class="sub">Agentes com Faltas Injustificadas, Atestados ou Compensa / Day Off; clique no nome de uma coluna para ordenar e clique de novo para inverter</p><div style="overflow:auto" id="lgRankM"></div></div></div>';
  var desenhaTab=function(){ $('lgTabCoordM').innerHTML=lgTabCoord(linhas, tot, false); lgBindOrd($('lgTabCoordM'), desenhaTab); }; desenhaTab();
  var desenhaRank=function(){ var box=$('lgRankM'); if(!box) return; box.innerHTML=lgRankTabela(rank);
    box.querySelectorAll('.lg-rank tr.cl').forEach(function(t){ t.onclick=function(){ modalAgente(t.dataset.ag); }; });
    box.querySelectorAll('[data-ordr]').forEach(function(b){ b.onclick=function(){ var k=b.dataset.ordr, o=estado.lg.ordRank||{k:'a',d:-1}; if(o.k===k) o.d=-o.d; else { o.k=k; o.d=(k==='nome'||k==='coord')?1:-1; } estado.lg.ordRank=o; desenhaRank(); }; });
    var bm=$('lgRankMais'); if(bm) bm.onclick=function(){ estado.lg.rankTodos=!estado.lg.rankTodos; desenhaRank(); };
    if(typeof atualizarAvatares==='function') atualizarAvatares(); };
  desenhaRank();
  if(typeof atualizarAvatares==='function') atualizarAvatares(); }
/* Quem Mais Faltou no Mês: colunas ordenáveis, como em Presença por Coordenação */
function lgRankTabela(rank){
  if(!rank.length) return '<div class="lg-vz">Nenhuma falta ou atestado no mês.</div>';
  var o=estado.lg.ordRank||(estado.lg.ordRank={k:'a',d:-1});
  var v=function(x,k){ return k==='nome'?nomeCurto2(x.p.nome) : k==='coord'?String(x.p.coord||'') : k==='esc'?x.p.esc : k==='a'?x.a : k==='pct'?x.pct : (x.p.c[k]||0); };

<style>
/* ===================== telas: servidor ocupado → tenta de novo e, se não der, avisa na hora ===================== */
.carregando .tent{display:block;font-size:12.5px;color:var(--c4);margin-top:6px;font-weight:600}

<script>
/* ===================== telas: servidor ocupado → tenta de novo e, se não der, avisa na hora ===================== */
(function(){
  var TELAS=/^api(VisaoMes|VisaoDia|Mes|MinhaEscala|MinhaJornada|TrocasV2|ControleLogados|ControleLogadosMes|Pessoas|Afastamentos|Feriados|Logs|Acessos|Inicio|AgenteDia)$/;
  var PASSAGEIRO=/too many|simultaneous|invoked too many|Rate Limit|Lock timeout|lock for too long|timed? ?out|tempo limite|Tempo de execução|exceeded maximum|NetworkError|HTTP 0|Failed to fetch|network|Service|Serviço|Internal|indispon|unavailable|Exception: *$|^Error: *$|^$/i;
  var alvoCarregando=function(){ var a=[typeof gc==='function'?gc():null, $('conteudo')]; for(var i=0;i<a.length;i++){ var el=a[i]; if(el){ var c=el.querySelector(':scope > .carregando'); if(c) return c; } } return null; };

    function vai(){ return _ch.apply(null, args).catch(function(e){ var m=String((e&&e.message)||e||'');
      if(tent<3 && PASSAGEIRO.test(m) && !/SESSAO_INVALIDA|SEM_PERMISSAO/.test(m)){ var c=alvoCarregando(); tent++;
        if(c){ var t=c.querySelector('.tent'); if(!t){ c.insertAdjacentHTML('beforeend','<span class="tent"></span>'); t=c.querySelector('.tent'); } t.textContent='O servidor está ocupado. Tentando de novo ('+tent+' de 3)…'; }
        return new Promise(function(ok){ setTimeout(ok, ESPERA[tent-1]); }).then(vai); }
      throw e; }); }
    return vai(); };
  /* se a tela falhou, troca o "Carregando…" por um aviso com "Tentar de novo" (em vez de esperar 25 s) */
  var IC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
  var _fg=falhaGeral; falhaGeral=function(e){ var r=_fg.apply(this, arguments); try{ var m=String((e&&e.message)||e||''); if(/SESSAO_INVALIDA/.test(m)) return r; var c=alvoCarregando(); if(!c) return r; var el=c.parentNode;
      var txt=/too many|simultaneous|invoked too many|Rate Limit|Lock/i.test(m)? 'Muitas pessoas estão usando o painel neste momento e o servidor não respondeu. Espere alguns segundos e tente de novo.'

      var bt=el.querySelector('[data-tentar2]'); if(bt) bt.onclick=function(){ if(estado.aba==='gestao' && typeof telaGestao==='function') telaGestao(); else telaJornada(); };
    }catch(x){} return r; };
})();
