<style>
/* ===================== Camada de design (UI31 v2): movimento, cor e profundidade ===================== */
:root{--ds-ease:cubic-bezier(.23,1,.32,1);--ds-mola:cubic-bezier(.34,1.56,.64,1);--ds-rosa:#D80073;--ds-roxo:#4F3F91;--ds-lilas:#9B7BFF}

@keyframes dsDeriva2{to{transform:translate3d(-12vw,14vh,0) scale(.9)}}

.topo{transition:box-shadow .3s var(--ds-ease),background-color .3s var(--ds-ease)}
.topo:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--ds-rosa),var(--ds-lilas),#FF5FA2,var(--ds-roxo),var(--ds-rosa));background-size:300% 100%;animation:dsFluxo 9s linear infinite;opacity:.9;pointer-events:none}

.abas{position:relative}

.ds-balanca{animation:dsBalanca .9s var(--ds-ease)}
@keyframes dsBalanca{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-14deg)}45%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}}

@keyframes dsGrad{0%,100%{background-position:0% 30%}50%{background-position:100% 70%}}

.ds-rv{opacity:0;transform:translate3d(0,20px,0) scale(.985);transition:opacity .65s var(--ds-ease),transform .75s var(--ds-ease);transition-delay:var(--ds-d,0ms)}
.ds-rv.ds-in{opacity:1;transform:none}

.ds-dia.ds-in{opacity:1;transform:none}
@media (hover:hover) and (pointer:fine){ .cal .dia{transition:transform .25s var(--ds-ease),box-shadow .25s var(--ds-ease)} .cal .dia:hover{transform:translateY(-3px);box-shadow:0 12px 24px -16px rgba(79,63,145,.55);z-index:1;position:relative} }
