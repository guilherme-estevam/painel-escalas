</style>
<script>
/* ===================== tema ===================== */
var ICO_LUA='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
var ICO_SOL='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function temaAtual(){ try{ return localStorage.getItem('esc_tema')||'claro'; }catch(e){ return 'claro'; } }
function aplicarTema(t){ document.documentElement.setAttribute('data-tema', t); var b=document.getElementById('bTema'); if(b){ b.innerHTML = t==='escuro'?ICO_SOL:ICO_LUA; b.title = t==='escuro'?'Usar modo claro':'Usar modo escuro'; b.setAttribute('aria-label', b.title); } }
aplicarTema(temaAtual());
(function(){ var eu=document.querySelector('.topo .eu'); if(eu && !document.getElementById('bTema')){ var b=document.createElement('button'); b.id='bTema'; b.className='tema'; eu.parentNode.insertBefore(b, eu.parentNode.firstChild===eu?eu:eu); b.onclick=function(){ var t=temaAtual()==='escuro'?'claro':'escuro'; try{ localStorage.setItem('esc_tema', t); }catch(e){} aplicarTema(t); }; aplicarTema(temaAtual()); } })();

/* ===================== feriados não trabalhados ===================== */
function feriadosOffLista_(){ return estado.ferOff || []; }
var _montarAppUI4 = montarApp;
montarApp = function(){ _montarAppUI4(); chamar('apiFeriadosOff', estado.token).then(function(l){ var mudou = JSON.stringify(l||[])!==JSON.stringify(estado.ferOff||[]); estado.ferOff=l||[]; if(mudou && estado.ferOff.length) trocarAba(estado.aba); }).catch(function(){}); if(ehGestao() && !estado.nomes) chamar('apiNomes', estado.token).then(function(n){ estado.nomes=n; }).catch(function(){}); };
FRENTES.ges=['Gestão','fges'];
var _desenharAtuacaoUI4 = desenharAtuacao;
desenharAtuacao = function(el, d, p, e, af, atu, hoje){ _desenharAtuacaoUI4(el, d, p, e, af, atu, hoje); if(p && p.perfil==='GESTAO' && el){ var h=el.querySelector('.atu-cab h2'), s=el.querySelector('.atu-cab p'); if(h) h.textContent='Seus horários'; if(s) s.textContent='Entrada, almoço e saída de cada dia.'; el.querySelectorAll('.leg-fr,.atu-tot,.atu-nota').forEach(function(x){ x.remove(); }); } };

/* ===================== navegação da gestão ===================== */
desenharSubnav = function(){
  var el=$('subnav'); if(!el) return;
  var subs=[['plan','Planejamento'],['dia','Visão Operacional'],['trocas','Trocas'],['afast','Férias e Licenças'],['fer','Feriados'],['logs','Histórico de Alterações']];
  subs.push(['acessos','Histórico de Acessos']) // toda a gestão (o Planejamento continua só para o WFM);
  if(estado.sub==='hc') estado.sub='plan';
  el.innerHTML=subs.map(function(s){ return '<button data-sub="'+s[0]+'" class="'+(estado.sub===s[0]?'ativa':'')+'">'+s[1]+'</button>'; }).join('');
  el.querySelectorAll('[data-sub]').forEach(function(b){ b.onclick=function(){ var s=b.getAttribute('data-sub'); if(s===estado.sub) return;
    if(estado.sub==='plan' && temEdicoes() && !confirm('Há alterações não salvas na grade. Sair mesmo assim?')) return;
    if(estado.sub==='plan') estado.edits={}; estado.sub=s; telaGestao(); }; });
};
var _abrirSubUI2 = abrirSub;
abrirSub = function(){ if(estado.sub==='dia'){ $('conteudo').className=''; telaVisaoDia(); return; } _abrirSubUI2(); };
LEITURAS_TELA.apiVisaoDia=1;

/* ===================== visão do dia ===================== */
var SEM_LONGO=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
var MESES_LONGO=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dataLonga(d){ var x=new Date(d+'T12:00:00Z'); return SEM_LONGO[x.getUTCDay()]+', '+d.slice(8)+' de '+MESES_LONGO[x.getUTCMonth()]+' de '+d.slice(0,4); }
function somaDia(d, n){ var x=new Date(d+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); }
function telaVisaoDia(){
  if(!estado.vd) estado.vd={data: (hojeLocal().slice(0,7)===estado.mes ? hojeLocal() : estado.mes+'-01'), rasc:false, coord:'', frente:'', q:''};
  gCarregando();
  chamar('apiVisaoDia', estado.token, estado.vd.data, estado.vd.rasc).then(desenharVisaoDia).catch(falhaGeral);
}
function desenharVisaoDia(r){
  var vd=estado.vd, it=r.itens, I=7*60, F=21*60, SLOT=30, N=(F-I)/SLOT;
  var ag=it.filter(function(x){ return x.perfil==='AGENTE'; }), ge=it.filter(function(x){ return x.perfil==='GESTAO'; });
  var agT=ag.filter(function(x){ return x.sit==='T'; }), geT=ge.filter(function(x){ return x.sit==='T'; });
  var folga=it.filter(function(x){ return x.sit==='F'; }), afs=it.filter(function(x){ return x.sit==='FERIAS'||x.sit==='LICENCA'; }), sem=it.filter(function(x){ return x.sit==='V'||x.sit==='SEM'; });
  // cobertura por meia hora
  var cob=[]; for(var k=0;k<N;k++) cob.push({'0800':0,chat:0,ass:0,pad:0,alm:0,ges:0});
  function marca(ini, fim, chave){ for(var k=0;k<N;k++){ var a=I+k*SLOT, b=a+SLOT; if(ini<b && fim>a) cob[k][chave]++; } }
  agT.forEach(function(x){ if(x.blocos) x.blocos.forEach(function(b){ marca(aMin(b[1])+1, aMin(b[2])-1, b[0]); }); else marca(aMin(x.i)+1, aMin(x.f)-1, 'pad'); if(x.a) marca(aMin(x.a)+1, aMin(x.a)+59, 'alm'); });
  geT.forEach(function(x){ marca(aMin(x.i)+1, aMin(x.f)-1, 'ges'); });
  var max=Math.max(1, Math.max.apply(null, cob.map(function(c){ return c['0800']+c.chat+c.ass+c.pad+c.alm; })));
  var pico0800=null, picoChat=null; cob.forEach(function(c,k){ if(!pico0800||c['0800']>pico0800.v) pico0800={v:c['0800'],k:k}; if(!picoChat||c.chat>picoChat.v) picoChat={v:c.chat,k:k}; });
  var hhmm=function(k){ return hm(I+k*SLOT); };
  var graf=cob.map(function(c,k){ var tt=hhmm(k)+'–'+hm(I+(k+1)*SLOT)+': 0800 '+c['0800']+' · chat '+c.chat+' · assíncrono '+c.ass+(c.pad?' · sem atuação '+c.pad:'')+' · almoço '+c.alm+' · gestão '+c.ges;
    var seg=function(cl,v){ return v?'<i class="'+cl+'" style="height:'+(v/max*100)+'%"></i>':''; };
    return '<div class="vd-col" title="'+tt+'">'+seg('f0800',c['0800'])+seg('fchat',c.chat)+seg('fass',c.ass)+seg('pad',c.pad)+seg('alm',c.alm)+'</div>'; }).join('');
  var eixo=cob.map(function(c,k){ return '<span>'+(k%4===0?(I/60+k/2)+'h':'')+'</span>'; }).join('');
  var gesL=cob.map(function(c,k){ return '<span class="'+(c.ges?'on':'')+'" title="'+hhmm(k)+': '+c.ges+' da gestão">'+(c.ges||'')+'</span>'; }).join('');
  // filtros
  var coords=uniq(it.map(function(x){ return x.coord; }));
  var passa=function(x){ if(vd.coord && x.coord!==vd.coord) return false; if(vd.q && (x.nome+' '+x.email).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').indexOf(vd.q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''))<0) return false; if(vd.frente && x.perfil==='AGENTE' && !(x.blocos||[]).some(function(b){ return b[0]===vd.frente; })) return false; return true; };
  var pct=function(v){ return ((v-I)/(F-I)*100).toFixed(2)+'%'; }; var regua=''; for(var hh=8; hh<=20; hh+=2) regua+='<span style="left:'+pct(hh*60)+'">'+hh+'h</span>';
  var linha=function(x){ var xb=[x.i, x.a, x.f], barra = x.blocos ? barraDia(xb.concat([x.blocos]), null, false) : '<div class="barra">'+'<span class="seg pad" style="left:'+pct(aMin(x.i))+';width:calc('+pct(aMin(x.f))+' - '+pct(aMin(x.i))+')">Atuação a Definir</span></div>';

  var nomes=sel.slice(0,3).map(function(e){ return primeiro(estado.plan.porEmail[e].nome); }).join(', ')+(n>3?' e mais '+(n-3):'');
  el.innerHTML='<div class="barra-sel"><div class="quem-sel"><b class="qtd" style="color:#fff">'+n+' selecionado'+(n>1?'s':'')+'</b><br>'+esc(nomes)+'<br><button class="link" id="sNada">Limpar seleção</button></div><div class="lote">'+
    '<button id="sPadrao"><b>Definir folgas fixas</b><span>2 dias da semana de folga no mês inteiro.</span></button>'+
    '<button id="sCopiar"><b>Copiar dias de alguém</b><span>Usa a escala de outro colaborador como modelo.</span></button>'+
    '<button id="sHorario"><b>Ajustar horário</b><span>Somar horas na saída ou definir um horário.</span></button>'+
    '<button id="sPub"><b>Publicar selecionados</b><span>Publica só esses, se as regras estiverem ok.</span></button>'+
    '<button id="sLimpar"><b>Esvaziar o mês</b><span>Apaga os dias no rascunho para recomeçar.</span></button></div></div>';
  $('sPadrao').onclick=modalPadrao; $('sHorario').onclick=function(){ modalHorarioLote(selecionados()); }; $('sCopiar').onclick=modalCopiarDias; $('sPub').onclick=modalPublicarSel;
  $('sLimpar').onclick=function(){ if(!confirm('Esvaziar o mês de '+n+' colaborador(es)? Fica só no rascunho até você salvar.')) return; selecionados().forEach(function(e){ setDias(e,'.'.repeat(estado.plan.dias)); }); desenharGrade(); atualizarTopo(); };
  $('sNada').onclick=function(){ estado.sel={}; desenharGrade(); };
};
function modalCopiarDias(){
  var d=estado.plan, alvo=selecionados(), st={origem:''};
  var w=abrirModal('<div class="mcab"><span class="ic imp">'+ICONE_CAL+'</span><div><h3>Copiar dias de trabalho</h3><p>Os '+alvo.length+' selecionado(s) recebem os mesmos dias de trabalho e folga do colaborador escolhido. Os horários não são copiados.</p></div></div>'+
    '<div class="campo"><label for="cpBusca">Copiar de</label><div class="busca-col"><input id="cpBusca" type="text" placeholder="Digite o nome" autocomplete="off"><div class="sug est oculto" id="cpSug"></div></div></div><div id="cpPrev"></div>'+
    '<div class="acoes"><button class="btn sec" data-fechar>Cancelar</button><button class="btn roxo" id="cpOk" disabled>Copiar para o rascunho</button></div>');
  var q=function(s){ return w.querySelector(s); };
  q('#cpBusca').oninput=function(){ var t=this.value.toLowerCase(), l=d.pessoas.filter(function(p){ return t && alvo.indexOf(p.email)<0 && p.nome.toLowerCase().indexOf(t)>=0; }).slice(0,8);
    q('#cpSug').innerHTML=l.map(function(p){ var s=diasAtuais(p.email); return '<button type="button" data-e="'+esc(p.email)+'"><span><b>'+esc(p.nome)+'</b><br><small>'+esc(p.coord)+'</small></span><small>'+((s.match(/T/g)||[]).length)+' dias de trabalho</small></button>'; }).join('')||'<div class="vazio-mini">Ninguém encontrado.</div>';
    q('#cpSug').classList.toggle('oculto', !t); q('#cpSug').querySelectorAll('[data-e]').forEach(function(b){ b.onclick=function(){ st.origem=b.dataset.e; q('#cpBusca').value=d.porEmail[st.origem].nome; q('#cpSug').classList.add('oculto'); prev(); }; }); };
  function prev(){ var s=diasAtuais(st.origem), po=d.porEmail[st.origem];
    var fds=[]; for(var dd=1; dd<=d.dias; dd++){ var wd=wdDe(d.mes,dd); if((wd===0||wd===6)&&s.charAt(dd-1)==='T') fds.push(dd); }
    var pula=alvo.filter(function(e){ return d.porEmail[e].segSex && fds.length; });
    q('#cpPrev').innerHTML='<div class="periodo FERIAS"><div><b>'+((s.match(/T/g)||[]).length)+' dias de trabalho</b><br><span>'+((s.match(/F/g)||[]).length)+' folgas · escala de '+esc(primeiro(po.nome))+'</span></div><span>Vai para '+(alvo.length-pula.length)+' colaborador(es)</span></div>'+(pula.length?'<div class="aviso erro">'+pula.length+' trabalham só de segunda a sexta e ficam de fora, porque a escala escolhida tem fim de semana.</div>':'');
    q('#cpOk').disabled=!s.replace(/\./g,'').length; st.pula=pula; }
  q('#cpOk').onclick=function(){ var s=diasAtuais(st.origem), n=0; alvo.forEach(function(e){ if(st.pula.indexOf(e)>=0) return; setDias(e, s); n++; }); w.remove(); desenharGrade(); atualizarTopo(); toast(n+' escala(s) copiadas para o rascunho. Clique em "Salvar alterações" para gravar.'); };
}
function modalPublicarSel(){
  var d=estado.plan, sel=selecionados();
  var pend=sel.filter(function(e){ return estado.edits[e]!==undefined; });
  if(pend.length){ toast('Salve as alterações da grade antes de publicar ('+pend.length+' com mudanças não salvas).', true); return; }
  var ok=sel.filter(function(e){ var s=situacao(e); return !s.vazio && !s.erro; }), ruim=sel.filter(function(e){ return ok.indexOf(e)<0; });
  var w=abrirModal('<div class="mcab"><span class="ic imp">'+ICONE_IMP+'</span><div><h3>Publicar '+sel.length+' selecionado(s)</h3><p>Quem for publicado passa a ver a escala e recebe uma notificação com o seu nome.</p></div></div>'+
    '<div class="numeros" style="--cols:2"><div class="numero"><b>'+ok.length+'</b><span>Prontas para publicar</span></div><div class="numero'+(ruim.length?' alerta':'')+'"><b>'+ruim.length+'</b><span>Com pendência (ficam de fora)</span></div></div>'+
    (ruim.length?'<div class="lista-mini">'+ruim.map(function(e){ var s=situacao(e); return '<div><b>'+esc(d.porEmail[e].nome)+'</b>'+(s.vazio?'Sem escala':esc((s.v.erros[0]||{}).msg||''))+'</div>'; }).join('')+'</div>':'')+
    '<div class="acoes"><button class="btn sec" data-fechar>Cancelar</button><button class="btn" id="psOk"'+(ok.length?'':' disabled')+'>Publicar '+ok.length+'</button></div>');
  w.querySelector('#psOk').onclick=function(){ var bt=this; ocupado(bt,true,'Publicando…');
    chamar('apiPublicar', estado.token, d.mes, ok).then(function(r){ w.remove(); toast(((r.publicados||[]).length)+' escala(s) publicada(s)'+(r.bloqueados&&r.bloqueados.length?' · '+r.bloqueados.length+' bloqueada(s)':'')+'.', !!(r.bloqueados&&r.bloqueados.length)); estado.sel={}; carregarPlanoMantendo(); atualizarSino(); }).catch(function(e){ ocupado(bt,false,'Publicar'); falhaGeral(e); }); };
}
</script>
