<style>
/* ===================== Planejamento: Registrar Desligamento (16/11/2026) ===================== */
.dsl-bt{display:inline-flex;align-items:center;gap:7px;margin-right:auto!important;height:38px;padding:0 14px;border-radius:10px;border:1.5px solid #E7B4B4;background:transparent;color:#B3261E;font:inherit;font-size:13px;font-weight:800;cursor:pointer;transition:background-color .15s,border-color .15s}
.dsl-bt svg{width:16px;height:16px}
.dsl-bt:focus-visible{outline:2px solid #B3261E;outline-offset:2px}
@media (hover:hover) and (pointer:fine){ .dsl-bt:hover{background:#FDECEC;border-color:#B3261E} }
html[data-tema="escuro"] .dsl-bt{border-color:#6a2c2c;color:#F2A3A3}
html[data-tema="escuro"] .dsl-bt:hover{background:#2a1416}
.dsl-tag{display:inline-flex;align-items:center;gap:6px;margin-right:auto!important;padding:6px 12px;border-radius:999px;background:#FDECEC;color:#9B1C1C;font-size:12.5px;font-weight:800}
.dsl-tag i{width:8px;height:8px;border-radius:50%;background:#B3261E}
html[data-tema="escuro"] .dsl-tag{background:#2a1416;color:#F2A3A3}
.dsl-chip{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:#FDECEC;color:#9B1C1C;font-size:10.5px;font-weight:800;vertical-align:middle;white-space:nowrap}
html[data-tema="escuro"] .dsl-chip{background:#2a1416;color:#F2A3A3}
.dsl{display:flex;flex-direction:column;gap:14px}
.dsl .ic{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:#FDECEC;color:#B3261E}
.dsl .ic svg{width:24px;height:24px}
html[data-tema="escuro"] .dsl .ic{background:#2a1416;color:#F2A3A3}
.dsl h2{margin:0;font-size:19px;font-weight:800;color:var(--preto)}
.dsl .sb{margin:-6px 0 0;font-size:13.5px;line-height:1.5;color:var(--c4,#6d6679)}
.dsl label.cp{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--c4,#6d6679)}
.dsl label.cp input{height:42px;padding:0 12px;border-radius:10px;border:1.5px solid var(--c2,#E6DFEE);background:var(--campo,var(--sup,#fff));color:var(--preto);font:inherit;font-size:14px;font-weight:700;text-transform:none;letter-spacing:normal}
.dsl-prev{display:flex;flex-direction:column;gap:8px;min-height:60px}
.dsl-li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 10px;align-items:start;padding:10px 12px;border-radius:12px;border:1px solid var(--c2,#E6DFEE);background:var(--sup,#fff);font-size:13px;line-height:1.45;color:var(--preto)}
.dsl-li svg{width:17px;height:17px;margin-top:1px;color:var(--k,#B3261E)}
.dsl-li span{grid-column:2;color:var(--c4,#6d6679)}
html[data-tema="escuro"] .dsl-li{background:#1c1823;border-color:#3a3150}
.dsl-ok{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:#FFF6E5;border:1px solid #F3D7A2;color:#7A4E00;font-size:13px;line-height:1.45;cursor:pointer}
.dsl-ok input{width:18px;height:18px;margin:1px 0 0;accent-color:#B3261E;flex:none}
html[data-tema="escuro"] .dsl-ok{background:#2a2110;border-color:#5a4416;color:#f2cf8a}
.dsl-er{padding:10px 12px;border-radius:12px;background:#FDECEC;border:1px solid #F2B8B8;color:#9B1C1C;font-size:12.5px;line-height:1.45}
.dsl .ac{display:flex;justify-content:flex-end;gap:8px}
.dsl .btn.perigo{background:#B3261E!important;border-color:#B3261E!important;color:#fff!important}
.dsl .btn.perigo[disabled]{opacity:.45;cursor:not-allowed}
</style>
<script>
/* ===================== Planejamento: Registrar Desligamento (16/11/2026) =====================
   Só o WFM vê o Planejamento. No editor da pessoa (clique no nome na grade), o botão
   "Registrar Desligamento" abre a confirmação: último dia, prévia do que acontece e caixa de confirmação.
   O servidor exclui a escala depois da data, cancela trocas pendentes, bloqueia o login e registra no Histórico. */
var DSL_IC = { sair: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  troca: '<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
  cad: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  olho: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>', hist: '<path d="M3 3v5h5"/><path d="M3.050 13A9 9 0 1 0 6 5.300L3 8"/><path d="M12 7v5l4 2"/>' };
if (typeof ACOES !== 'undefined') ACOES.DESLIGAMENTO = 'Desligamento Registrado';
function dslSvg(k) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + DSL_IC[k] + '</svg>'; }
function dslBr(d) { return d ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : ''; }
function dslPessoa(email) { var p = estado.plan && estado.plan.porEmail ? estado.plan.porEmail[email] : null; return p || (estado.plan && estado.plan.pessoas ? estado.plan.pessoas.filter(function (x) { return x.email === email; })[0] : null) || { email: email, nome: email.split('@')[0] }; }
function dslModal(email) {
  var p = dslPessoa(email), tok = 0, hoje = hojeLocal();
  var w = abrirModal('<div class="dsl"><span class="ic">' + dslSvg('sair') + '</span><h2>Registrar Desligamento</h2>' +
    '<p class="sb"><b>' + esc(p.nome) + '</b> · ' + esc(email) + '</p>' +
    '<label class="cp">Último dia de trabalho<input type="date" id="dslData" value="' + hoje + '"></label>' +
    '<div class="dsl-prev" id="dslPrev"></div>' +
    '<label class="dsl-ok"><input type="checkbox" id="dslOk"><span>Confirmo o desligamento de <b>' + esc(p.nome) + '</b>. Esta ação não pode ser desfeita pelo painel.</span></label>' +
    '<div class="ac"><button class="btn sec" data-fechar>Cancelar</button><button class="btn perigo" id="dslIr" disabled>Registrar Desligamento</button></div></div>');
  var $d = w.querySelector('#dslData'), $p = w.querySelector('#dslPrev'), $ok = w.querySelector('#dslOk'), $ir = w.querySelector('#dslIr'), pronto = false;
  function botao() { $ir.disabled = !(pronto && $ok.checked); }
  function previa() {
    var t = ++tok; pronto = false; botao();
    if (!$d.value) { $p.innerHTML = '<div class="dsl-er">Escolha o último dia de trabalho.</div>'; return; }
    $p.innerHTML = '<div class="carregando" style="min-height:60px"><div class="giro"></div> Conferindo…</div>';
    chamar('apiDesligamentoPrevia', estado.token, email, $d.value).then(function (r) {
      if (t !== tok) return;
      if (r.jaDesligadoEm) { $p.innerHTML = '<div class="dsl-er">O desligamento desta pessoa já foi registrado, com último dia em ' + dslBr(r.jaDesligadoEm) + '.</div>'; return; }
      if (r.jaMovimentadoEm) { $p.innerHTML = '<div class="dsl-er">Esta pessoa já tem movimentação registrada, a partir de ' + dslBr(r.jaMovimentadoEm) + '.</div>'; return; }
      var li = function (ic, k, txt, sub) { return '<div class="dsl-li" style="--k:' + k + '">' + dslSvg(ic) + '<b>' + txt + '</b>' + (sub ? '<span>' + sub + '</span>' : '') + '</div>'; };
      $p.innerHTML = li('hist', '#1E9E58', 'Até ' + r.dataBr + ' nada muda', 'Escala, presença, aderência, tempos, trocas e Histórico continuam aparecendo.') +
        li('cal', '#B3261E', 'A escala depois de ' + r.dataBr + ' é excluída', r.diasRemovidos + ' dia(s) de trabalho saem da escala' + (r.mesesApagados.length ? ' e a escala de ' + r.mesesApagados.map(function (m) { return rotuloMes(m).toLowerCase(); }).join(', ') + ' é apagada' : '') + '.') +
        li('troca', '#B3261E', r.trocas.length ? r.trocas.length + ' troca(s) pendente(s) cancelada(s)' : 'Nenhuma troca pendente', 'Ninguém consegue pedir troca com esta pessoa daqui em diante.') +
        li('cad', '#B3261E', 'Login bloqueado', r.loginBloqueadoJa ? 'O bloqueio vale na hora e as sessões abertas são encerradas.' : 'O acesso continua até ' + r.dataBr + ' e é bloqueado no dia seguinte.') +
        li('olho', '#4F3F91', 'Sai da Visão Operacional e do Controle de Logados depois de ' + r.dataBr, 'Nos dias anteriores, continua aparecendo.');
      pronto = true; botao();
    }).catch(function (e) { if (t !== tok) return; $p.innerHTML = '<div class="dsl-er">' + esc((e && e.message) || String(e)) + '</div>'; });
  }
  $d.onchange = previa; $d.oninput = previa; $ok.onchange = botao; previa();
  $ir.onclick = function () {
    if (!(pronto && $ok.checked)) return; $ir.disabled = true; $ir.textContent = 'Registrando…';
    chamar('apiDesligar', estado.token, email, $d.value).then(function (r) {
      document.querySelectorAll('#modais .modal-fundo').forEach(function (f) { f.remove(); });
      if (typeof toast === 'function') toast('Desligamento de ' + r.nome + ' registrado (último dia ' + r.dataBr + ').');
      try { if (typeof telaGestao === 'function') telaGestao(); } catch (e) { }
    }).catch(function (e) { $ir.textContent = 'Registrar Desligamento'; botao(); $p.insertAdjacentHTML('afterbegin', '<div class="dsl-er">' + esc((e && e.message) || String(e)) + '</div>'); });
  };
}
/* botão no rodapé do editor da pessoa e selo na grade */
(function () {
  var atual = '';
  if (typeof abrirEditor === 'function') { var _ae = abrirEditor; abrirEditor = function (email) { atual = email; return _ae.apply(this, arguments); }; }
  function pintar() {
    if (!estado.superadmin) return;
    var rod = document.querySelector('.modal.editor .ed-rod .acoes');
    if (rod && atual && !rod.querySelector('.dsl-bt,.dsl-tag,.mov-tag')) {
      var p = dslPessoa(atual);
      if (p.movimentadoEm) { /* a movimentação (UI59) mostra o selo dela */ }
      else if (p.desligadoEm) rod.insertAdjacentHTML('afterbegin', '<span class="dsl-tag"><i></i>Desligado · último dia ' + dslBr(p.desligadoEm) + '</span>');
      else { rod.insertAdjacentHTML('afterbegin', '<button type="button" class="dsl-bt" id="edDesl">' + dslSvg('sair') + 'Registrar Desligamento</button>'); var em = atual; rod.querySelector('#edDesl').onclick = function () { dslModal(em); }; }
    }
    document.querySelectorAll('#grade td.col-nome button[data-pessoa]').forEach(function (b) {
      var p = dslPessoa(b.getAttribute('data-pessoa')); if (!p.desligadoEm || b.parentNode.querySelector('.dsl-chip')) return;
      b.insertAdjacentHTML('afterend', '<span class="dsl-chip" title="Desligamento registrado">Desligado ' + dslBr(p.desligadoEm).slice(0, 5) + '</span>');
    });
  }
  var pend = 0; new MutationObserver(function () { if (pend) return; pend = requestAnimationFrame(function () { pend = 0; try { pintar(); } catch (e) { } }); }).observe(document.body, { childList: true, subtree: true });
})();
</script>
