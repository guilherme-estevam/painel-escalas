<style>
/* ===================== dia com troca pendente: mostra antes de pedir outra ===================== */
.tpd{border-radius:16px;padding:14px 16px;margin:14px 0 4px;background:#FFF7E5;border:1.5px solid #F2C14E}
html[data-tema="escuro"] .tpd{background:#2e2611;border-color:#8a6d1f}
.tpd-cab{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.tpd-ic{width:40px;height:40px;border-radius:12px;background:#F2C14E;color:#5a3d00;display:flex;align-items:center;justify-content:center;flex:none}
.tpd-cab b{display:block;font-size:15.5px;color:var(--preto)}
.tpd-cab span{font-size:12.5px;color:var(--c4)}
.tpd-lista{display:grid;gap:8px}
.tpd-item{display:flex;align-items:center;gap:10px;background:var(--sup,#fff);border-radius:12px;padding:9px 11px;border:1px solid rgba(138,90,0,.15)}
html[data-tema="escuro"] .tpd-item{background:#1f1b14;border-color:#4a3c1a}
.tpd-item .av,.tpd-item .grupo-ic{width:34px;height:34px;font-size:11px;flex:none}
.tpd-item .grupo-ic{border-radius:50%;background:var(--roxo-bg);color:var(--roxo);display:flex;align-items:center;justify-content:center}
.tpd-item .txt{flex:1;min-width:0;font-size:13.5px}
.tpd-item .txt .l2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.tpd-st{display:inline-flex;align-items:center;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:800;background:var(--c1);color:var(--c4)}
.tpd-st.voce{background:var(--rosa);color:#fff} .tpd-st.gestao{background:var(--roxo-bg);color:var(--roxo)}
.tpd-nota{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#6b4e00;margin-top:10px;line-height:1.45}
html[data-tema="escuro"] .tpd-nota{color:#f3d98c}
.tpd-trava{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.65);font-size:12.5px;color:#5a3d00;line-height:1.45}
html[data-tema="escuro"] .tpd-trava{background:rgba(0,0,0,.25);color:#f3d98c}
.tpd-item .bts{display:flex;gap:8px;flex:none}
.dia.clic .pendtag{background:#F2C14E;color:#5a3d00}
@media (max-width:640px){ .tpd-item{flex-wrap:wrap} .tpd-item .bts{width:100%} .tpd-item .bts .btn{flex:1} }
.modal.resposta{max-width:min(1040px,94vw);max-height:94vh}
.modal.resposta .prev-lado{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.modal.resposta .prev-lado > *:not(.previa-p){grid-column:1/-1}
.modal.resposta .prev-lado > .previa-p{margin:0}
@media (max-width:820px){ .modal.resposta .prev-lado{grid-template-columns:1fr} }
</style>
<script>
/* ===================== dia com troca pendente: mostra antes de pedir outra ===================== */
var TPD_IC={alerta:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  grupo:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M17 11h4M19 9v4"/></svg>',
  info:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>'};
var TPD_PEND=['ABERTA','AGUARDANDO_COLEGA','AGUARDANDO_GESTAO'];
function situacaoTpd(t, eu){
  if(t.status==='AGUARDANDO_COLEGA' && t.colega===eu) return {cls:'voce', txt:'Esperando a sua resposta'};
  if(t.status==='AGUARDANDO_COLEGA') return {cls:'', txt:'Esperando '+primeiro(t.nomeColega)+' responder'};
  if(t.status==='ABERTA') return {cls:'', txt:'Em aberto · esperando um colega aceitar'};
  return {cls:'gestao', txt:'Esperando aprovação da coordenação'};
}
var TPD_TRAVA='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
var _escolherTipoTroca_24 = escolherTipoTroca;
escolherTipoTroca = function(dia){
  _escolherTipoTroca_24(dia);
  var pend=(estado.jor && estado.jor.trocasPendentes) || [];
  if(!dia || pend.indexOf(dia)<0) return;
  var w=[].slice.call(document.querySelectorAll('#modais .modal-fundo')).pop(); if(!w) return;
  var esc2=w.querySelector('.esc2'); if(!esc2) return;
  esc2.style.display='none';
  var bloco=document.createElement('div'); bloco.className='tpd'; bloco.innerHTML='<div class="carregando" style="min-height:60px"><div class="giro"></div> Conferindo a troca deste dia…</div>';
  esc2.parentNode.insertBefore(bloco, esc2);
  chamar('apiTrocasV2', estado.token, null).then(function(r){
    var eu=r.eu, todas=r.itens||[];
    var lista=todas.filter(function(t){ return TPD_PEND.indexOf(t.status)>=0 && (t.solicitante===eu || t.colega===eu) && (t.dataSolicitante===dia || t.dataColega===dia); });
    if(!lista.length){ bloco.remove(); esc2.style.display=''; return; }
    var h3=w.querySelector('.tq h3'), sub0=w.querySelector('.tq > p.sub'); if(h3) h3.textContent='Troca pendente neste dia'; if(sub0) sub0.style.display='none';
    var resp=lista.filter(function(t){ return t.status==='AGUARDANDO_COLEGA' && t.colega===eu; });
    var reserv=lista.filter(function(t){ return t.status==='AGUARDANDO_GESTAO'; });
    var tit, sub, trava;
    if(resp.length){
      tit='Antes de pedir uma troca, responda o pedido para este dia';
      sub=esc(primeiro(resp[0].nomeSolicitante))+' pediu uma troca com você em '+dSem(dia)+'.';
      trava='Se você <b>recusar</b>, este dia fica livre e você pode pedir outra troca. Se <b>aceitar</b>, o dia fica reservado para essa troca até a coordenação decidir.';
    } else if(reserv.length){
      tit='Este dia já está reservado para uma troca';
      sub='Ela está esperando a aprovação da coordenação.';
      trava='Enquanto a coordenação não decidir, não é possível pedir outra troca para este dia. Se a troca for recusada, o dia fica livre de novo.';
    } else {
      tit='Você já pediu uma troca para este dia';
      sub='O pedido ainda está esperando um colega aceitar.';
      trava='Para pedir outra troca para este dia, <b>cancele o pedido atual</b> primeiro.';
    }
    bloco.innerHTML='<div class="tpd-cab"><span class="tpd-ic">'+TPD_IC.alerta+'</span><div><b>'+tit+'</b><span>'+sub+'</span></div></div>'+
      '<div class="tpd-lista">'+lista.map(function(t){
        var hor=ehHorarioT(t), sou=t.solicitante===eu, st=situacaoTpd(t, eu), outro=sou ? (t.colega ? {e:t.colega, n:t.nomeColega} : null) : {e:t.solicitante, n:t.nomeSolicitante};
        var quem = sou ? 'Você pediu uma troca de '+(hor?'horário':'dia')+(t.colega?' com <b>'+esc(t.nomeColega)+'</b>':' <b>em aberto</b>') : '<b>'+esc(t.nomeSolicitante)+'</b> pediu uma troca de '+(hor?'horário':'dia')+' com você';
        var chip = hor ? '<span class="prr-chip">Horário · '+dSem(t.dataSolicitante)+'</span>' : '<span class="prr-chip prr-tdia">'+dSem(t.dataSolicitante)+' ⇄ '+dSem(t.dataColega)+'</span>';
        var acao;
        if(st.cls==='voce') acao='<button class="btn sec peq" data-tpd="recusar" data-id="'+esc(t.id)+'">Recusar</button><button class="btn peq" data-tpd="aceitar" data-id="'+esc(t.id)+'">Ver e responder</button>';
        else if(sou && t.status!=='AGUARDANDO_GESTAO') acao='<button class="btn sec peq" data-tpd="cancelar" data-id="'+esc(t.id)+'">Cancelar meu pedido</button>';
        else acao='<button class="btn sec peq" data-tpd="ver" data-id="'+esc(t.id)+'">Ver em Minhas trocas</button>';
        return '<div class="tpd-item">'+(outro?avatarHtml(outro.e, outro.n, ''):'<span class="grupo-ic">'+TPD_IC.grupo+'</span>')+'<div class="txt">'+quem+'<div class="l2">'+chip+'<span class="tpd-st '+st.cls+'">'+st.txt+'</span></div></div><div class="bts">'+acao+'</div></div>'; }).join('')+'</div>'+
      '<div class="tpd-trava">'+TPD_TRAVA+'<span>'+trava+'</span></div>';
    atualizarAvatares();
    bloco.querySelectorAll('[data-tpd]').forEach(function(b){ b.onclick=function(){
      var a=b.dataset.tpd; w.remove();
      if(a==='ver'){ var s=$('secTrocas'); if(s) s.scrollIntoView({behavior:'smooth', block:'start'}); return; }
      acaoTrocaAgenteV2(a, b.dataset.id, todas);
    }; });
  }).catch(function(){ bloco.remove(); esc2.style.display=''; });
};
/* calendário: dica no dia com troca pendente */
var _desenharMinhaEscala_24 = desenharMinhaEscala;
desenharMinhaEscala = function(d){
  _desenharMinhaEscala_24(d);
  var main=$('conteudo'); if(!main) return;
  main.querySelectorAll('.dia.clic .pendtag').forEach(function(t){ var c=t.closest('.dia'); if(c){ c.title='Este dia tem troca pendente. Clique para ver e responder.'; c.setAttribute('aria-label', (c.getAttribute('aria-label')||'')+' · tem troca pendente'); } });
};
/* modais de resposta (aceitar troca) maiores: mostram tudo sem rolar; a semana das duas pessoas fica lado a lado */
function ampliarResposta(){
  var m=[].slice.call(document.querySelectorAll('#modais .modal')).pop(); if(!m || /Recusar/.test((m.querySelector('h3')||{}).textContent||'')) return;
  m.classList.add('grande','resposta');
  var pv=m.querySelectorAll('.previa-p'); if(pv.length>1 && pv[0].parentNode===pv[1].parentNode) pv[0].parentNode.classList.add('prev-lado');
  if(window.MutationObserver){ var ob=new MutationObserver(function(){ var q=m.querySelectorAll('.previa-p'); if(q.length>1 && q[0].parentNode===q[1].parentNode) q[0].parentNode.classList.add('prev-lado'); }); ob.observe(m, {childList:true, subtree:true}); setTimeout(function(){ ob.disconnect(); }, 8000); }
}
var _acaoTrocaAgenteV2_24 = acaoTrocaAgenteV2;
acaoTrocaAgenteV2 = function(acao, id, lista){ var r=_acaoTrocaAgenteV2_24(acao, id, lista); if(acao==='aceitar') ampliarResposta(); return r; };
var _modalAceitarOferta_24 = modalAceitarOferta;
modalAceitarOferta = function(t){ var r=_modalAceitarOferta_24(t); ampliarResposta(); return r; };
</script>
